MET.recurring={label:'Recurring costs',fmt:'money',good:-1,bank:'recurring',def:'Software, contractors and fixed monthly costs.',src:'Bank feed'};

const PG=(()=>{
  const {D,dateOf,CLIENTS,BRANDS,BI,CAMPAIGNS,ADSETS,ADS,PRODUCTS,PIECES,INVOICES,BANK,S,CUSTOMERS,inGap,campWeight}=DEMO;
  const CI=Object.fromEntries(CLIENTS.map(c=>[c.id,c])), CPI=Object.fromEntries(CAMPAIGNS.map(c=>[c.id,c]));
  const SI=Object.fromEntries(ADSETS.map(s=>[s.id,s])), AI=Object.fromEntries(ADS.map(a=>[a.id,a]));
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const dfmt=(d,o={month:'short',day:'numeric'})=>dateOf(d).toLocaleDateString('en-US',o);
  const wrap=document.getElementById('pgwrap'), pages=document.getElementById('pages');
  const BASE=['sessions','orders','units','revenue','refunds','cogs','shipping','fees','newCust','retCust','adSpend','impressions','reach','clicks',
    'purchases','attrRevenue','leads','engagements','lpv','organicReach','nonFollowerReach','saves','shares','follows','linkClicks','posts',
    'emailRev','emailSends','emailOpens','emailClicks','smsRev','billed','collected','deliveryCost','gapDay'];
  const PAID=['adSpend','impressions','reach','clicks','purchases','attrRevenue','leads','engagements','lpv'];

  /* ---------------- scope → daily arrays (cached) ---------------- */
  const cache=new Map();
  const zero=()=>Object.fromEntries(BASE.map(k=>[k,new Float64Array(D)]));
  function billing(clientIds){ const o={billed:new Float64Array(D),collected:new Float64Array(D),deliveryCost:new Float64Array(D)};
    for(const iv of INVOICES){ if(!clientIds.includes(iv.client)) continue; o.billed[iv.d]+=iv.amount; o.deliveryCost[iv.d]+=iv.deliveryCost; if(iv.paid!=null) o.collected[iv.paid]+=iv.amount; } return o; }
  function daily(sc){ const key=sc.t+':'+(sc.id||''); if(cache.has(key)) return cache.get(key);
    let o=zero();
    const addBrand=(bid,k=1)=>{ const s=S[bid]; for(const f of BASE){ if(!s[f]) continue; const t=o[f]; for(let d=0;d<D;d++) t[d]+=s[f][d]*k; } };
    if(sc.t==='portfolio'){ BRANDS.forEach(b=>addBrand(b.id)); Object.assign(o,billing(CLIENTS.map(c=>c.id))); o.gapDay=new Float64Array(D); }
    else if(sc.t==='client'){ BRANDS.filter(b=>b.client===sc.id).forEach(b=>addBrand(b.id)); Object.assign(o,billing([sc.id]));
      if(sc.id!=='own') o.gapDay=new Float64Array(D); }
    else if(sc.t==='brand') addBrand(sc.id);
    else if(sc.t==='campaign'){ const c=CPI[sc.id], s=S[c.brand], sib=CAMPAIGNS.filter(x=>x.brand===c.brand);
      for(let d=c.start;d<=c.end;d++){ let W=0; for(const x of sib) if(d>=x.start&&d<=x.end) W+=campWeight(x);
        const share=campWeight(c)/Math.max(W,1);
        for(const f of BASE){ if(PAID.includes(f)||!s[f]||f==='gapDay') continue; o[f][d]=s[f][d]*share; }
        o.gapDay[d]=s.gapDay[d]; }
      if(c.skus.length){ o.units=new Float64Array(D); o.revenue=new Float64Array(D); o.cogs=new Float64Array(D);
        for(const pid of c.skus){ const p=PRODUCTS.find(x=>x.id===pid); for(let d=c.start;d<D;d++){ o.units[d]+=p.units[d]; o.revenue[d]+=p.units[d]*p.price; o.cogs[d]+=p.units[d]*p.cost; } }
        const upo=BI[c.brand].upo; for(let d=c.start;d<D;d++){ const ord=Math.round(o.units[d]/upo), br=s.orders[d]||1, nsh=s.newCust[d]/br;
          o.orders[d]=ord; o.newCust[d]=Math.round(ord*nsh); o.retCust[d]=ord-o.newCust[d]; o.shipping[d]=ord*BI[c.brand].ship; o.fees[d]=o.revenue[d]*.029+ord*.3; o.refunds[d]=o.revenue[d]*.024; } }
      for(const sid of c.adsets) for(const aid of SI[sid].ads) addAd(o,AI[aid]); }
    else if(sc.t==='adset'){ for(const aid of SI[sc.id].ads) addAd(o,AI[aid]); }
    else if(sc.t==='ad'){ addAd(o,AI[sc.id]); }
    cache.set(key,o); return o; }
  function addAd(o,a){ const map={spend:'adSpend',impressions:'impressions',reach:'reach',clicks:'clicks',purchases:'purchases',attrRevenue:'attrRevenue',leads:'leads',engagements:'engagements',lpv:'lpv'};
    for(const [k,t] of Object.entries(map)) for(let d=0;d<D;d++) o[t][d]+=a[k][d]; }

  /* ---------------- windows ---------------- */
  function windowOf(sc,period){
    if(sc.t==='campaign'||sc.t==='adset'||sc.t==='ad'){ const c=CPI[sc.t==='campaign'?sc.id:sc.t==='adset'?SI[sc.id].camp:AI[sc.id].camp];
      const a=c.start, b=Math.min(c.end,D-1);
      /* compare to the previous campaign of the same kind for this brand, aligned by elapsed days */
      const prev=CAMPAIGNS.filter(x=>x.brand===c.brand&&x.type===c.type&&x.start<c.start).sort((x,y)=>y.start-x.start)[0];
      if(c.type==='always-on'||!prev){ const n=b-a+1; return {a,b,pa:Math.max(0,a-n),pb:a-1,cmpLabel:'previous period',camp:c}; }
      if(sc.t!=='campaign') return {a,b,pa:null,pb:null,cmpLabel:null,camp:c};
      return {a,b,pa:prev.start,pb:prev.start+(b-a),cmpLabel:'vs '+prev.name.split(' — ')[0]+(prev.name.includes('—')?' — '+prev.name.split(' — ')[1]:''),camp:c,prev}; }
    const n=period>=D?D:period; return {a:D-n,b:D-1,pa:Math.max(0,D-2*n),pb:D-n-1,cmpLabel:period>=D?null:'previous '+n+' days'}; }

  /* ---------------- totals + metric values ---------------- */
  function totals(o,a,b){ const t={}; for(const k of BASE){ let s=0; const arr=o[k]; for(let d=a;d<=b;d++) s+=arr[d]; t[k]=s; } t.days=b-a+1; return t; }
  const BANKMODE={on:false};
  function outstandingAt(clientIds,d){ let s=0; for(const iv of INVOICES) if(clientIds.includes(iv.client)&&iv.d<=d&&(iv.paid==null||iv.paid>d)) s+=iv.amount; return s; }
  function bankVal(kind,a,b){ if(!BANKMODE.on) return {nc:true};
    if(kind==='cash') return {v:BANK.cash[b]};
    let net=0,out=0; for(let d=a;d<=b;d++){ net+=BANK.inflow[d]-BANK.outflow[d]; out+=BANK.outflow[d]; }
    if(kind==='net') return {v:net}; if(kind==='tax') return {v:Math.max(0,net)*.28};
    if(kind==='recurring'){ let r=0; for(let d=a;d<=b;d++){ const dd=dateOf(d).getDate(); if(dd===1) r+=2150; if(dd===15) r+=900; } return {v:r}; }
    if(kind==='runway'){ let n9=0; for(let d=Math.max(0,b-89);d<=b;d++) n9+=BANK.inflow[d]-BANK.outflow[d]; const burn=-n9/3; return {v:burn<=0?Infinity:BANK.cash[b]/burn}; }
    return {nc:true}; }
  function campVal(kind,c,b){ const skus=c.skus.map(id=>PRODUCTS.find(p=>p.id===id));
    if(kind==='vsTarget'){ if(!c.target) return {na:'no target set'}; const o=daily({t:'campaign',id:c.id}); let r=0; for(let d=c.start;d<=b;d++) r+=o.revenue[d]; return {v:r/c.target}; }
    if(!skus.length) return {na:'no campaign products'};
    let sold=0, stock=0; for(const p of skus){ stock+=p.stock0; for(let d=c.start;d<=b;d++) sold+=p.units[d]; }
    if(kind==='sellThrough') return stock<20?{n:stock,need:20}:{v:sold/stock};
    if(kind==='daysToSellOut'){ let last=null; for(const p of skus){ let cum=0, out=null; for(let d=p.launch;d<=b;d++){ cum+=p.units[d]; if(cum>=p.stock0){ out=d; break; } } if(out==null) return {na:'not sold out'}; last=Math.max(last??0,out); }
      return {v:last-c.launch+1}; }
    return {na:'—'}; }
  function custVal(sc,b){ const ids=sc.t==='brand'?[sc.id]:sc.t==='client'?BRANDS.filter(x=>x.client===sc.id).map(x=>x.id):sc.t==='portfolio'?BRANDS.map(x=>x.id):[];
    let n=0, rep=0; for(const id of ids) for(const c of CUSTOMERS[id]) if(c.first<=b){ n++; if(c.orders>1&&(c.first<b)) rep++; }
    return n<40?{n,need:40}:{v:rep/n}; }
  function value(k,sc,o,a,b,t){ const m=MET[k]; t=t||totals(o,a,b);
    if(m.bank) return bankVal(m.bank,a,b);
    if(m.point==='outstanding'){ const ids=sc.t==='client'?[sc.id]:CLIENTS.map(c=>c.id); return {v:outstandingAt(ids,b)}; }
    if(m.camp){ const c=sc.t==='campaign'?CPI[sc.id]:null; return c?campVal(m.camp,c,Math.min(b,D-1)):{na:'—'}; }
    if(m.cust) return custVal(sc,b);
    if(m.sum) return {v:t[m.sum]};
    if(m.fn){ const n=m.minFn?m.minFn(t):Infinity; if(m.min&&n<m.min) return {n,need:m.min}; const v=m.fn(t); return v==null?{na:'—'}:{v}; }
    const den=t[m.den]; if(m.min&&den<m.min) return {n:Math.round(den),need:m.min,unit:MET[m.den]?MET[m.den].label.toLowerCase():m.den};
    return den?{v:t[m.num]/den*(m.scale||1)}:{na:'—'}; }
  function series(k,sc,o,a,b){ const m=MET[k], n=b-a+1, out=[];
    if(m.bank){ if(!BANKMODE.on) return null; for(let d=a;d<=b;d++) out.push(m.bank==='cash'?BANK.cash[d]:m.bank==='runway'?null:BANK.inflow[d]-BANK.outflow[d]); return m.bank==='runway'?null:out; }
    if(m.camp||m.cust) return null;
    if(m.point==='outstanding'){ const ids=sc.t==='client'?[sc.id]:CLIENTS.map(c=>c.id); for(let d=a;d<=b;d++) out.push(outstandingAt(ids,d)); return out; }
    const W=n>150?7:1, roll=(m.sum||m.add)?0:7;   /* totals plot per day; ratios as a 7-day rolling rate */
    for(let d=a;d<=b;d+=W){ const lo=roll?Math.max(0,d+W-roll):d, t=totals(o,lo,Math.min(b,d+W-1)); const r=value(k,sc,o,lo,Math.min(b,d+W-1),t); out.push(r.v??null); }
    return out; }

  /* ---------------- UI bits ---------------- */
  const spark=(arr,w=92,h=24)=>{ if(!arr||arr.length<2) return ''; const v=arr.filter(x=>x!=null&&isFinite(x)); if(v.length<2) return '';
    const lo=Math.min(...v), hi=Math.max(...v), r=hi-lo||1; let p='';
    arr.forEach((x,i)=>{ if(x==null||!isFinite(x)) return; const X=i/(arr.length-1)*w, Y=h-2-(x-lo)/r*(h-4); p+=(p?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1); });
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${p}"/></svg>`; };
  function delta(k,cur,prev,adj){ const m=MET[k]; if(cur.v==null||prev==null||prev.v==null||!isFinite(prev.v)||!isFinite(cur.v)||prev.v===0) return '';
    const ch=(cur.v-prev.v)/Math.abs(prev.v); if(!isFinite(ch)) return ''; const dir=ch>0?1:ch<0?-1:0, good=m.good===0?0:dir*m.good;
    return `<span class="dl ${good>0?'up':good<0?'dn':'nt'}">${dir>0?'▲':dir<0?'▼':'•'} ${Math.abs(ch*100).toFixed(1)}%${adj?' <i>adj.</i>':''}</span>`; }
  function valHTML(r,m){ if(r.v===Infinity&&m.fmt==='months') return `<div class="v">self-funding</div>`; if(r.nc) return `<div class="v nc">Not connected</div><div class="sub">${esc(m.src)}</div>`;
    if(r.need!=null) return `<div class="v ins">Insufficient data</div><div class="sub">n=${Math.round(r.n).toLocaleString('en-US')} · need ${r.need.toLocaleString('en-US')}${r.unit?' '+esc(r.unit):''}</div>`;
    if(r.na) return `<div class="v ins">${esc(r.na)}</div><div class="sub">&nbsp;</div>`;
    return `<div class="v">${fmtV(r.v,m.fmt)}</div>`; }

  /* =============================================================== ANALYTICS */
  const PULSE={portfolio:{performance:['revenue','orders','newCust','mer','organicReach'],money:['cash','runway','netProfit','contribution','collected']},
    client:{performance:['revenue','managedSpend','mer','newCust'],money:['billed','collected','outstanding','workMargin']},
    clientOwn:{performance:['revenue','orders','mer','newCust'],money:['revenue','contribution','contribMargin','adSpend']},
    brand:{performance:['revenue','orders','convRate','newShare','mer','repeatRate'],money:['revenue','grossMargin','contribution','contribMargin','adSpend']},
    campaign:{performance:['revenue','vsTarget','sellThrough','costPerNew','roas'],money:['revenue','adSpend','contribution','cogs']}};
  const GOAL_PULSE={Purchases:['cpa','roas','purchases','adSpend','ctr'],Leads:['cpl','leads','adSpend','ctr','cpm'],Reach:['cpm','reach','frequency','adSpend','impressions'],
    Engagement:['cpe','engagements','adSpend','ctr','cpm'],Traffic:['cplpv','lpv','cpc','adSpend','ctr']};
  const GOAL_KPI={Purchases:'cpa',Leads:'cpl',Reach:'cpm',Engagement:'cpe',Traffic:'cplpv'};
  const DRIVERS={portfolio:{performance:['sessions','convRate','aov','adSpend','roas','newShare','emailRev','follows'],money:['revenue','refunds','cogs','shipping','fees','adSpend','grossProfit','billed','outstanding','recurring','taxSetAside']},
    client:{performance:['orders','sessions','convRate','aov','roas','organicReach','emailRev','follows'],money:['revenue','contribution','managedSpend','deliveryCost','billed']},
    brand:{performance:['sessions','aov','newCust','retCust','adSpend','roas','costPerNew','organicReach','nonFollowerShare','savesPerK','emailRev','openRate','smsRev'],money:['refunds','cogs','shipping','fees','grossProfit','mer','aov','units']},
    campaign:{performance:['orders','units','sessions','convRate','adSpend','cpa','cpm','ctr','frequency','daysToSellOut','newCust'],money:['refunds','shipping','fees','grossProfit','contribMargin','mer']},
    ad:{performance:['impressions','reach','frequency','cpm','ctr','cpc','clicks','adSpend'],money:['impressions','reach','frequency','cpm','ctr','cpc','clicks','adSpend']}};
  const TABS={portfolio:['Clients','Brands'],client:['Brands','Invoices'],clientOwn:['Brands'],brand:['Campaigns','Channels','Products','Content','Email'],
    campaign:['Ad sets & ads','Products','Daily'],adset:['Ads','Daily'],ad:['Daily']};
  const PERIODS=[[7,'7d'],[30,'30d'],[90,'90d'],[182,'6mo'],[365,'1yr'],[D,'All']];
  const A_DEF=()=>({at:'portfolio',p:30,lens:'performance',m:null,tab:null,sort:null,dir:-1});

  const parseAt=at=>{ const [t,id]=at.split(':'); return id?{t,id}:{t}; };
  const nameOf=sc=>sc.t==='portfolio'?'Portfolio':sc.t==='client'?CI[sc.id].name:sc.t==='brand'?BI[sc.id].name:sc.t==='campaign'?CPI[sc.id].name:sc.t==='adset'?SI[sc.id].name+' · '+SI[sc.id].goal:AI[sc.id].name;
  function crumbs(sc){ const out=[['portfolio','Portfolio']];
    const add=(t,id)=>out.push([t+':'+id,nameOf({t,id})]);
    if(sc.t==='client') add('client',sc.id);
    if(sc.t==='brand'){ add('client',BI[sc.id].client); add('brand',sc.id); }
    if(sc.t==='campaign'){ const c=CPI[sc.id]; add('client',BI[c.brand].client); add('brand',c.brand); add('campaign',c.id); }
    if(sc.t==='adset'){ const s=SI[sc.id], c=CPI[s.camp]; add('client',BI[c.brand].client); add('brand',c.brand); add('campaign',c.id); add('adset',s.id); }
    if(sc.t==='ad'){ const a=AI[sc.id], s=SI[a.adset], c=CPI[s.camp]; add('client',BI[c.brand].client); add('brand',c.brand); add('campaign',c.id); add('adset',s.id); add('ad',a.id); }
    return out; }
  const layerKey=sc=>sc.t==='client'&&CI[sc.id].own?'clientOwn':sc.t;
  const adGoal=sc=>sc.t==='adset'?SI[sc.id].goal:AI[sc.id].goal;

  function renderAnalytics(v){ const A_ST=v.st;
    const sc=parseAt(A_ST.at), L=layerKey(sc), lens=A_ST.lens, w=windowOf(sc,A_ST.p), o=daily(sc);
    const scP=w.prev?{t:'campaign',id:w.prev.id}:sc, oP=w.prev?daily(scP):o;
    const t=totals(o,w.a,w.b), tp=w.pa!=null?totals(oP,w.pa,w.pb):null;
    const pulse=(sc.t==='adset'||sc.t==='ad')?GOAL_PULSE[adGoal(sc)]:PULSE[L][lens];
    const drivers=(sc.t==='adset'||sc.t==='ad')?DRIVERS.ad.performance:DRIVERS[L==='clientOwn'?'client':L][lens];
    if(!A_ST.m||!MET[A_ST.m]||!pulse.concat(drivers).includes(A_ST.m)) A_ST.m=pulse.find(k=>!MET[k].bank&&!MET[k].camp&&!MET[k].cust)||pulse[0];
    const tabs=TABS[L]; if(!tabs.includes(A_ST.tab)) A_ST.tab=tabs[0];
    /* gap adjustment: compare per active day when dormancy differs between windows */
    const gCur=t.gapDay, gPrev=tp?tp.gapDay:0, adj=tp&&(gCur||gPrev)&&gCur!==gPrev;
    const scaleSum=(k,r)=>{ if(!adj||!r||r.v==null||!MET[k].sum) return r; const ac=t.days-gCur, ap=tp.days-gPrev; return {v:r.v/Math.max(1,ap)*ac}; };
    const card=(k,big)=>{ const m=MET[k], cur=value(k,sc,o,w.a,w.b,t), prev=tp?scaleSum(k,value(k,scP,oP,w.pa,w.pb,tp)):null, ser=big?series(k,sc,o,w.a,w.b):null;
      return `<button class="kpi${big?' big':''}${A_ST.m===k?' on':''}" data-m="${k}" title="${esc(m.label)} — ${esc(m.def)} Source: ${esc(m.src)}.">
        <div class="lb">${esc(m.label)}</div>${valHTML(cur,m)}${cur.v!=null&&tp?`<div class="sub">${delta(k,cur,prev,adj)}</div>`:''}${big?spark(ser):''}</button>`; };
    const cr=crumbs(sc).map(([at,nm],i,arr)=>i===arr.length-1?`<span class="cur">${esc(nm)}</span>`:`<a data-go="${at}">${esc(nm)}</a>`).join('<i>/</i>');
    const isCamp=['campaign','adset','ad'].includes(sc.t), c=w.camp;
    const winLabel=isCamp?`${dfmt(w.a)} – ${dfmt(w.b)}${c&&c.end>=D-1&&c.planEnd>D-1?` · live, day ${D-c.start} of ${c.len}`:''}`:`${dfmt(w.a,{month:'short',day:'numeric',year:'numeric'})} – ${dfmt(w.b,{month:'short',day:'numeric',year:'numeric'})}`;
    const bankCtl=lens==='money'&&(sc.t==='portfolio')?`<label class="tgl"><input type="checkbox" data-bank ${BANKMODE.on?'checked':''}><b></b><span>Preview bank data</span></label>`:'';
    v.el.innerHTML=`
      <div class="pg-head">
        <div class="pg-title"><div class="kick">Analytics <span class="syn">synthetic data</span></div><h1>${esc(nameOf(sc))}</h1><div class="crumbs">${cr}</div></div>
        <div class="pg-ctl">${window.__collapseBtn(v)}
          <div class="seg">${['performance','money'].map(l=>`<button data-lens="${l}" class="${lens===l?'on':''}">${l==='money'?'Money':'Performance'}</button>`).join('')}</div>
          ${isCamp?`<div class="winlbl">${winLabel}</div>`:`<div class="seg">${PERIODS.map(([p,l])=>`<button data-p="${p}" class="${A_ST.p===p?'on':''}">${l}</button>`).join('')}</div>`}
          ${bankCtl}
        </div>
      </div>
      <div class="winrow"><span>${isCamp?esc(CPI[w.camp.id].type):'window'} · ${winLabel}</span>${w.cmpLabel?`<span>compared ${esc(w.cmpLabel.startsWith('vs')?w.cmpLabel:'to '+w.cmpLabel)}</span>`:''}${adj?`<span class="adjn">dormant days excluded — deltas compare per active day (${gCur} vs ${gPrev} dormant)</span>`:''}</div>
      <section class="band pulse n${pulse.length}">${pulse.map(k=>card(k,true)).join('')}</section>
      <section class="glass chart"></section>
      <div class="band-lbl">Drivers</div>
      <section class="band drivers">${drivers.map(k=>card(k,false)).join('')}</section>
      <section class="glass detail"><div class="tabs">${tabs.map(x=>`<button data-tab="${x}" class="${A_ST.tab===x?'on':''}">${x}</button>`).join('')}<button class="exp" data-export>Export CSV</button></div><div class="dtl"></div></section>`;
    drawChart(v,sc,o,w); renderDetail(v,sc,o,w,t); retitle(v);
  }

  /* the brand whose dormancy windows apply to this scope, if any */
  function gapsFor(sc){ let bid=null;
    if(sc.t==='brand') bid=sc.id; else if(sc.t==='client'&&sc.id==='own') bid='ee';
    else if(sc.t==='campaign') bid=CPI[sc.id].brand; else if(sc.t==='adset') bid=CPI[SI[sc.id].camp].brand; else if(sc.t==='ad') bid=CPI[AI[sc.id].camp].brand;
    return bid&&BI[bid].gaps.length?BI[bid]:null; }
  function drawChart(v,sc,o,w){ const A_ST=v.st, k=A_ST.m, m=MET[k], el=v.el.querySelector('.chart'), gid=v.id;
    const scP=w.prev?{t:'campaign',id:w.prev.id}:sc, cur=series(k,sc,o,w.a,w.b), prev=w.pa!=null?series(k,scP,w.prev?daily(scP):o,w.pa,w.pb):null;
    const head=`<div class="ch-head"><div><div class="lb">${esc(m.label)}</div><div class="def">${esc(m.def)} <span>Source: ${esc(m.src)}${m.min?` · trusted from n≥${m.min}`:''}</span></div></div>
      <div class="legend"><span><i class="ln"></i>this window</span>${prev?`<span><i class="ln gh"></i>${esc(w.cmpLabel&&w.cmpLabel.startsWith('vs')?w.cmpLabel.slice(3):'comparison')}</span>`:''}${gapsFor(sc)?'<span><i class="gp"></i>dormant — excluded</span>':''}</div></div>`;
    if(!cur){ el.innerHTML=head+`<div class="ch-empty">${m.bank?'Connect a bank feed to chart this — or switch on the preview.':'This metric is a single figure for the window, not a daily series.'}</div>`; return; }
    const W=Math.max(320,(el.clientWidth||1000)-36),H=214,P=[58,12,26,20], n=cur.length, all=cur.concat(prev||[]).filter(v=>v!=null&&isFinite(v));

    const X=i=>P[0]+i/Math.max(1,n-1)*(W-P[0]-P[1]), Y=v=>P[2]+(1-(v-lo)/(hi-lo))*(H-P[2]-P[3]);
    const path=arr=>{ let p='',pen=false; arr.forEach((v,i)=>{ if(v==null||!isFinite(v)){ pen=false; return; } p+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); pen=true; }); return p; };

    const ticks=[0,.5,1].map(f=>lo+(hi-lo)*f).map(v=>`<text class="yt" x="${P[0]-8}" y="${(Y(v)+3).toFixed(1)}">${fmtV(v,m.fmt)}</text><line class="gl" x1="${P[0]}" x2="${W-P[1]}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`).join('');

  /* ---------------- events, per view ---------------- */
  function onClick(v,e){ const t=e.target.closest('[data-go],[data-lens],[data-p],[data-m],[data-tab],[data-sort],[data-export],[data-nav],[data-cbrand],[data-rec],[data-consent],[data-chip],[data-creset],[data-act],[data-lal],[data-collapse]'); if(!t) return;
    const s=v.st;
    if(t.dataset.collapse!=null){ collapse(v.kind); return; }
    if(v.kind==='analytics'){
      const set=patch=>{ Object.assign(s,patch); if(v.full) history.replaceState(null,'',hashFor(v)); render(v); };
      if(t.dataset.go){ Object.assign(s,{at:t.dataset.go,m:null,tab:null,sort:null}); if(v.full) location.hash=hashFor(v); else { render(v); v.el.parentElement.scrollTop=0; } return; }
      if(t.dataset.lens) return set({lens:t.dataset.lens,m:null});
      if(t.dataset.p) return set({p:+t.dataset.p});
      if(t.dataset.m) return set({m:t.dataset.m});
      if(t.dataset.tab) return set({tab:t.dataset.tab,sort:null});
      if(t.dataset.sort){ if(s.sort===t.dataset.sort) s.dir*=-1; else { s.sort=t.dataset.sort; s.dir=-1; } return render(v); }
      if(t.dataset.export!=null&&v.lastTable){ const {cols,rows,name}=v.lastTable; const strip=x=>String(x==null?'':x).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&');
        const csv=[cols.map(c=>c[1])].concat(rows.map(r=>cols.map(c=>{ const val=c[3](r); const x=typeof val==='number'?(+val.toFixed(4)):strip(val); return /[",\n]/.test(x)?'"'+String(x).replace(/"/g,'""')+'"':x; })));
        download(`analytics-${name}.csv`,csv.map(r=>r.join(',')).join('\n')); return; } }
    if(t.dataset.nav){ const [pg,q]=t.dataset.nav.split('?'), at=new URLSearchParams(q||'').get('at');
      /* from a window, a link opens another window instead of leaving the console */
      if(v.full) location.hash='#/'+t.dataset.nav; else spawn(pg,pg==='analytics'?{...A_DEF(),at:at||'portfolio'}:{},null,v); return; }
    if(v.kind==='customers'){
      if(t.dataset.cbrand){ s.brand=t.dataset.cbrand; s.cats.clear(); s.states.clear(); return render(v); }
      if(t.dataset.rec){ s.recMode=t.dataset.rec; return render(v); }
      if(t.dataset.consent){ s.consent=t.dataset.consent; return render(v); }
      if(t.dataset.chip){ const set=s[t.dataset.chip], val=t.dataset.v; set.has(val)?set.delete(val):set.add(val); t.classList.toggle('on'); renderResults(v); retitle(v); saveSoon(); return; }
      if(t.dataset.creset!=null){ Object.assign(s,C_DEF()); return render(v); }
      if(t.dataset.lal){ v.el.querySelector('.actpanel').innerHTML=`<div class="ap"><b>${t.dataset.lal} lookalike queued (demo)</b><div class="meta">Meta will build it from the hashed seed within a few hours.</div></div>`; return; }
      if(t.dataset.act==='confirm-meta'){ v.el.querySelector('.actpanel').innerHTML=`<div class="ap"><b>Synced (simulated).</b><div class="meta">Recorded: segment definition, ${CUSTOMERS[s.brand].filter(matcher(s)).length.toLocaleString('en-US')} people, sync time. No identifiers stored.</div></div>`; return; }
      if(t.dataset.act==='confirm-save'){ const nm=(v.el.querySelector('.segname').value||'').trim()||'Untitled segment';
        SEGS.unshift({name:nm,brand:s.brand,n:CUSTOMERS[s.brand].filter(matcher(s)).length,synced:'never'}); SEGS=SEGS.slice(0,12); saveSegs(); allViews().filter(x=>x.kind==='customers'&&(x.full?CUR==='customers':true)).forEach(x=>renderResults(x)); return; }
      if(t.dataset.act) return actPanel(v,t.dataset.act); } }
  function onInput(v,e){ const el=e.target; if(v.kind!=='customers'||!el.dataset.num) return; const s=v.st, k=el.dataset.num; s[k]=+el.value;
    if(k==='ordMin'&&s.ordMin>s.ordMax) s.ordMax=s.ordMin; if(k==='ordMax'&&s.ordMax<s.ordMin) s.ordMin=s.ordMax;
    if(k==='spendMax'&&s.spendMax&&s.spendMax<s.spendMin) s.spendMin=s.spendMax;

    if(lab){ if(k==='recDays') lab.textContent=s.recDays+' days'; else if(k.startsWith('ord')) lab.textContent=s.ordMin+'–'+(s.ordMax>=30?'30+':s.ordMax);
      else if(k.startsWith('spend')) lab.textContent=(s.spendMin?'$'+s.spendMin:'$0')+'–'+(s.spendMax?'$'+s.spendMax:'any'); else if(k==='firstWithin') lab.textContent=s.firstWithin?s.firstWithin+' days':'any time'; }
    renderResults(v); retitle(v); saveSoon(); }
  function onChange(v,e){ if(e.target.matches('[data-bank]')){ BANKMODE.on=e.target.checked; allViews().filter(x=>x.kind==='analytics'&&(!x.full||CUR==='analytics')).forEach(render); } }
  const curFull=()=>FULL[CUR];
  wrap.addEventListener('click',e=>{ const v=curFull(); if(v) onClick(v,e); });
  wrap.addEventListener('input',e=>{ const v=curFull(); if(v) onInput(v,e); });
  wrap.addEventListener('change',e=>{ const v=curFull(); if(v) onChange(v,e); });
  const allViews=()=>KINDS.map(k=>FULL[k]).concat(WINS);

  /* ---------------- windows ---------------- */
  const WIN_KEY='vault-console-windows-v1', HDR=()=>innerWidth<=700?96:64, MINW=340, MINH=240;
  const SIZE={analytics:[680,580],operations:[620,560],customers:[720,600]}, lastGeom={};
  const serial=v=>{ const st={...v.st}; for(const k of ['cats','states','tiers','chans']) if(st[k] instanceof Set) st[k]=[...st[k]]; delete st.sort; return st; };
  const revive=(kind,st)=>{ const s={...DEF[kind](),...(st||{})}; if(kind==='customers') for(const k of ['cats','states','tiers','chans']) s[k]=new Set((st&&st[k])||[]); return s; };
  function fit(g){ const W=innerWidth, H=innerHeight, top=HDR()+6;
    const w=clamp(g.w,Math.min(MINW,W-16),W-16), h=clamp(g.h,Math.min(MINH,H-top-12),H-top-12);
    return {x:clamp(g.x,8,W-w-8),y:clamp(g.y,top,H-h-8),w,h}; }
  function place(v,g){ v.g=fit(g); Object.assign(v.win.style,{left:v.g.x+'px',top:v.g.y+'px',width:v.g.w+'px',height:v.g.h+'px'}); }
  function cascade(kind){ const [w,h]=SIZE[kind], n=WINS.length%6; return {x:innerWidth-w-36-n*30,y:HDR()+18+n*30,w,h}; }
  function front(v){ v.win.style.zIndex=++zTop; WINS.forEach(x=>x.win.classList.toggle('front',x===v)); }
  let saveT=0; function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(WIN_KEY,JSON.stringify(WINS.slice().sort((a,b)=>(+a.win.style.zIndex)-(+b.win.style.zIndex)).map(v=>({kind:v.kind,st:serial(v),g:v.g})))); }catch(_){} },250); }
  function spawn(kind,st,geom,near,quiet){ if(!KINDS.includes(kind)) return null;
    const v={id:'w'+(++seq),kind,st:revive(kind,st),full:false};
    const w=document.createElement('div'); w.className='win'; w.setAttribute('role','dialog'); w.setAttribute('aria-label',TITLE[kind]+' window');
    w.innerHTML=`<div class="win-bar"><span class="win-t">${TITLE[kind]}</span><span class="win-s"></span>
      <button data-w="full" title="Open as full page" aria-label="Open as full page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
      <button data-w="close" title="Close" aria-label="Close window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="win-body"><div class="pgv"></div></div>${['e','w','s','se','sw'].map(d=>`<i class="rz ${d}" data-rz="${d}"></i>`).join('')}`;
    v.win=w; v.el=w.querySelector('.pgv'); layer.appendChild(w); WINS.push(v);
    let g=geom||lastGeom[kind]||cascade(kind);
    if(near&&!geom){ g={...g,x:near.g.x+34,y:near.g.y+34}; }
    place(v,g); front(v);
    v.el.addEventListener('click',e=>onClick(v,e)); v.el.addEventListener('input',e=>onInput(v,e)); v.el.addEventListener('change',e=>onChange(v,e));
    w.addEventListener('pointerdown',()=>{ if(w.style.zIndex!=zTop){ front(v); saveSoon(); } },true);
    w.querySelector('[data-w="close"]').addEventListener('click',()=>closeWin(v));
    w.querySelector('[data-w="full"]').addEventListener('click',()=>expand(v));
    dragify(v); render(v);
    if(v.kind==='analytics'&&window.ResizeObserver){ let rt=0, lw=0; new ResizeObserver(en=>{ const cw=Math.round(en[0].contentRect.width); if(Math.abs(cw-lw)<8) return; lw=cw; clearTimeout(rt); rt=setTimeout(()=>render(v),120); }).observe(v.el); }
    if(!quiet) saveSoon(); return v; }
  function closeWin(v){ lastGeom[v.kind]=v.g; v.win.classList.add('closing'); setTimeout(()=>v.win.remove(),160); WINS.splice(WINS.indexOf(v),1); saveSoon(); }
  function expand(v){ FULL[v.kind].st=revive(v.kind,serial(v)); lastGeom[v.kind]=v.g; closeWin(v); location.hash=hashFor(FULL[v.kind]); }
  function collapse(kind){ const f=FULL[kind]; spawn(kind,serial(f),lastGeom[kind]||null); location.hash='#/'; }
  function dragify(v){ const w=v.win, bar=w.querySelector('.win-bar');
    const start=(e,mode)=>{ if(e.button!==0) return; e.preventDefault(); const g0={...v.g}, x0=e.clientX, y0=e.clientY, el=e.currentTarget;
      el.setPointerCapture(e.pointerId); w.classList.add('moving');
      const mv=ev=>{ const dx=ev.clientX-x0, dy=ev.clientY-y0, g={...g0};
        if(mode==='move'){ g.x+=dx; g.y+=dy; }
        else { if(mode.includes('e')) g.w=Math.max(MINW,g0.w+dx); if(mode.includes('s')) g.h=Math.max(MINH,g0.h+dy);
          if(mode.includes('w')){ const nw=Math.max(MINW,g0.w-dx); g.x=g0.x+(g0.w-nw); g.w=nw; } }
        place(v,g); };
      const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up); w.classList.remove('moving'); saveSoon(); };
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); };
    bar.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; start(e,'move'); });
    bar.addEventListener('dblclick',e=>{ if(!e.target.closest('button')) expand(v); });
    w.querySelectorAll('.rz').forEach(h=>h.addEventListener('pointerdown',e=>start(e,h.dataset.rz))); }
  addEventListener('resize',()=>{ WINS.forEach(v=>place(v,v.g)); });

  /* ---------------- the launcher: new window without leaving the console ---------------- */
  const addBtn=document.getElementById('addwin'), addMenu=document.getElementById('addmenu');
  const menu=o=>{ if(o){ const r=addBtn.getBoundingClientRect(); addMenu.style.left=Math.max(8,Math.min(innerWidth-228,r.left))+'px'; addMenu.style.top=(r.bottom+8)+'px'; }
    addMenu.hidden=!o; addBtn.setAttribute('aria-expanded',o?'true':'false'); };
  addBtn.addEventListener('click',e=>{ e.stopPropagation(); menu(addMenu.hidden); });
  addMenu.addEventListener('click',e=>{ const b=e.target.closest('[data-new]'); if(!b) return; menu(false);
    const kind=b.dataset.new; spawn(kind,serial(FULL[kind])); if(CUR!=='console') location.hash='#/'; });
  addEventListener('click',e=>{ if(!addMenu.hidden&&!e.target.closest('#addmenu')) menu(false); });
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&!addMenu.hidden) menu(false); });

  /* restore the last arrangement */
  try{ const saved=JSON.parse(localStorage.getItem(WIN_KEY)||'[]'); if(Array.isArray(saved)) saved.slice(0,12).forEach(x=>spawn(x.kind,x.st,x.g,null,true)); }catch(_){}

  addEventListener('hashchange',route);
  let rzT=0; addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(CUR==='analytics') render(FULL.analytics); },200); });
  route();
  /* what is on screen, for the chat: the full page if one is open, then every window */
  const views=()=>(CUR!=='console'?[{...describe(FULL[CUR]),shown:'full page'}]:[]).concat(WINS.map(v=>({...describe(v),shown:'window'})));
  return {route,daily,value,windowOf,totals,matcher,tierOf,BANKMODE,FULL,WINS,spawn,closeWin,expand,collapse,views,A_DEF,C_DEF};
})();

const wait=m=>new Promise(r=>setTimeout(r,m));
function add(who,cls){ const m=document.createElement('div'); m.className='msg '+(cls||'');
  m.innerHTML=`<div class="who">${who}</div><div class="body"></div>`; log.appendChild(m); log.scrollTop=log.scrollHeight; return m.querySelector('.body'); }

const DEMO_REPLY="This is the demo build — there's no model behind this box. What you just "+
  "watched is the real behaviour though: a probe walking actual edges of the graph, the wire "+
  "it's on glowing as it passes, and the camera following it to wherever the path ends. "+
  "Served by the bridge, that route is whatever files were actually opened.";
const DEMO_SOURCES=['demo/graph.md','demo/no-model-attached.md'];

/* ===================================================================== LIVE
   When vault-bridge.py is serving this page, every animation below is driven
   by real file activity. Each actor keeps its own trail, so a read that
   follows another read animates along the actual route between those two
   notes in the graph. No invented walks.
   ------------------------------------------------------------------- */
let LIVE=false;
const trails=new Map();                    // task/actor -> last node index
const TASKS=new Set();

function actorTrace(key,from,to,actor,glow){
  const A=actorOf(actor);
  let path = (from!=null) ? route(from,to,6) : null;
  if(path&&path.length){ spawn(path,{speed:A.s,glow:glow??1,col:A.c}); return path.map(e=>e[1]); }
  // unconnected (or first touch): light the destination and a short local halo
  P[to].ht=Math.max(P[to].ht,glow??1);
  const nb=ADJ[to].slice(0,3).map(x=>[to,x]);
  if(nb.length) spawn(nb,{speed:A.s*1.4,glow:(glow??1)*.5,col:A.c});
  return [to];
}

function onEvent(ev){
  const actor=ev.actor||'system', A=actorOf(actor), key=ev.task||actor;
  switch(ev.t){
    case 'hello': LIVE=true; setLive(true); break;

    case 'read': { const j=nodeFor(ev.path); if(j==null) break;
      const touched=actorTrace(key,trails.get(key),j,actor,.9);
      trails.set(key,j);
      if(actor==='chat') Vault.ride(probes[probes.length-1]);
      break; }

    case 'write': { const j=nodeFor(ev.path); if(j==null) break;
      /* a write burns hotter and wider than a read — you should see it happen */
      P[j].ht=1; for(const k of ADJ[j]){ const l=EI.get(j<k?j+'_'+k:k+'_'+j); if(l) l.ht=Math.max(l.ht,.8); }
      trails.set(key,j);
      if(!TASKS.size) Vault.frameNodes([j,...ADJ[j].slice(0,4)],2600,true);
      break; }

    case 'create': { const j=nodeFor(ev.path);
      if(j!=null){ P[j].ht=1; P[j].born=performance.now(); }
      break; }

    case 'delete': { const j=nodeFor(ev.path); if(j!=null) P[j].dying=performance.now(); break; }

    case 'search': { const hits=(ev.hits||[]).map(nodeFor).filter(v=>v!=null);
      Vault.set('seeking');
      if(hits.length){ let prev=trails.get(key);
        hits.slice(0,4).forEach((j,i)=>setTimeout(()=>{ actorTrace(key,prev,j,actor,.85); prev=j; },i*260));
        trails.set(key,hits[0]);
        Vault.frameNodes(hits,3000,hits.length<4); }
      break; }

    case 'task':
      if(ev.phase==='start'){ TASKS.add(key); Vault.set('seeking'); }
      else { TASKS.delete(key); trails.delete(key);
        if(!TASKS.size) Vault.set('idle'); }
      break;

    case 'graph': mergeGraph(ev.nodes,ev.links); break;

    case 'say': { const b=add(ev.role==='user'?'you':'vault',ev.role==='user'?'me':'');
      type(b,ev.text,ev.role==='user'?0:12); break; }
  }
  if(ev.t==='read'||ev.t==='write') Vault.set(TASKS.size?'working':'idle');
}

/* the field grows and shrinks with the vault */
function mergeGraph(nodes,links){
  if(!nodes) return;
  const have=new Set(); for(let i=0;i<keep.length;i++){ const p=DATA.nodes[keep[i]]; if(p&&p.path) have.add(p.path); }
  let added=0;
  for(const n of nodes){ if(!n.path||have.has(n.path)) continue;
    // place it next to something it links to, so it doesn't fly in from nowhere
    const nb=(links||[]).filter(l=>l.source===n.id||l.target===n.id)
      .map(l=>nodeFor(DATA.nodes[idx.get(l.source===n.id?l.target:l.source)]?.path)).filter(v=>v!=null);
    const anchor=nb.length?P[nb[0]]:P[(Math.random()*P.length)|0];
    const j=P.length;
    P.push({t:n.type,label:n.label,path:n.path,dg:nb.length,r:1.5,heat:0,ht:1,ph:Math.random()*TAU,born:performance.now(),
      x:anchor.x+(Math.random()-.5)*46, y:anchor.y+(Math.random()-.5)*46, z:anchor.z+(Math.random()-.5)*46});
    ADJ.push([]);
    for(const k of nb){ const l={a:j,b:k,p:Math.random(),v:.00005+Math.random()*.00006,heat:0,ht:.7};
      LK.push(l); EI.set(j<k?j+'_'+k:k+'_'+j,l); ADJ[j].push(k); ADJ[k].push(j); P[k].dg++; }
    PATHI.set(n.path,j); PATHI.set(n.path.replace(/\.md$/,''),j);
    added++; }
  if(added){ applyFilters(); if(window.__panel) __panel.stat(); console.log('[graph] +'+added+' nodes'); }
}

function setLive(on){ const el=document.getElementById('state');
  el.querySelector('.txt').textContent=on?'live':'idle'; }

(function connect(){
  if(!BRIDGED) return;                       // demo: zero network calls, ever
  if(typeof EventSource==='undefined') return;
  try{ const es=new EventSource('/events');
    es.onmessage=e=>{ try{ onEvent(JSON.parse(e.data)); }catch(_){} };
    es.onerror=()=>{ /* EventSource retries on its own */ };
  }catch(_){}
})();

const esc0=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sendToVault(text){
  if(LIVE){ try{ await fetch('/say',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,views:Vault.views()})}); return; }catch(_){} }
  /* every run differs: probe count, path length, speed, framing angle, zoom */
  /* one deliberate thread, slow enough to follow */
  const len=7+((Math.random()*5)|0), sp=.00060+Math.random()*.00035;
  Vault.set('seeking');
  const tr=Vault.trace({count:1+((Math.random()*2)|0),len,speed:sp,ride:true});
  const th=thinking('tracing the graph');
  const lead=tr[0], last=lead&&lead.path.length?lead.path[lead.path.length-1][1]:null;
  await wait(5200);
  Vault.set('found');
  const ends=tr.map(p=>p.path.length?p.path[p.path.length-1][1]:null).filter(v=>v!=null);
  Vault.ignite(ends);
  Vault.settle(last,3000);       /* comes to rest on the note it ended on */
  th.innerHTML=`<span class="think">reading<i></i><i></i><i></i></span>`;
  await wait(1100);
  Vault.set('working');
  const onScreen=Vault.views().map(v=>`<span class="src">on screen · ${esc0(v.page)}${v.scope?' — '+esc0(v.scope):v.brand?' — '+esc0(v.brand):''}</span>`);
  th.innerHTML=onScreen.concat(DEMO_SOURCES.map(s=>`<span class="src">${s}</span>`)).join(' ')+'<br>';
  const span=document.createElement('span'); th.appendChild(span);
  await type(span,DEMO_REPLY);
  Vault.set('idle');
}
function send(){ const v=inp.value.trim(); if(!v) return;
  if(!LIVE) type(add('you','me'),v,0);   /* live mode: the bridge echoes it back */
  inp.value=''; inp.style.height='auto'; sendToVault(v); }
go.addEventListener('click',send);
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,132)+'px'; });

rotEl.addEventListener('click',()=>{ autorot=!autorot; rotEl.textContent='auto-rotate: '+(autorot?'on':'off'); });

    ? 'Vault online. '+DATA.nodes.length+' notes, '+DATA.links.length+' links indexed.'
