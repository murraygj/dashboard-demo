<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    /* deep ember — saturated and dark, no pale tints */
    --void:#070301;
    --coal:#120703;
    --rust:#5c1c05;
    --ember:#a3350a;
    --flame:#e05a10;
    --amber:#f08c28;
    --heat:#ffb055;
    --text:#f0dfcc;
    --text-dim:#a68b74;
    --text-faint:#6b563f;
    --edge:rgba(224,90,16,0.16);
    --edge-2:rgba(240,140,40,0.34);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--sans);
    padding-top:env(safe-area-inset-top,0px);}
  input,button,textarea{font-family:inherit;}
  ::selection{background:rgba(224,90,16,.3);}

  #bg{position:fixed;inset:0;z-index:0;background:
    radial-gradient(ellipse 120% 90% at 50% 42%, #1a0a03 0%, var(--void) 68%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(163,53,10,.16), transparent 62%);}
  canvas{position:fixed;inset:0;z-index:1;width:100%;height:100%;}
  #lbl{pointer-events:none;}
  /* keeps the graph from fighting the words */
  #scrim{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(to top, rgba(7,3,1,.92) 0%, rgba(7,3,1,.74) 20%, rgba(7,3,1,.30) 42%, rgba(7,3,1,0) 62%);}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(7,3,1,.38) 88%, rgba(7,3,1,.78) 100%);}

  /* ---------------- header ---------------- */
  header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;
    padding:20px 26px calc(20px + env(safe-area-inset-top,0px));pointer-events:none;}
  .mark{font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--text-dim);}
  .mark b{color:var(--amber);font-weight:500;}
  .state{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;font-weight:300;
    letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);margin-left:auto;}
  .state .led{width:5px;height:5px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);transition:background .4s,box-shadow .4s;}
  .state.busy .led{background:var(--heat);box-shadow:0 0 12px var(--amber);animation:blink 1.1s ease-in-out infinite;}
  @keyframes blink{50%{opacity:.35}}

  /* ---------------- console ---------------- */
  #console{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:4;pointer-events:none;
    width:min(780px,92vw);display:flex;flex-direction:column;
    padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));max-height:76vh;}
  #log{pointer-events:none;overflow-y:auto;overflow-x:hidden;padding:0 4px 18px;display:flex;flex-direction:column;gap:20px;
    mask-image:linear-gradient(to bottom,transparent 0,#000 46px,#000 100%);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 46px,#000 100%);
    scrollbar-width:thin;scrollbar-color:rgba(224,90,16,.24) transparent;}
  #log::-webkit-scrollbar{width:4px;} #log::-webkit-scrollbar-thumb{background:rgba(224,90,16,.24);border-radius:4px;}
  .msg{pointer-events:auto;display:flex;flex-direction:column;gap:6px;animation:rise .45s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .who{font-family:var(--mono);font-size:9px;font-weight:300;letter-spacing:.24em;text-transform:uppercase;color:var(--text-faint);}
  .msg.me .who{color:var(--flame);}
  .body{font-size:14.5px;font-weight:300;line-height:1.72;color:var(--text);}
  .msg.me .body{color:#d9c3ab;}
  .body .src{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
    color:var(--amber);border:1px solid var(--edge);border-radius:4px;padding:1px 6px;margin:0 2px;}
  .think{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;font-weight:300;
    letter-spacing:.1em;color:var(--text-faint);}
  .think i{width:4px;height:4px;border-radius:50%;background:var(--amber);display:inline-block;animation:pip 1.2s infinite;}
  .think i:nth-child(2){animation-delay:.16s} .think i:nth-child(3){animation-delay:.32s}
  @keyframes pip{0%,60%,100%{opacity:.2}30%{opacity:1}}

  #bar{pointer-events:auto;display:flex;align-items:flex-end;gap:10px;border:1px solid var(--edge);border-radius:13px;
    background:rgba(18,7,3,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    padding:11px 12px 11px 15px;transition:border-color .3s,box-shadow .3s;}
  #bar:focus-within{border-color:var(--edge-2);box-shadow:0 0 0 3px rgba(224,90,16,.07),0 0 42px rgba(163,53,10,.2);}
  #in{flex:1;background:none;border:none;outline:none;resize:none;color:var(--text);font-size:14.5px;
    font-weight:300;line-height:1.55;max-height:132px;padding:2px 0;}
  #in::placeholder{color:var(--text-faint);}
  #go{flex:none;width:31px;height:31px;border-radius:9px;border:1px solid var(--edge);background:rgba(224,90,16,.12);
    color:var(--amber);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .22s;}
  #go:hover{background:rgba(224,90,16,.26);border-color:var(--edge-2);color:var(--heat);}
  #go svg{width:13px;height:13px;}
  .foot{pointer-events:auto;display:flex;gap:16px;margin-top:9px;padding:0 3px;font-family:var(--mono);font-size:9px;font-weight:300;
    letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);}
  .foot span{cursor:default;} .foot kbd{border:1px solid var(--edge);border-radius:3px;padding:0 3px;color:var(--text-dim);}
  .foot .lnk{cursor:pointer;transition:color .2s;} .foot .lnk:hover{color:var(--amber);}

  /* ---------------- display panel ---------------- */
  #gear{pointer-events:auto;flex:none;width:26px;height:26px;margin-left:12px;border-radius:8px;border:1px solid var(--edge);
    background:rgba(18,7,3,.55);color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:color .2s,border-color .2s,background .2s;}
  #gear:hover,#gear[aria-expanded=true]{color:var(--amber);border-color:var(--edge-2);background:rgba(224,90,16,.10);}
  #gear svg{width:14px;height:14px;}
  #panel{position:fixed;z-index:6;top:calc(60px + env(safe-area-inset-top,0px));right:22px;width:284px;
    max-height:calc(100vh - 250px);overflow-y:auto;overscroll-behavior:contain;
    background:rgba(14,6,2,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--edge);border-radius:12px;padding:4px 16px 14px;
    font-family:var(--mono);font-size:9.5px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);
    scrollbar-width:thin;scrollbar-color:rgba(224,90,16,.24) transparent;animation:rise .3s cubic-bezier(.2,.8,.2,1);}
  #panel[hidden]{display:none;}
  #panel .ph{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;color:var(--text-faint);letter-spacing:.24em;}
  #panel details{border-top:1px solid rgba(224,90,16,.10);padding:4px 0 8px;}
  #panel summary{cursor:pointer;list-style:none;padding:8px 0 6px;color:var(--amber);letter-spacing:.24em;}
  #panel summary::-webkit-details-marker{display:none;}
  #panel summary::before{content:'';display:inline-block;width:5px;height:5px;margin:0 9px 1px 1px;border-right:1px solid var(--text-faint);
    border-bottom:1px solid var(--text-faint);transform:rotate(-45deg);transition:transform .2s;}
  #panel details[open] summary::before{transform:rotate(45deg);}
  #panel .row{display:flex;align-items:center;gap:12px;padding:5px 0;cursor:pointer;}
  #panel .rg{flex-direction:column;align-items:stretch;gap:4px;cursor:default;}
  #panel .lb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex:1;min-width:0;color:var(--text-dim);}
  #panel .lb i,#panel .lb em{font-style:normal;letter-spacing:.06em;white-space:nowrap;}
  #panel .lb i{color:var(--text-faint);} #panel .lb em{color:var(--heat);}
  #panel .fd .lb{text-transform:none;letter-spacing:.06em;font-size:10.5px;}   /* folder names are paths: keep their case */
  #panel .sub{padding:10px 0 3px;color:var(--text-faint);letter-spacing:.24em;}
  #panel .tg input{position:absolute;opacity:0;pointer-events:none;}
  #panel .tg b{flex:none;position:relative;width:24px;height:12px;border-radius:12px;border:1px solid var(--edge);background:rgba(7,3,1,.6);transition:all .2s;}
  #panel .tg b::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:var(--text-faint);transition:all .2s;}
  #panel .tg input:checked+b{background:rgba(224,90,16,.28);border-color:var(--edge-2);}
  #panel .tg input:checked+b::after{left:14px;background:var(--amber);box-shadow:0 0 6px var(--flame);}
  #panel .tg input:focus-visible+b{outline:1px solid var(--amber);outline-offset:2px;}
  #panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;margin:0;cursor:pointer;}
  #panel input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(224,90,16,.24);border-radius:2px;}
  #panel input[type=range]::-moz-range-track{height:2px;background:rgba(224,90,16,.24);border-radius:2px;}
  #panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--flame);border:none;}
  #panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--flame);border:none;}
  #panel input[type=range]:focus-visible{outline:1px solid var(--amber);outline-offset:3px;}
  #panel .pb{font:inherit;letter-spacing:.14em;color:var(--text-faint);background:none;border:1px solid var(--edge);border-radius:6px;padding:3px 8px;cursor:pointer;transition:color .2s,border-color .2s;}
  #panel .pb:hover{color:var(--amber);border-color:var(--edge-2);}
  #panel .pb.wide{display:block;width:100%;margin-top:10px;padding:7px;}
  #panel .pn-foot{padding-top:10px;color:var(--text-faint);letter-spacing:.14em;border-top:1px solid rgba(224,90,16,.10);}
  @media(max-width:700px){ #gear{margin-left:8px;} #panel{right:10px;left:10px;width:auto;top:calc(52px + env(safe-area-inset-top,0px));max-height:calc(100vh - 270px);} }

  /* ---------------- nav + pages ---------------- */
  #nav{pointer-events:auto;display:flex;gap:3px;margin-left:26px;}
  #nav a{font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--text-faint);
    text-decoration:none;padding:7px 11px;border-radius:7px;border:1px solid transparent;transition:color .2s,border-color .2s,background .2s;white-space:nowrap;}
  #nav a:hover{color:var(--text-dim);}
  #nav a.on{color:var(--amber);border-color:var(--edge);background:rgba(224,90,16,.07);}
  #nav a:focus-visible{outline:1px solid var(--amber);outline-offset:2px;}
  #pagedim{position:fixed;inset:0;z-index:3;pointer-events:none;background:rgba(7,3,1,.68);opacity:0;transition:opacity .5s ease;}
  body:not([data-page="console"]) #pagedim{opacity:1;}
  body:not([data-page="console"]) #console,body:not([data-page="console"]) #gear,body:not([data-page="console"]) #panel{display:none;}
  #pages{position:fixed;left:0;right:0;bottom:0;top:calc(64px + env(safe-area-inset-top,0px));z-index:4;overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:rgba(224,90,16,.24) transparent;}
  #pages[hidden]{display:none;}
  #pgwrap{max-width:1280px;margin:0 auto;padding:4px 26px calc(64px + env(safe-area-inset-bottom,0px));animation:rise .4s cubic-bezier(.2,.8,.2,1);}
  .pgv{container-type:inline-size;container-name:pg;}
  .glass{background:rgba(16,7,3,.74);border:1px solid var(--edge);border-radius:12px;}
  .pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:14px 0 12px;}
  .kick{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);}
  .syn{margin-left:8px;color:var(--text-faint);border:1px solid var(--edge);border-radius:4px;padding:1px 6px;letter-spacing:.14em;}
  .pg-title h1{font-size:26px;font-weight:300;letter-spacing:-.01em;margin:7px 0 6px;color:var(--text);}
  .crumbs{font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em;}
  .crumbs a{color:var(--text-dim);cursor:pointer;} .crumbs a:hover{color:var(--amber);} .crumbs i{font-style:normal;margin:0 8px;opacity:.6;}
  .crumbs .cur{color:var(--text-dim);}
  .pg-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:8px;padding:2px;background:rgba(16,7,3,.6);flex-wrap:wrap;}
  .seg button{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);background:none;border:0;
    padding:6px 10px;border-radius:6px;cursor:pointer;transition:color .2s,background .2s;}
  .seg button:hover{color:var(--text-dim);} .seg button.on{color:var(--amber);background:rgba(224,90,16,.13);}
  .seg.sm button{padding:4px 8px;letter-spacing:.1em;}
  .winlbl{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:.06em;}
  .tgl{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);}
  .tgl input{position:absolute;opacity:0;pointer-events:none;}
  .tgl b{position:relative;width:24px;height:12px;border-radius:12px;border:1px solid var(--edge);background:rgba(7,3,1,.6);transition:all .2s;}
  .tgl b::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:var(--text-faint);transition:all .2s;}
  .tgl input:checked+b{background:rgba(224,90,16,.28);border-color:var(--edge-2);}
  .tgl input:checked+b::after{left:14px;background:var(--amber);box-shadow:0 0 6px var(--flame);}
  .winrow{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-faint);margin:0 0 12px;}
  .winrow .adjn{color:var(--text-dim);border-left:2px solid var(--ember);padding-left:8px;}
  .band{display:grid;gap:10px;}
  .pulse{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));}
  .drivers{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));}
  .band-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--text-faint);margin:22px 0 9px;}
  .kpi{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;padding:13px 15px;cursor:pointer;border:1px solid var(--edge);border-radius:11px;background:rgba(16,7,3,.72);color:inherit;
    font:inherit;transition:border-color .2s,background .2s,box-shadow .2s;min-width:0;}
  .kpi:hover{border-color:var(--edge-2);}
  .kpi.on{border-color:rgba(240,140,40,.55);box-shadow:0 0 24px rgba(224,90,16,.10),inset 0 0 0 1px rgba(240,140,40,.10);}
  .kpi:focus-visible{outline:1px solid var(--amber);outline-offset:2px;}
  .kpi .lb{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .v{font-size:16px;font-weight:300;color:var(--text);margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .kpi.big .v{font-size:27px;font-weight:200;letter-spacing:-.01em;margin-top:8px;}
  .kpi .v.nc,.kpi .v.ins,.kpi.big .v.nc,.kpi.big .v.ins{font-size:13px;font-weight:300;color:var(--text-dim);margin-top:10px;}
  .kpi .sub{font-family:var(--mono);font-size:10px;color:var(--text-faint);margin-top:4px;white-space:nowrap;}
  .dl.up{color:var(--heat);} .dl.dn{color:#c9683d;} .dl.nt{color:var(--text-faint);} .dl i{font-style:normal;opacity:.7;}
  .spark{display:block;width:100%;height:26px;margin-top:10px;}
  .spark path{fill:none;stroke:var(--flame);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.85;}
  .chart{padding:16px 18px 12px;margin-top:12px;}
  .ch-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
  .ch-head .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);}
  .ch-head .def{font-size:12px;font-weight:300;color:var(--text-dim);margin-top:5px;max-width:720px;}
  .ch-head .def span{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);margin-left:6px;}
  .legend{display:flex;gap:14px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--text-faint);align-items:center;}
  .legend i{display:inline-block;vertical-align:middle;margin-right:6px;}
  .legend .ln{width:16px;height:2px;background:var(--amber);} .legend .ln.gh{background:none;height:0;border-top:1px dashed rgba(166,139,116,.7);}
  .legend .gp{width:10px;height:10px;background:repeating-linear-gradient(45deg,rgba(224,90,16,.3) 0 2px,transparent 2px 5px);}
  .ch-wrap{position:relative;overflow:hidden;}
  svg.ch{display:block;max-width:100%;}
  svg.ch .line{fill:none;stroke:var(--amber);stroke-width:1.6;}
  svg.ch .ghost{fill:none;stroke:rgba(166,139,116,.5);stroke-width:1.2;stroke-dasharray:4 4;}
  svg.ch .gl{stroke:rgba(224,90,16,.09);}
  svg.ch .yt{fill:var(--text-faint);font-family:var(--mono);font-size:10px;text-anchor:end;}
  svg.ch .xt{fill:var(--text-faint);font-family:var(--mono);font-size:10px;text-anchor:middle;}
  svg.ch .cross{stroke:rgba(240,140,40,.45);}
  .ch-empty{font-size:13px;font-weight:300;color:var(--text-dim);padding:36px 0 30px;}
  .tip{position:absolute;top:6px;padding:8px 10px;border:1px solid var(--edge);border-radius:8px;background:rgba(10,4,2,.94);pointer-events:none;
    font-family:var(--mono);font-size:10.5px;color:var(--text-dim);display:flex;flex-direction:column;gap:2px;min-width:120px;}
  .tip[hidden]{display:none;}
  .tip b{color:var(--amber);font-weight:400;font-size:12px;} .tip i{font-style:normal;color:var(--text-faint);font-size:9.5px;}
  .detail{margin-top:18px;overflow:hidden;}
  .tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid rgba(224,90,16,.1);flex-wrap:wrap;}
  .tabs button{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);background:none;border:0;
    padding:7px 11px;border-radius:6px;cursor:pointer;}
  .tabs button:hover{color:var(--text-dim);} .tabs button.on{color:var(--amber);background:rgba(224,90,16,.1);}
  .tabs .exp{margin-left:auto;border:1px solid var(--edge);}
  .tbl-wrap{overflow-x:auto;}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-weight:300;}
  .tbl th{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);font-weight:400;text-align:left;
    padding:11px 12px;border-bottom:1px solid rgba(224,90,16,.12);cursor:pointer;white-space:nowrap;user-select:none;}
  .tbl th.r,.tbl td.r{text-align:right;} .tbl th.s{color:var(--amber);}
  .tbl td{padding:9px 12px;border-bottom:1px solid rgba(224,90,16,.06);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .tbl tr.go{cursor:pointer;} .tbl tr.go:hover td{background:rgba(224,90,16,.06);}
  .tbl tr.dim td{color:var(--text-faint);}
  .tbl tr.best td:first-child::before{content:'▸ ';color:var(--amber);}
  b.live{color:var(--heat);font-weight:400;} b.warn{color:var(--amber);font-weight:400;}
  .tnote{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);padding:10px 14px;letter-spacing:.03em;}
  .chan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:14px;}
  .chc{border:1px solid rgba(224,90,16,.12);border-radius:10px;padding:12px 14px;}

  /* operations */

  .item .meta,.meta{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);margin-top:6px;letter-spacing:.03em;line-height:1.5;}

  .opts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}

  .row2{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;} .row2 .r{text-align:right;margin-top:0;white-space:nowrap;}
  .rs{color:var(--heat);} .partial .rs{color:var(--amber);} .red .rs{color:#c9683d;} .red .q{color:#e0916a;}
  .tl{padding:14px;position:relative;--nm:160px;}
  .tl-axis{position:relative;height:18px;margin-left:var(--nm);font-family:var(--mono);font-size:9px;color:var(--text-faint);}
  .tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap;}
  .tl-row{display:flex;align-items:center;height:32px;}
  .tl-name{width:var(--nm);flex:none;font-size:12px;font-weight:300;color:var(--text-dim);}
  .tl-track{position:relative;flex:1;height:24px;border-bottom:1px solid rgba(224,90,16,.07);}
  .bar{position:absolute;top:4px;height:17px;border-radius:4px;overflow:hidden;display:flex;align-items:center;text-decoration:none;cursor:pointer;min-width:3px;}
  .bar span{font-family:var(--mono);font-size:9px;padding:0 6px;white-space:nowrap;letter-spacing:.03em;}
  .bar.done{background:rgba(163,53,10,.38);} .bar.done span{color:var(--text-dim);}
  .bar.live{background:rgba(240,140,40,.62);} .bar.live span{color:#1a0903;}
  .bar.plan{border:1px dashed var(--edge-2);cursor:default;} .bar.plan span{color:var(--text-faint);}
  .tl-today{position:absolute;top:34px;bottom:34px;width:1px;background:var(--amber);box-shadow:0 0 8px var(--flame);}
  .tl-leg{display:flex;gap:16px;margin:10px 0 0 var(--nm);font-family:var(--mono);font-size:9px;color:var(--text-faint);}
  .tl-leg i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;}
  .tl-leg .done{background:rgba(163,53,10,.5);} .tl-leg .live{background:rgba(240,140,40,.62);} .tl-leg .plan{border:1px dashed var(--edge-2);}
  .eq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  .eqc{padding:14px 16px;}
  .docs{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin:10px 0 6px;}
  .docs i{height:14px;border-radius:3px;}
  .docs .a{background:rgba(240,140,40,.62);} .docs .d{border:1px solid var(--edge-2);background:rgba(224,90,16,.08);} .docs .m{border:1px dashed rgba(107,86,63,.6);}
  .pbars{margin-top:14px;}
  .pr{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:11px;color:var(--text-dim);margin:5px 0;}
  .pr b{font-weight:300;text-align:right;font-variant-numeric:tabular-nums;color:var(--text);}
  .track{position:relative;height:6px;border-radius:6px;background:rgba(224,90,16,.1);}
  .fill{height:100%;border-radius:6px;background:var(--flame);}
  .tgt{position:absolute;top:-3px;width:2px;height:12px;background:var(--text-dim);border-radius:1px;}

  /* customers */
  .cust{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;align-items:start;}
  .flt{padding:14px 16px;position:sticky;top:0;}
  .f{margin:14px 0;}
  .fl{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);margin-bottom:7px;}
  .fl em{font-style:normal;color:var(--amber);letter-spacing:.06em;text-transform:none;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{font-family:var(--mono);font-size:10px;color:var(--text-dim);background:none;border:1px solid var(--edge);border-radius:12px;padding:4px 9px;cursor:pointer;transition:all .15s;}
  .chip:hover{border-color:var(--edge-2);} .chip.on{color:var(--amber);border-color:var(--edge-2);background:rgba(224,90,16,.15);}
  .rng{display:flex;align-items:center;gap:10px;margin-top:8px;} .rng em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--amber);white-space:nowrap;}
  .rng2{display:grid;gap:2px;}
  .cust input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer;}
  .cust input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(224,90,16,.24);border-radius:2px;}
  .cust input[type=range]::-moz-range-track{height:2px;background:rgba(224,90,16,.24);border-radius:2px;}
  .cust input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--flame);border:none;}
  .cust input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--flame);border:none;}
  .warnln{font-family:var(--mono);font-size:9.5px;color:var(--amber);margin-top:8px;line-height:1.5;}
  .tiers{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);line-height:1.7;border-top:1px solid rgba(224,90,16,.08);padding-top:12px;margin-top:6px;}
  .res{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .cnt{padding:20px 22px;}
  .cnt .big{font-size:48px;font-weight:200;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;}
  .cnt .of{font-size:12.5px;font-weight:300;color:var(--text-dim);margin-top:8px;}
  .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px;margin:18px 0;}
  .mini span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);}
  .mini b{display:block;font-size:17px;font-weight:300;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums;}
  .acts{display:flex;flex-wrap:wrap;gap:8px;}
  .act{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:8px;border:1px solid var(--edge-2);
    color:var(--amber);background:rgba(224,90,16,.10);cursor:pointer;transition:background .2s;}
  .act:hover{background:rgba(224,90,16,.18);} .act:disabled{opacity:.32;cursor:not-allowed;}
  .act.ghost{background:none;color:var(--text-dim);border-color:var(--edge);}
  .ap{margin-top:14px;padding:14px 16px;border:1px solid var(--edge);border-radius:10px;background:rgba(7,3,1,.5);font-size:12.5px;font-weight:300;color:var(--text-dim);}
  .ap b{color:var(--text);font-weight:400;} .ap ol{margin:10px 0 6px;padding-left:18px;line-height:1.7;} .ap .seg{margin-top:10px;}
  .sv{display:flex;gap:8px;margin-top:10px;} .sv input{flex:1;min-width:0;background:rgba(7,3,1,.6);border:1px solid var(--edge);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;font-weight:300;outline:none;}
  .sv input:focus{border-color:var(--edge-2);}
  .rg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .bx{padding:14px 16px;} .bx .tbl{margin-top:4px;}
  .br{display:grid;grid-template-columns:118px 1fr 56px;gap:10px;align-items:center;font-size:12px;margin:7px 0;}
  .br span{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .br b{text-align:right;font-weight:300;font-variant-numeric:tabular-nums;color:var(--text);}

  @container pg (max-width:1100px){ .ops4,.eq{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @container pg (max-width:860px){ .cust{grid-template-columns:1fr;} .flt{position:static;} .rg2,.ops2{grid-template-columns:1fr;} }
  @container pg (max-width:640px){
    .ops4,.eq{grid-template-columns:1fr;}
    .pg-title h1{font-size:21px;}
    .pulse{grid-template-columns:repeat(2,minmax(0,1fr));} .kpi.big .v{font-size:21px;}
    .mini{grid-template-columns:repeat(2,minmax(0,1fr));}
    .tl{--nm:92px;} .tl-name{font-size:11px;}
    .pg-ctl{width:100%;}
  }
  @media(max-width:700px){
    header{flex-wrap:wrap;row-gap:10px;}
    #nav{order:5;flex-basis:100%;margin:0;overflow-x:auto;scrollbar-width:none;}
    #nav a{padding:6px 9px;letter-spacing:.14em;}
    #pages{top:calc(96px + env(safe-area-inset-top,0px));}
    #pgwrap{padding:0 14px calc(56px + env(safe-area-inset-bottom,0px));}
  }

  /* ---------------- windows ---------------- */
  #wins{position:fixed;inset:0;z-index:4;pointer-events:none;}
  body:not([data-page="console"]) #wins{display:none;}
  .win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:rgba(12,5,2,.975);border:1px solid var(--edge);
    border-radius:12px;box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.35);overflow:hidden;animation:winin .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes winin{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  .win.front{border-color:rgba(240,140,40,.30);}
  .win.moving{box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 30px rgba(224,90,16,.08);}
  .win.moving .win-body{pointer-events:none;}
  .win.closing{opacity:0;transform:scale(.985);transition:opacity .16s,transform .16s;}
  .win-bar{display:flex;align-items:center;gap:10px;padding:7px 7px 7px 14px;cursor:grab;border-bottom:1px solid rgba(224,90,16,.10);
    user-select:none;-webkit-user-select:none;flex:none;touch-action:none;background:rgba(224,90,16,.035);}
  .win.moving .win-bar{cursor:grabbing;}
  .win-t{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);flex:none;}
  .win-s{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .win-bar button{flex:none;width:26px;height:24px;border-radius:6px;border:1px solid transparent;background:none;color:var(--text-faint);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s;}
  .win-bar button svg{width:13px;height:13px;}
  .win-bar button:hover{color:var(--amber);border-color:var(--edge);}
  .win-bar button:focus-visible{outline:1px solid var(--amber);outline-offset:1px;}
  .win-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(224,90,16,.24) transparent;}
  .win .pgv{padding:0 16px 18px;}
  .win .pg-head{margin:12px 0 10px;gap:12px;} .win .pg-title h1{font-size:18px;margin:4px 0 4px;} .win .kick{display:none;}
  .win .band-lbl{margin:16px 0 8px;}
  .rz{position:absolute;z-index:3;}
  .rz.e{right:-4px;top:12px;bottom:12px;width:9px;cursor:ew-resize;} .rz.w{left:-4px;top:12px;bottom:12px;width:9px;cursor:ew-resize;}
  .rz.s{bottom:-4px;left:12px;right:12px;height:9px;cursor:ns-resize;}
  .rz.se{right:-3px;bottom:-3px;width:18px;height:18px;cursor:nwse-resize;} .rz.sw{left:-3px;bottom:-3px;width:18px;height:18px;cursor:nesw-resize;}
  .rz.se::after{content:'';position:absolute;right:6px;bottom:6px;width:7px;height:7px;border-right:1px solid var(--text-faint);border-bottom:1px solid var(--text-faint);opacity:.7;}
  .pgbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);
    background:rgba(16,7,3,.6);border:1px solid var(--edge);border-radius:8px;padding:7px 11px;cursor:pointer;transition:color .2s,border-color .2s;}
  .pgbtn svg{width:12px;height:12px;} .pgbtn:hover{color:var(--amber);border-color:var(--edge-2);}
  #addwin{pointer-events:auto;flex:none;width:26px;height:26px;margin-left:6px;border-radius:8px;border:1px solid var(--edge);background:rgba(18,7,3,.55);
    color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s,background .2s;}
  #addwin svg{width:13px;height:13px;} #addwin:hover,#addwin[aria-expanded=true]{color:var(--amber);border-color:var(--edge-2);background:rgba(224,90,16,.10);}
  #addmenu{position:fixed;z-index:7;top:calc(58px + env(safe-area-inset-top,0px));min-width:210px;padding:6px;background:rgba(14,6,2,.96);
    border:1px solid var(--edge);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:rise .22s cubic-bezier(.2,.8,.2,1);}
  #addmenu[hidden]{display:none;}
  #addmenu .mh{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);padding:6px 10px 6px;}
  #addmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-dim);background:none;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;text-align:left;}
  #addmenu button:hover{color:var(--amber);background:rgba(224,90,16,.09);} #addmenu button i{font-style:normal;color:var(--text-faint);letter-spacing:.04em;text-transform:none;}

  @media(max-width:700px){ header{padding:14px 16px;} .mark{font-size:10px;letter-spacing:.18em;} #console{width:94vw;} .body{font-size:14px;} }
</style>

<script>
/* ===================================================================

const DATA=(INJECTED&&INJECTED.nodes&&INJECTED.nodes.length)?INJECTED:SAMPLE;

/* =================================================================== PALETTE */
const NODE_COL='#ef7a1e';   /* the whole field is one colour now */
const EDGE_COL='#a8400f';   /* deeper than the nodes so it sits behind them */
const PAL={ base:'#c2490f', warm:'#e0560f', hot:'#fb7a18', peak:'#ff8c22', white:'#ffb459', void:[7,3,1] };
const TINT={ doctrine:'#f0a030', brand:'#ef6a1e', campaign:'#e84c1e', concept:'#d48226', decision:'#dd5f20',
  skill:'#c66f22', journal:'#99522a', meta:'#8a5030', run:'#7d4526', category:'#db7520', world:'#ec8526',
  project:'#de7520', reference:'#a4632c', entity:'#cf6620', client:'#c75f22', root:'#ffc070' };

const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const _c=new Map();
function rgb(h){ if(!_c.has(h)){ let s=h.replace('#',''); if(s.length===3) s=s.split('').map(x=>x+x).join(''); const n=parseInt(s,16); _c.set(h,[n>>16&255,n>>8&255,n&255]); } return _c.get(h); }
function rgba(h,a){ const[r,g,b]=rgb(h); return `rgba(${r},${g},${b},${clamp(a,0,1)})`; }
function fog(h,t,a){ const[r,g,b]=rgb(h),v=PAL.void;
  return `rgba(${Math.round(lerp(v[0],r,t))},${Math.round(lerp(v[1],g,t))},${Math.round(lerp(v[2],b,t))},${clamp(a,0,1)})`; }

const tintOf=t=>TINT[t]||'#b4601f';

/* =================================================================== FIELD */
const ids=DATA.nodes.map(n=>n.id), idx=new Map(ids.map((id,i)=>[id,i]));
const RAW=[]; { const seen=new Set();
  for(const l of DATA.links){ const a=idx.get(l.source),b=idx.get(l.target); if(a==null||b==null||a===b) continue;
    const k=a<b?a+'_'+b:b+'_'+a; if(seen.has(k)) continue; seen.add(k); RAW.push([a,b]); } }
/* ONE FILE, TWO HOMES. Served by vault-bridge.py it runs live; anywhere else
   (GitHub Pages, file://, a claude.ai artifact) it runs as a self-contained demo.
   The bridge is the only thing that injects graph data AND serves from a local or
   tailnet address, so both must be true. Pages is https too — protocol alone is
   not a safe signal, which is what nearly shipped an endless EventSource retry. */
const IS_LOCAL_HOST=(()=>{ try{ const h=location.hostname;
  return h==='localhost'||h==='127.0.0.1'||h==='::1'||h.endsWith('.local')||h.endsWith('.ts.net')||
    /^10\./.test(h)||/^192\.168\./.test(h)||/^172\.(1[6-9]|2\d|3[01])\./.test(h)||
    /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(h);   // tailscale CGNAT 100.64/10
}catch(_){ return false; } })();
const BRIDGED=!!(INJECTED&&INJECTED.nodes&&INJECTED.nodes.length) && IS_LOCAL_HOST &&
  typeof location!=='undefined' && /^https?:/.test(location.protocol);
const SMALL=(typeof matchMedia!=='undefined'&&matchMedia('(max-width:820px)').matches)||innerWidth<820;
const CAP=SMALL?260:900;   /* phones get a lighter field */
let keep=ids.map((_,i)=>i);
if(ids.length>CAP){ const d=new Array(ids.length).fill(0); RAW.forEach(([a,b])=>{d[a]++;d[b]++;});
  keep=[...keep].sort((x,y)=>d[y]-d[x]).slice(0,CAP); }
const km=new Map(keep.map((v,i)=>[v,i]));
const P=keep.map(i=>{ const n=DATA.nodes[i];
  return { t:n.type, label:n.label, path:n.path, dg:0, x:(Math.random()-.5)*300, y:(Math.random()-.5)*300, z:(Math.random()-.5)*300,
           heat:0, ht:0, ph:Math.random()*TAU }; });
const LK=[], EI=new Map(), ADJ=P.map(()=>[]);
for(const [a,b] of RAW){ const x=km.get(a),y=km.get(b); if(x==null||y==null) continue;
  const l={a:x,b:y,p:Math.random(),v:.00005+Math.random()*.00006,heat:0,ht:0};
  LK.push(l); EI.set(x<y?x+'_'+y:y+'_'+x,l); ADJ[x].push(y); ADJ[y].push(x); P[x].dg++; P[y].dg++; }

/* every edge bows along a stable perpendicular, so the graph reads as arcs
   rather than a wire sculpture — and comets ride the same curve */
function buildCurves(){
  for(const l of LK){ const A=P[l.a],B=P[l.b];
    let dx=B.x-A.x, dy=B.y-A.y, dz=B.z-A.z; const len=Math.hypot(dx,dy,dz)||1;
    dx/=len; dy/=len; dz/=len;
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2, mz=(A.z+B.z)/2;
    // reference away from the origin keeps the bow consistent around the cloud
    let rx=mx, ry=my, rz=mz; const rl=Math.hypot(rx,ry,rz)||1; rx/=rl; ry/=rl; rz/=rl;
    let px=dy*rz-dz*ry, py=dz*rx-dx*rz, pz=dx*ry-dy*rx;
    let pl=Math.hypot(px,py,pz);
    if(pl<1e-4){ px=-dy; py=dx; pz=0; pl=Math.hypot(px,py,pz)||1; }
    px/=pl; py/=pl; pz/=pl;
    const bow=len*(0.30+((l.a*31+l.b*17)%9)*0.032)*(((l.a+l.b)%2)?1:-1);
    l.cx=mx+px*bow; l.cy=my+py*bow; l.cz=mz+pz*bow; l.len=len;
    l.ta=0; l.tb=0; }
}
function bez(l,t,a,b){ const m=1-t, w0=m*m, w1=2*m*t, w2=t*t;
  const A=WP[a],B=WP[b];
  return { x:w0*A.x+w1*l.cx+w2*B.x, y:w0*A.y+w1*l.cy+w2*B.y, z:w0*A.z+w1*l.cz+w2*B.z }; }
function edgeOf(a,b){ return EI.get(a<b?a+'_'+b:b+'_'+a); }
/* a point t of the way from a to b, following the arc if there is one */
function edgePoint(a,b,t){ /* edges are straight spines now — comets ride the same line the renderer draws */
  return {x:lerp(WP[a].x,WP[b].x,t),y:lerp(WP[a].y,WP[b].y,t),z:lerp(WP[a].z,WP[b].z,t)}; }

/* =================================================================== SETTINGS
   The display panel's state. Kept in this browser only (localStorage), never sent
   anywhere, and every read and write is guarded so a blocked store just means
   defaults. Forces are multipliers on the tuned defaults, so 1 is always "as built".
   ------------------------------------------------------------------- */
const SET_KEY='vault-console-display-v1';
const SET_DEFAULT={ orphans:true, detached:true, folders:{},
  nodeSize:1, edges:1, glow:1, traffic:1, spin:1,
  center:1, repel:1, linkForce:1, linkDist:1, spacing:1.35, seed:0 };
const SET=(()=>{ let s={}; try{ s=JSON.parse(localStorage.getItem(SET_KEY)||'{}')||{}; }catch(_){}
  return {...SET_DEFAULT,...s,folders:{...(s.folders||{})}}; })();
let _saveT=0;
function saveSet(){ clearTimeout(_saveT); _saveT=setTimeout(()=>{ try{ localStorage.setItem(SET_KEY,JSON.stringify(SET)); }catch(_){} },250); }

/* =================================================================== LAYOUT
   Size-aware force layout. The old relax() sampled 18 random nodes for repulsion
   and ignored node size, while a hub's ~100 springs dragged every other hub to the
   same point — so the biggest spheres ended up inside each other. This one:
   · repels every visible pair (sampled only past 700 nodes), weighted by degree so
     hubs push each other apart hardest;
   · springs move the lighter end more (a hub is not towed by its leaves);
   · a collision pass keeps every pair of spheres at least (Ra+Rb)·spacing apart;
   · starts from a seeded position per note, so the same vault settles the same way.
   ------------------------------------------------------------------- */
for(const p of P) p.r=1.5+Math.sqrt(p.dg)*.72;
const NODE_R=p=>(1.7+p.r*2.05)*SET.nodeSize;   /* shell radius, world units */
let LAYOUT_RAD=260, LT=null;                     /* depth-cue radius; layout tween in flight */
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
const folderOf=p=>{ const s=String(p.path||'').replace(/^\/+/,''); const k=s.indexOf('/'); return k>0?s.slice(0,k):'(top level)'; };

/* which notes are shown. Folders first; orphans and detached clusters are then judged
   on what is left, so hiding a folder doesn't leave its neighbours floating as orphans */
function applyFilters(){
  const n=P.length; const inF=new Uint8Array(n);
  for(let i=0;i<n;i++) inF[i]=SET.folders[folderOf(P[i])]===false?0:1;
  const dv=new Int32Array(n); for(const l of LK) if(inF[l.a]&&inF[l.b]){ dv[l.a]++; dv[l.b]++; }
  const comp=new Int32Array(n).fill(-1), size=[]; let c=0;
  for(let i=0;i<n;i++){ if(!inF[i]||comp[i]>=0||dv[i]===0) continue; let q=[i]; comp[i]=c; let k=0;
    while(k<q.length){ const x=q[k++]; for(const y of ADJ[x]) if(inF[y]&&comp[y]<0){ comp[y]=c; q.push(y); } } size.push(q.length); c++; }
  let main=-1, best=0; size.forEach((s,j)=>{ if(s>best){ best=s; main=j; } });
  for(let i=0;i<n;i++){ const p=P[i];
    p.orphan=inF[i]&&dv[i]===0; p.detached=inF[i]&&dv[i]>0&&comp[i]!==main;
    p.hid=!inF[i]||(p.orphan&&!SET.orphans)||(p.detached&&!SET.detached); if(p.vis==null) p.vis=p.hid?0:1; }
}

/* the all-pairs step lives in its own function so its arrays stay in registers —
   inside layout() they are captured by closures, which made this loop ~10x slower */
function pairStep(VA,nV,X,Y,Z,w,RR,sp,cut2,kRa,dX,dY,dZ,cX,cY,cZ){
  for(let x=0;x<nV;x++){ const i=VA[x], xi=X[i], yi=Y[i], zi=Z[i], wi=w[i]*kRa, ri=RR[i]; let ax=0, ay=0, az=0;
    for(let y=x+1;y<nV;y++){ const j=VA[y]; const dx=xi-X[j], dy=yi-Y[j], dz=zi-Z[j]; let d2=dx*dx+dy*dy+dz*dz; if(d2>cut2) continue;
      const rj=RR[j], m=(ri+rj)*sp; if(d2<m*m){ const d=Math.sqrt(d2)||1e-3, ov=(m-d)/d*.5, mi=ri*ri, mj=rj*rj, fi=mj/(mi+mj), fj=1-fi;
        cX[i]+=dx*ov*fi; cY[i]+=dy*ov*fi; cZ[i]+=dz*ov*fi; cX[j]-=dx*ov*fj; cY[j]-=dy*ov*fj; cZ[j]-=dz*ov*fj; }
      if(d2<4) d2=4; const f=wi*w[j]/(d2*Math.sqrt(d2)); ax+=dx*f; ay+=dy*f; az+=dz*f; dX[j]-=dx*f; dY[j]-=dy*f; dZ[j]-=dz*f; }
    dX[i]+=ax; dY[i]+=ay; dZ[i]+=az; } }
function layout(warm,iters){
  const n=P.length, V=[]; for(let i=0;i<n;i++) if(!P[i].hid) V.push(i);
  const X=new Float64Array(n), Y=new Float64Array(n), Z=new Float64Array(n);
  const rnd=rng(SET.seed*7919+17);
  for(let i=0;i<n;i++){ const p=P[i];
    if(warm&&p.x!=null){ const t=LT?LT.to[i]:null; X[i]=t?t[0]:p.x; Y[i]=t?t[1]:p.y; Z[i]=t?t[2]:p.z; }

  const start=i===0?0:i-PRE, end=i+e.te+EMERGE*.75; return clamp((tau-start)/(end-start),0,1); }
function stepProbes(dt){
  for(let i=probes.length-1;i>=0;i--){ const pr=probes[i];
    pr.t+=pr.speed*dt;
    while(pr.t>=1){ pr.t-=1; const [a,b]=pr.path[pr.i];
      /* only deliberate runs leave a mark — ambient drift would otherwise keep the
         whole field churning colour, which is the thing that had to go */
      if(!pr.amb){ P[b].ht=Math.max(P[b].ht,pr.glow); P[b].hc=pr.col;
        const l=EI.get(a<b?a+'_'+b:b+'_'+a); if(l){ l.ht=Math.max(l.ht,pr.glow); l.hc=pr.col; } }
      /* one self-contained, self-timed ripple per landing — independent lifetimes
         mean two comets arriving at once overlap instead of fighting for one slot */
      if(rings.length<70) rings.push({n:b,t0:performance.now(),dur:820+Math.random()*260,g:pr.glow});
      pr.i++; if(pr.i>=pr.path.length){ pr.done=true; break; } }
    if(pr.done){ probes.splice(i,1); continue; }
    if(pr.amb) continue;
    const [a,b]=pr.path[pr.i]; P[a].ht=Math.max(P[a].ht,pr.glow*.8); P[a].hc=pr.col;
    const l=EI.get(a<b?a+'_'+b:b+'_'+a); if(l){ l.ht=Math.max(l.ht,pr.glow*Math.max(.3,pr.t)); l.hc=pr.col; } } }

/* frame a set of nodes: centroid + a camera angle that differs every time */
function frameNodes(list,dur,tight){
  if(!list.length) return;
  let cx=0,cy=0,cz=0; for(const j of list){ cx+=P[j].x; cy+=P[j].y; cz+=P[j].z; }
  cx/=list.length; cy/=list.length; cz/=list.length;
  let rad=0; for(const j of list) rad=Math.max(rad,Math.hypot(P[j].x-cx,P[j].y-cy,P[j].z-cz));
  /* nudge the orientation rather than teleporting it — a big random yaw/pitch jump
     at the end of a run is what read as a glitch */
  const dir=Math.random()<.5?-1:1;
  glide({ q:qNorm(qMul(qAxis(0,1,0,-dir*.22),cam.q)),
          dist:clamp(rad*(tight?2.2:3.4)+150,110,1600),
          tx:cx,ty:cy,tz:cz }, dur);
}

const Vault={
  set(n){ if(!MOOD[n]) return; tgt={...MOOD[n]};
    const el=document.getElementById('state'); el.querySelector('.txt').textContent=n;
    el.classList.toggle('busy',n==='seeking'||n==='working'); },
  trace(o={}){ const n=o.count||3, len=o.len||9, used=new Set(), made=[];
    const sig=signature(o.actor||'chat');
    for(let i=0;i<n;i++){ const vh=hubs.filter(j=>!P[j].hid), hs=vh.length?vh:hubs, s=hs[(Math.random()*hs.length)|0]; const p=walk(s,len,used);
      p.forEach(([a,b])=>used.add(b));
      const pr=spawn(p,{speed:o.speed||sig.speed,glow:o.glow??1,col:o.col||sig.col}); if(pr) made.push(pr); }
    if(o.ride&&made.length) chase=made[0];      /* go up in there */
    return made; },
  ride(pr){ chase=pr; },
  ignite(list){ const a=list&&list.length?list:hubs.slice(0,6);
    for(const j of a) if(P[j]) P[j].ht=Math.max(P[j].ht,.62);
    return a; },
  /* settle onto one node without touching orientation — the end of a run should
     come to rest, not cut to a new angle */
  settle(j,dur){ if(j==null||!P[j]) return;
    chase=null;                       /* hand the camera over, or the glide is ignored */
    glide({ tx:P[j].x, ty:P[j].y, tz:P[j].z, dist:clamp(cam.dist,220,340) }, dur||2600); },
  frameNodes, cool(){ for(const p of P) p.ht=0; for(const l of LK) l.ht=0; probes.length=0; }, home,
};
window.Vault=Vault;

/* =================================================================== RENDER
   WebGL2, no library. The scene is drawn as an INTENSITY FIELD — every
   fragment writes how hot it is, not what colour it is — and a single grade
   pass maps intensity onto one ramp: void → rust → ember → flame → amber →
   heat → white-gold. Structure is soft-capped below white; only the hot
   channel (comet cores, wakes, heated nodes) reaches it and feeds the bloom.
   Geometry, all instanced, all additive, nothing opaque, no depth buffer:
   node = two dotted spiral shells on one sphere, counter-rotating so their
   crossings weave and re-form; edge = one solid straight spine with a tight
   dotted helix wrapped round it; core = a soft ember billboard for mass.
   Per-node and per-link state lives in two small float textures rebuilt each
   frame from the same P/WP/LK arrays the behaviour code already owns.
   ------------------------------------------------------------------- */
let last=performance.now(), nextWander=0, ambient=0;
const LIVE_E=new Map(), LIVE_N=new Map(), rings=[], embers=[], seenPr=new Set(), EMBER_MS=260;
const gl=cv.getContext('webgl2',{alpha:true,antialias:false,premultipliedAlpha:true,depth:false,stencil:false,powerPreference:'high-performance'});
const HAS_GL=!!gl;
const HALF=HAS_GL&&!!(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float'));
const ISCALE=HALF?1:1/6;      /* RGBA8 fallback: intensity stored /6, restored in the grade */
window.__vstats={fps:0,ms:0,nodes:0,links:0,dots:0,half:HALF};

/* ---- GL plumbing ---- */
function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+'\n'+src); return s; }
function prog(vs,fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  ['aC','aD','aK'].forEach((n,i)=>gl.bindAttribLocation(p,i===0?0:(n==='aD'?1:2),n)); gl.bindAttribLocation(p,0,'aP'); gl.bindAttribLocation(p,1,'aS'); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){ const a=gl.getActiveUniform(p,i); u[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,a.name); }
  return {p,u}; }
const HDR=`#version 300 es\nprecision highp float; precision highp int; precision highp sampler2D;\n`;
/* camera: the exact math of project(), as a clip transform. The principal point sits
   at CY=.40H, so uOff carries that vertical offset; uZa/uZb are the depth mapping. */
const CAM=`uniform vec3 uT; uniform mat3 uV; uniform float uDist,uPx,uPy,uOff,uZa,uZb,uFOV,uDPR,uTime,uRad;
uniform vec2 uRes; uniform sampler2D uNT; uniform sampler2D uLT;
vec4 nd(int i,int r){ return texelFetch(uNT,ivec2(i,r),0); }
vec4 ld(int i,int r){ return texelFetch(uLT,ivec2(i,r),0); }
vec4 toClip(vec3 p,out float w,out float z2){ vec3 v=(p-uT)*uV; float x1=v.x, y1=v.y; z2=v.z; w=uDist+z2;   /* row-major upload: (p·Mᵀ) = M·p */
  return vec4(x1*uPx, uOff*w-y1*uPy, w*uZa-uZb, w); }
float dep(float z2){ return .52+.48*clamp((uRad-z2)/(2.*uRad),0.,1.); }
mat3 rotA(vec3 a,float g){ float c=cos(g),s=sin(g),t=1.-c;
  return mat3(t*a.x*a.x+c, t*a.x*a.y+s*a.z, t*a.x*a.z-s*a.y,  t*a.x*a.y-s*a.z, t*a.y*a.y+c, t*a.y*a.z+s*a.x,  t*a.x*a.z+s*a.y, t*a.y*a.z-s*a.x, t*a.z*a.z+c); }
/* the edge glow, along the comet's own direction of travel (uo = 0 at its origin):
   charging → lit behind a feathered front sweeping toward the destination;
   flying   → lit ahead of a feathered release front that follows the comet. */
float glowMask(float uo,float cf,float rf){ float m=0.;
  if(cf>=0.) m=max(m,1.-smoothstep(cf-.10,cf+.06,uo));
  if(rf>=0.) m=max(m,smoothstep(rf-.06,rf+.10,uo)); return m; }
/* the flare: a brief, local surge riding just around the comet */
float flareOf(float uo,float tc){ if(tc<0.) return 0.; float q=uo-tc; return q>0.?exp(-pow(q/.045,2.)):exp(-pow(q/.13,2.)); }
/* a right-handed frame whose y axis is the given pole */
void frameOf(vec3 a,out vec3 t1,out vec3 t2){ t1=normalize(cross(a,abs(a.y)<.9?vec3(0.,1.,0.):vec3(1.,0.,0.))); t2=cross(a,t1); }
`;
/* every scene fragment writes (I, I*warmth, coverage, 0) */
/* every scene fragment writes (structure, structure*warmth, coverage, hot). Structure is
   compressed in the grade and can never reach white however much of it piles up;
   only the hot channel — comet cores, wakes, heated tips — climbs to white-gold. */
const OUT=`layout(location=0) out vec4 o; uniform float uIS;
void emit(float I,float warm,float cov,float hot){ o=vec4(I*uIS, (I+hot)*warm*uIS, cov, hot*uIS); }`;

/* ---------- node: two dotted spiral shells, counter-rotating on one sphere ---------- */
const VS_NODE=HDR+CAM+`in vec2 aC; uniform float uND,uHov,uK,uM,uTwist;
out vec2 vQ; out float vI; out float vWarm; out float vCov; out float vHot;
void main(){ int KM=int(uK)*int(uM), per=KM*2; int node=gl_InstanceID/per, idx=gl_InstanceID-node*per;
  vec4 n0=nd(node,0), n1=nd(node,1), n2=nd(node,2), n3=nd(node,3);
  float R=n0.w*(.34+.66*n1.w);
  int sh=idx/KM, r=idx-sh*KM, k=r/int(uM), i=r-k*int(uM);
  float sg=sh==0?1.:-1.;                                   /* the second shell mirrors and counter-rotates */
  float u=(float(i)+.5)/uM, lat=(u-.5)*3.14159265;
  float lon=6.2831853*float(k)/uK + sg*(u*uTwist + uTime*n3.w + n2.x);
  vec3 dl=vec3(cos(lat)*cos(lon), sin(lat), cos(lat)*sin(lon));
  vec3 t1,t2; frameOf(n3.xyz,t1,t2); vec3 dir=t1*dl.x+n3.xyz*dl.y+t2*dl.z;
  vec3 p=n0.xyz+dir*R;

  if(w<6.||R<.01||n1.w<.02){ gl_Position=vec4(0.,0.,-3.,1.); return; }
  float ww=.028*R+.07; float px=ww*uFOV/w*uDPR; float pxc=max(px,1.3); float att=clamp(px/1.3,.45,1.);

  float zrel=clamp((z2-zc)/max(R,1e-3)*.5+.5,0.,1.); float layer=mix(1.,.5,zrel);

  float lod=clamp(R*uFOV/w*uDPR/55.,.2,1.);
  float base=uND*d*d*d*layer*att*lod*n1.w*fade;
  vI=base*(1.+emph*.9*uHov);

const FS_NODE=HDR+OUT+`in vec2 vQ; in float vI; in float vWarm; in float vCov; in float vHot;
void main(){ float r2=dot(vQ,vQ); if(r2>1.) discard; float a=1.-r2; a=a*a; emit(vI*a,vWarm,vCov*a,vHot*a); }`;

/* ---------- edge spine: the one solid line in the scene ---------- */
const VS_SPINE=HDR+CAM+`in vec2 aC; uniform float uLK,uHov,uSeg;
out float vV; out float vI; out float vWarm; out float vCov; out float vHot;
void main(){ int SEG=int(uSeg); int li=gl_InstanceID/SEG, sg=gl_InstanceID-li*SEG; vec4 l0=ld(li,0), l1=ld(li,1), l2=ld(li,2);
  int ia=int(l0.w+.5), ib=int(l1.x+.5); vec4 na=nd(ia,0), nb=nd(ib,0), ea=nd(ia,1), eb=nd(ib,1);
  float t0=float(sg)/uSeg, t1=float(sg+1)/uSeg; vec3 pa=mix(na.xyz,nb.xyz,t0), pb=mix(na.xyz,nb.xyz,t1);
  float wa,wb,za,zb; vec4 ca=toClip(pa,wa,za), cb=toClip(pb,wb,zb);
  if(wa<6.||wb<6.||na.w<.01||nb.w<.01||ea.w<.02||eb.w<.02){ gl_Position=vec4(0.,0.,-3.,1.); return; }
  bool F=aC.x<.5; vec4 c=F?ca:cb; float w=F?wa:wb, z=F?za:zb, t=F?t0:t1;
  vec2 sa=ca.xy/ca.w*uRes*.5, sb=cb.xy/cb.w*uRes*.5; vec2 dr=sb-sa; float L=length(dr); dr=L>1e-4?dr/L:vec2(1.,0.);

  c.xy+=vec2(-dr.y,dr.x)*aC.y*pxc*.5/(uRes*.5)*c.w; gl_Position=c; vV=aC.y;
  float d=dep(z); float heat=l1.y, live=l1.z, emph=l1.w, dir=l2.y;
  float uo=dir>0.?t:1.-t; float mask=glowMask(uo,l0.x,l0.y), flare=flareOf(uo,l2.x);

const FS_SPINE=HDR+OUT+`in float vV; in float vI; in float vWarm; in float vCov; in float vHot;
void main(){ float a=1.-vV*vV; a=a*a; emit(vI*a,vWarm,vCov*a,vHot*a); }`;

/* ---------- helix: many small dots wound tightly round the spine ---------- */
const VS_DOT=HDR+CAM+`in vec2 aC; in vec4 aD; /* link index, t, strand, unused */ uniform float uLK,uHov,uHelix,uTwist,uDotW,uStep;
out float vI; out float vWarm; out vec2 vQ; out float vCov; out float vHot;
void main(){ int li=int(aD.x+.5); vec4 l0=ld(li,0), l1=ld(li,1), l2=ld(li,2);
  int ia=int(l0.w+.5), ib=int(l1.x+.5); vec4 na=nd(ia,0), nb=nd(ib,0), ea=nd(ia,1), eb=nd(ib,1);
  vec3 A=na.xyz, B=nb.xyz; vec3 D=B-A; float L=length(D); D=L>1e-5?D/L:vec3(1.,0.,0.);
  vec3 n,b2; frameOf(D,n,b2);                                   /* a straight spine has one constant frame: no kinks anywhere */
  float t=aD.y, s=t*L; float hand=aD.z<.5?1.:-1.;               /* strand 0 right-handed, strand 1 left-handed: same pitch, so they cross into a lattice */
  float spin=aD.z<.5?1.:-1.;                                       /* and they turn round the spine in opposite directions, so the lattice shimmers */
  float th=hand*s*uTwist + spin*uTime*.0011 + aD.z*3.14159265;
  float rh=uHelix*smoothstep(0.,5.,s)*smoothstep(0.,5.,L-s);   /* winds down onto each centre */
  vec3 p=A+D*s+(cos(th)*n+sin(th)*b2)*rh;

  c.xy+=aC*pxc*2./uRes*c.w; gl_Position=c; vQ=aC;
  float d=dep(z2);
  float heat=l1.y, live=l1.z, emph=l1.w, tc=l2.x, dir=l2.y;
  float uo=dir>0.?t:1.-t; float mask=glowMask(uo,l0.x,l0.y), flare=flareOf(uo,tc);

  float lod=clamp(uStep*uFOV/w*uDPR/2.2,.06,1.);            /* same idea along the coil */
  float base=uLK*pow(d,1.6)*att*lod*(.82+.18*sin(th))*fade*min(ea.w,eb.w);

const FS_DOT=HDR+OUT+`in float vI; in float vWarm; in vec2 vQ; in float vCov; in float vHot;
void main(){ float r=length(vQ); if(r>1.) discard; float a=1.-smoothstep(.45,1.,r); emit(vI*a,vWarm,vCov*a,vHot*a); }`;   /* a crisp point, not a soft blob */

/* ---------- comet heads + landing ripples: billboards in the scene ---------- */
const VS_SPR=HDR+CAM+`in vec2 aC; in vec4 aS; /* xyz, size(world) */ in vec4 aK; /* glow, warmth, kind(0 head,1 ring,2 core), progress / core fade */
out vec2 vQ; out float vI; out float vWarm; out float vK; out float vP; out float vCov;
void main(){ float w,z2; vec4 c=toClip(aS.xyz,w,z2); if(w<6.){ gl_Position=vec4(0.,0.,-3.,1.); return; }

  c.xy+=aC*pxc*2./(uRes)*c.w; gl_Position=c; vQ=aC; float d=dep(z2);

const FS_SPR=HDR+OUT+`in vec2 vQ; in float vI; in float vWarm; in float vK; in float vP; in float vCov;
void main(){ float r=length(vQ); if(r>1.) discard;
  if(vK<.5){ float core=exp(-r*r*7.)*3.2+exp(-r*r*1.6)*.5; emit(vI*core*.25,vWarm,vCov*(1.-r),vI*core); }

/* ---------- post: bloom pyramid on the hot part of the field, then the grade ---------- */
const VS_Q=HDR+`out vec2 uv; void main(){ vec2 p=vec2(gl_VertexID==1?3.:-1., gl_VertexID==2?3.:-1.); uv=p*.5+.5; gl_Position=vec4(p,0.,1.); }`;
const FS_BRIGHT=HDR+`in vec2 uv; out vec4 o; uniform sampler2D uS; uniform float uThr,uIS;
void main(){ vec4 s=texture(uS,uv); if(any(isnan(s))||any(isinf(s))) s=vec4(0.); float I=s.r/uIS, hot=s.a/uIS; float tot=I+hot; float warm=tot>1e-4?s.g/(s.r+s.a):0.;

const FS_DOWN=HDR+`in vec2 uv; out vec4 o; uniform sampler2D uS; uniform vec2 uHp;
void main(){ vec4 s=texture(uS,uv)*4.; s+=texture(uS,uv-uHp); s+=texture(uS,uv+uHp); s+=texture(uS,uv+vec2(uHp.x,-uHp.y)); s+=texture(uS,uv-vec2(uHp.x,-uHp.y)); o=s/8.; }`;
const FS_UP=HDR+`in vec2 uv; out vec4 o; uniform sampler2D uS; uniform vec2 uHp;

/* one ramp for the whole field. Intensity climbs from rust through ember and flame

      for(let j=1;j<=N;j++){ let back=TAIL*j/N; let ei=ci, et=ct;
        while(back>0){ if(et-back>=0){ et-=back; back=0; } else { back-=et; ei--; if(ei<0) break; et=1; } }

    gl.uniform1f(R.dot.u.uLK,LINK_BASE*cur.lk*.62*SET.edges); gl.uniform1f(R.dot.u.uHov,hovered!=null?1:0);

    gl.uniform1f(R.node.u.uND,NODE_BASE*cur.nd*2.0); gl.uniform1f(R.node.u.uHov,hovered!=null?1:0);
    gl.uniform1f(R.node.u.uK,ARMS); gl.uniform1f(R.node.u.uM,PERARM); gl.uniform1f(R.node.u.uTwist,TWIST);
    gl.bindVertexArray(R.vaoNode); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,P.length*PERNODE);
    /* comets and ripples */
    if(SPRN){ gl.useProgram(R.spr.p); setCam(R.spr.u,cy,sy,cp,sp,now); gl.bindVertexArray(R.vaoSpr); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,SPRN); }

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,R.fb.t); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,R.pyr[0].t);

}

/* =================================================================== DISPLAY PANEL
   Obsidian's graph settings, cut to what means something on an ambient field:
   filters (orphans, detached clusters, folders), display (size, edges, glow, comet
   traffic, rotation) and forces (center, repel, link force, link distance, spacing).
   Force and size changes re-settle the layout from where it is and ease into it.
   ------------------------------------------------------------------- */
(function panel(){
  const gear=document.getElementById('gear'), pn=document.getElementById('panel'); if(!gear||!pn) return;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SECT=[
    ['Filters',[['toggle','orphans','Orphans'],['toggle','detached','Detached clusters'],['folders']]],
    ['Display',[['range','nodeSize','Node size',.5,1.8,.05,1],['range','edges','Edge brightness',0,2,.05],['range','glow','Glow',0,2,.05],
                ['range','traffic','Comet traffic',0,2,.05],['range','spin','Rotation speed',0,3,.1]]],
    ['Forces',[['range','center','Center force',0,3,.05,1],['range','repel','Repel force',0,3,.05,1],['range','linkForce','Link force',0,3,.05,1],
               ['range','linkDist','Link distance',.3,3,.05,1],['range','spacing','Node spacing',1,3,.05,1]]]];
  /* comets already in flight were routed before the filter changed: one on a hidden edge
     goes; one heading into hidden notes is cut short and dissolves at the last visible node */
  function pruneComets(){ for(let q=probes.length-1;q>=0;q--){ const pr=probes[q]; const ci=Math.min(pr.i,pr.path.length-1);
      const bad=([a,b])=>P[a].hid||P[b].hid; if(bad(pr.path[ci])){ probes.splice(q,1); continue; }
      const k=pr.path.findIndex((e,j)=>j>ci&&bad(e)); if(k>0) pr.path=pr.path.slice(0,k); } }
  let relT=0; const settleSoon=()=>{ clearTimeout(relT); relT=setTimeout(()=>relayout(true),160); };
  function stat(){ const shown=P.filter(p=>!p.hid).length;
    const o=pn.querySelector('[data-c=orphans]'), d=pn.querySelector('[data-c=detached]'), f=pn.querySelector('.pn-foot');
    if(o) o.textContent=P.filter(p=>p.orphan).length; if(d) d.textContent=P.filter(p=>p.detached).length;
    if(f) f.textContent=shown+' of '+P.length+' notes shown'; }
  function build(){ const folders=[...new Set(P.map(folderOf))].sort((a,b)=>a.localeCompare(b));
    let h='<div class="ph"><span>Display</span><button class="pb" data-act="reset">restore defaults</button></div>';
    for(const [name,items] of SECT){ h+='<details open><summary>'+name+'</summary>';
      for(const it of items){
        if(it[0]==='toggle') h+='<label class="row tg"><span class="lb">'+it[2]+'<i data-c="'+it[1]+'"></i></span><input type="checkbox" data-k="'+it[1]+'"'+(SET[it[1]]?' checked':'')+'><b></b></label>';
        else if(it[0]==='folders'){ h+='<div class="sub">Folders</div>';
          for(const f of folders) h+='<label class="row tg fd"><span class="lb">'+esc(f)+'<i>'+P.filter(p=>folderOf(p)===f).length+'</i></span><input type="checkbox" data-f="'+esc(f)+'"'+(SET.folders[f]===false?'':' checked')+'><b></b></label>'; }
        else h+='<label class="row rg"><span class="lb">'+it[2]+'<em data-v="'+it[1]+'">'+(+SET[it[1]]).toFixed(2)+'</em></span><input type="range" data-k="'+it[1]+'" min="'+it[3]+'" max="'+it[4]+'" step="'+it[5]+'" value="'+SET[it[1]]+'"'+(it[6]?' data-re="1"':'')+'></label>'; }
      if(name==='Forces') h+='<button class="pb wide" data-act="shuffle">shuffle layout</button>';
      h+='</details>'; }
    h+='<div class="pn-foot"></div>'; pn.innerHTML=h; stat(); }
  pn.addEventListener('input',e=>{ const el=e.target; if(el.type!=='range') return; const k=el.dataset.k;
    SET[k]=+el.value; const v=pn.querySelector('[data-v='+k+']'); if(v) v.textContent=(+el.value).toFixed(2);
    saveSet(); if(el.dataset.re) settleSoon(); });
  pn.addEventListener('change',e=>{ const el=e.target; if(el.type!=='checkbox') return;
    if(el.dataset.k) SET[el.dataset.k]=el.checked;
    else if(el.dataset.f!=null){ if(el.checked) delete SET.folders[el.dataset.f]; else SET.folders[el.dataset.f]=false; }
    saveSet(); applyFilters(); pruneComets(); stat(); settleSoon(); });
  pn.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='reset'){ Object.assign(SET,SET_DEFAULT,{folders:{}}); saveSet(); applyFilters(); pruneComets(); build(); relayout(true); }
    if(b.dataset.act==='shuffle'){ SET.seed=(SET.seed|0)+1; saveSet(); relayout(false,false); } });
  const open=o=>{ if(o) build(); pn.hidden=!o; gear.setAttribute('aria-expanded',o?'true':'false'); };
  gear.addEventListener('click',()=>open(pn.hidden));
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&!pn.hidden) open(false); });
  window.__panel={open,build,stat};
})();

    oc:['vineyard drone 16:9','winemaker interview','pairing carousel','bottle still — label','harvest reel','dinner-table UGC']};
  const ADS=[], ADSETS=[];

      :c.type==='restock'?[['Restock push','Purchases',c.start,c.end,.7],['Restock reach','Reach',c.start,c.end,.3]]
      :c.type==='always-on'?[['Prospecting','Purchases',c.start,c.end,.5],['Retargeting','Purchases',c.start,c.end,.35],['Awareness','Reach',c.start,c.end,.15]]
      :c.type==='event'?[['RSVP','Leads',c.start,c.end,.8],['Event reach','Reach',c.start,c.end,.2]]
      :[['Prospecting','Purchases',c.start,c.end,.55],['Traffic','Traffic',c.start,c.end,.2],['Engagement','Engagement',c.start,c.end,.25]];
    const budget=(c.type==='always-on'?1:{ee:2.5,bb:1.7,kh:1.6,oc:1.8}[c.brand])*(c.type==='always-on'?{ee:65,bb:156,kh:48,oc:66}[c.brand]*c.len:{drop:rnd(1100,1900),restock:520,promo:rnd(3200,6200),launch:rnd(1800,3400),release:rnd(1500,2600),event:700}[c.type]||1000);
    for(const [nm,goal,a0,z0,share] of plan){ const a=Math.max(0,a0), z=Math.min(D-1,z0); if(z<a) continue;
      const as={id:'s'+ADSETS.length,camp:c.id,brand:c.brand,name:nm,goal,start:a,end:z,ads:[]}; ADSETS.push(as); c.adsets.push(as.id);
      const nAds=ri(2,3), perDay=budget*share/Math.max(1,(z0-a0+1));
      const pool=CREATIVE[c.brand].slice().sort(()=>R()-.5);
      for(let k=0;k<nAds;k++){ const q=Math.exp(.35*gauss());   /* creative quality */
        const ad={id:'a'+ADS.length,adset:as.id,camp:c.id,brand:c.brand,name:`${nm} — ${pool[k%pool.length]}`,goal,q,
          spend:A(),impressions:A(),reach:A(),clicks:A(),purchases:A(),attrRevenue:A(),leads:A(),engagements:A(),lpv:A()};
        ADS.push(ad); as.ads.push(ad.id);
        const g=GOALS[goal], bf={ee:1.15,bb:.92,kh:1,oc:1.08}[c.brand];
        for(let d=a;d<=z;d++){ if(inGap(b,d)) continue;
          const sp=perDay/nAds*(q>1?1.15:.85)*(1+.2*gauss()); if(sp<=0) continue;
          const impr=sp/(g.cpm*bf*(1+.15*gauss()))*1000, freq=1.25+1.9*(d-a)/Math.max(8,z-a+1);
          const clk=impr*g.ctr*q*(1+.2*gauss());
          ad.spend[d]=sp; ad.impressions[d]=impr; ad.reach[d]=impr/freq; ad.clicks[d]=Math.max(0,clk);
          if(g.res==='purchases'){ const pu=Math.max(0,clk*rnd(.028,.06)*q); ad.purchases[d]=pu; }
          if(g.res==='leads') ad.leads[d]=Math.max(0,clk*rnd(.14,.26));
          if(g.res==='engagements') ad.engagements[d]=impr*rnd(.025,.045)*q;
          if(g.res==='lpv') ad.lpv[d]=clk*rnd(.72,.88);
        } } } }
  /* attribution never exceeds half the brand's real orders that day */
  for(const b of BRANDS){ const s=S[b.id], bAds=ADS.filter(a=>a.brand===b.id);
    for(let d=0;d<D;d++){ let pu=0; for(const a of bAds) pu+=a.purchases[d];
      const cap=s.orders[d]*.5, k=pu>cap&&pu>0?cap/pu:1, aov=s.orders[d]?s.revenue[d]/s.orders[d]:0;
      for(const a of bAds){ if(k<1) a.purchases[d]*=k; a.attrRevenue[d]=a.purchases[d]*aov;
        for(const key of ['spend','impressions','reach','clicks','purchases','attrRevenue','leads','engagements','lpv']){

      const format=FORMATS[Math.min(3,Math.floor(R()*R()*4.2))], q=Math.exp(.55*gauss())*(near?1.5:1);

  const CHANNELS=['Meta ads','Organic social','Email / SMS','Search & direct','Referral','Events & wholesale'];
  const CUSTOMERS={};
  for(const b of BRANDS){ const s=S[b.id]; const list=[]; const pool=[]; let totalNew=0;
