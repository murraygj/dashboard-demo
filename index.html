<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    /* deep ember — saturated and dark, no pale tints */
    --void:#070301;
    --coal:#120703;
    --rust:#5c1c05;
    --ember:#a3350a;
    --flame:#e05a10;
    --amber:#f08c28;
    --heat:#ffb055;
    --text:#f0dfcc;
    --text-dim:#a68b74;
    --text-faint:#6b563f;
    --edge:rgba(224,90,16,0.16);
    --edge-2:rgba(240,140,40,0.34);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--sans);
    padding-top:env(safe-area-inset-top,0px);}
  input,button,textarea{font-family:inherit;}
  ::selection{background:rgba(224,90,16,.3);}

  #bg{position:fixed;inset:0;z-index:0;background:
    radial-gradient(ellipse 120% 90% at 50% 42%, #1a0a03 0%, var(--void) 68%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(163,53,10,.16), transparent 62%);}
  canvas{position:fixed;inset:0;z-index:1;width:100%;height:100%;}
  #lbl{pointer-events:none;}
  /* keeps the graph from fighting the words */
  #scrim{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(to top, rgba(7,3,1,.92) 0%, rgba(7,3,1,.74) 20%, rgba(7,3,1,.30) 42%, rgba(7,3,1,0) 62%);}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(7,3,1,.38) 88%, rgba(7,3,1,.78) 100%);}

  /* ---------------- header ---------------- */
  header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;
    padding:20px 26px calc(20px + env(safe-area-inset-top,0px));pointer-events:none;}
  .mark{font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--text-dim);}
  .mark b{color:var(--amber);font-weight:500;}
  .state{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;font-weight:300;
    letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);margin-left:auto;}
  .state .led{width:5px;height:5px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);transition:background .4s,box-shadow .4s;}
  .state.busy .led{background:var(--heat);box-shadow:0 0 12px var(--amber);animation:blink 1.1s ease-in-out infinite;}
  @keyframes blink{50%{opacity:.35}}

  /* ---------------- console ---------------- */
  #console{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:4;pointer-events:none;
    width:min(780px,92vw);display:flex;flex-direction:column;
    padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));max-height:76vh;}
  #log{pointer-events:none;overflow-y:auto;overflow-x:hidden;padding:0 4px 18px;display:flex;flex-direction:column;gap:20px;
    mask-image:linear-gradient(to bottom,transparent 0,#000 46px,#000 100%);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 46px,#000 100%);
    scrollbar-width:thin;scrollbar-color:rgba(224,90,16,.24) transparent;}
  #log::-webkit-scrollbar{width:4px;} #log::-webkit-scrollbar-thumb{background:rgba(224,90,16,.24);border-radius:4px;}
  .msg{pointer-events:auto;display:flex;flex-direction:column;gap:6px;animation:rise .45s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .who{font-family:var(--mono);font-size:9px;font-weight:300;letter-spacing:.24em;text-transform:uppercase;color:var(--text-faint);}
  .msg.me .who{color:var(--flame);}
  .body{font-size:14.5px;font-weight:300;line-height:1.72;color:var(--text);}
  .msg.me .body{color:#d9c3ab;}
  .body .src{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
    color:var(--amber);border:1px solid var(--edge);border-radius:4px;padding:1px 6px;margin:0 2px;}
  .think{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;font-weight:300;
    letter-spacing:.1em;color:var(--text-faint);}
  .think i{width:4px;height:4px;border-radius:50%;background:var(--amber);display:inline-block;animation:pip 1.2s infinite;}
  .think i:nth-child(2){animation-delay:.16s} .think i:nth-child(3){animation-delay:.32s}
  @keyframes pip{0%,60%,100%{opacity:.2}30%{opacity:1}}

  #bar{pointer-events:auto;display:flex;align-items:flex-end;gap:10px;border:1px solid var(--edge);border-radius:13px;
    background:rgba(18,7,3,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    padding:11px 12px 11px 15px;transition:border-color .3s,box-shadow .3s;}
  #bar:focus-within{border-color:var(--edge-2);box-shadow:0 0 0 3px rgba(224,90,16,.07),0 0 42px rgba(163,53,10,.2);}
  #in{flex:1;background:none;border:none;outline:none;resize:none;color:var(--text);font-size:14.5px;
    font-weight:300;line-height:1.55;max-height:132px;padding:2px 0;}
  #in::placeholder{color:var(--text-faint);}
  #go{flex:none;width:31px;height:31px;border-radius:9px;border:1px solid var(--edge);background:rgba(224,90,16,.12);
    color:var(--amber);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .22s;}
  #go:hover{background:rgba(224,90,16,.26);border-color:var(--edge-2);color:var(--heat);}
  #go svg{width:13px;height:13px;}
  .foot{pointer-events:auto;display:flex;gap:16px;margin-top:9px;padding:0 3px;font-family:var(--mono);font-size:9px;font-weight:300;
    letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);}
  .foot span{cursor:default;} .foot kbd{border:1px solid var(--edge);border-radius:3px;padding:0 3px;color:var(--text-dim);}
  .foot .lnk{cursor:pointer;transition:color .2s;} .foot .lnk:hover{color:var(--amber);}

  /* ---------------- display panel ---------------- */
  #gear{pointer-events:auto;flex:none;width:26px;height:26px;margin-left:12px;border-radius:8px;border:1px solid var(--edge);
    background:rgba(18,7,3,.55);color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:color .2s,border-color .2s,background .2s;}
  #gear:hover,#gear[aria-expanded=true]{color:var(--amber);border-color:var(--edge-2);background:rgba(224,90,16,.10);}
  #gear svg{width:14px;height:14px;}
  #panel{position:fixed;z-index:6;top:calc(60px + env(safe-area-inset-top,0px));right:22px;width:284px;
    max-height:calc(100vh - 250px);overflow-y:auto;overscroll-behavior:contain;
    background:rgba(14,6,2,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--edge);border-radius:12px;padding:4px 16px 14px;
    font-family:var(--mono);font-size:9.5px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);
    scrollbar-width:thin;scrollbar-color:rgba(224,90,16,.24) transparent;animation:rise .3s cubic-bezier(.2,.8,.2,1);}
  #panel[hidden]{display:none;}
  #panel .ph{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;color:var(--text-faint);letter-spacing:.24em;}
  #panel details{border-top:1px solid rgba(224,90,16,.10);padding:4px 0 8px;}
  #panel summary{cursor:pointer;list-style:none;padding:8px 0 6px;color:var(--amber);letter-spacing:.24em;}
  #panel summary::-webkit-details-marker{display:none;}
  #panel summary::before{content:'';display:inline-block;width:5px;height:5px;margin:0 9px 1px 1px;border-right:1px solid var(--text-faint);
    border-bottom:1px solid var(--text-faint);transform:rotate(-45deg);transition:transform .2s;}
  #panel details[open] summary::before{transform:rotate(45deg);}
  #panel .row{display:flex;align-items:center;gap:12px;padding:5px 0;cursor:pointer;}
  #panel .rg{flex-direction:column;align-items:stretch;gap:4px;cursor:default;}
  #panel .lb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex:1;min-width:0;color:var(--text-dim);}
  #panel .lb i,#panel .lb em{font-style:normal;letter-spacing:.06em;white-space:nowrap;}
  #panel .lb i{color:var(--text-faint);} #panel .lb em{color:var(--heat);}
  #panel .fd .lb{text-transform:none;letter-spacing:.06em;font-size:10.5px;}   /* folder names are paths: keep their case */
  #panel .sub{padding:10px 0 3px;color:var(--text-faint);letter-spacing:.24em;}
  #panel .tg input{position:absolute;opacity:0;pointer-events:none;}
  #panel .tg b{flex:none;position:relative;width:24px;height:12px;border-radius:12px;border:1px solid var(--edge);background:rgba(7,3,1,.6);transition:all .2s;}
  #panel .tg b::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:var(--text-faint);transition:all .2s;}
  #panel .tg input:checked+b{background:rgba(224,90,16,.28);border-color:var(--edge-2);}
  #panel .tg input:checked+b::after{left:14px;background:var(--amber);box-shadow:0 0 6px var(--flame);}
  #panel .tg input:focus-visible+b{outline:1px solid var(--amber);outline-offset:2px;}
  #panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;margin:0;cursor:pointer;}
  #panel input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(224,90,16,.24);border-radius:2px;}
  #panel input[type=range]::-moz-range-track{height:2px;background:rgba(224,90,16,.24);border-radius:2px;}
  #panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--flame);border:none;}
  #panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--flame);border:none;}
  #panel input[type=range]:focus-visible{outline:1px solid var(--amber);outline-offset:3px;}
  #panel .pb{font:inherit;letter-spacing:.14em;color:var(--text-faint);background:none;border:1px solid var(--edge);border-radius:6px;padding:3px 8px;cursor:pointer;transition:color .2s,border-color .2s;}
  #panel .pb:hover{color:var(--amber);border-color:var(--edge-2);}
  #panel .pb.wide{display:block;width:100%;margin-top:10px;padding:7px;}
  #panel .pn-foot{padding-top:10px;color:var(--text-faint);letter-spacing:.14em;border-top:1px solid rgba(224,90,16,.10);}
  @media(max-width:700px){ #gear{margin-left:8px;} #panel{right:10px;left:10px;width:auto;top:calc(52px + env(safe-area-inset-top,0px));max-height:calc(100vh - 270px);} }

  @media(max-width:700px){ header{padding:14px 16px;} .mark{font-size:10px;letter-spacing:.18em;} #console{width:94vw;} .body{font-size:14px;} }
</style>
</head>

<div id="bg"></div>
<canvas id="c"></canvas>
<canvas id="lbl"></canvas>
<div id="vig"></div>
<div id="scrim"></div>

<header>
  <div class="mark">Vault <b>·</b> Console <b id="modetag" style="opacity:.5"></b></div>

</header>
<aside id="panel" hidden aria-label="Display settings"></aside>

<div id="console">
  <div id="log"></div>
  <div id="bar">
    <textarea id="in" rows="1" placeholder="Ask the vault…" autocomplete="off" spellcheck="false"></textarea>
    <button id="go" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="foot">
    <span><kbd>↵</kbd> send</span><span><kbd>⇧↵</kbd> newline</span>
    <span>drag to orbit · shift-drag to roll · scroll to fly in</span>
    <span><span class="lnk" id="rot">auto-rotate: on</span> · <span class="lnk" id="reset">reset view</span></span>
    <span class="lnk" id="demo">run a demo query</span>
  </div>
</div>

function buildCurves(){

  const d0=cam.dist; if(d1===d0) return;
  const {R,U}=basis(), ax=(sx-CX)*(d0-d1)/FOV, ay=(sy-CY)*(d0-d1)/FOV;
  cam.dist=d1;
  cam.tx+=R[0]*ax+U[0]*ay; cam.ty+=R[1]*ax+U[1]*ay; cam.tz+=R[2]*ax+U[2]*ay;
  /* Zooming in moves the pivot to whatever you aimed at — correct. But left alone
     the pivot stays out there, so once you pull back out you end up orbiting a point
     off the edge of the cloud and the whole thing swings around its own rim.
     Zooming out therefore walks the pivot back toward centre in proportion. */
  if(d1>d0){ const k=Math.pow(d0/d1,1.35);
    cam.tx*=k; cam.ty*=k; cam.tz*=k; }

cv.addEventListener('wheel',e=>{ e.preventDefault(); move=null; chase=null;
  let d=e.deltaY; if(e.deltaMode===1) d*=18; else if(e.deltaMode===2) d*=H;
  /* trackpads emit deltas of 1-4, wheels ~100 — normalise or one of them crawls */
  const m=Math.abs(d); d=Math.sign(d)*Math.min(m*(m<12?6:1),190);
  zoomAt(e.clientX,e.clientY,clamp(cam.dist*Math.exp(d*.0038),DMIN,DMAX));
  idleSince=performance.now(); },{passive:false});
cv.addEventListener('dblclick',()=>home(1600));
let g0=null;
cv.addEventListener('gesturestart',e=>{ e.preventDefault(); move=null; chase=null; g0={rot:e.rotation||0,scale:e.scale||1,dist:cam.dist}; });
cv.addEventListener('gesturechange',e=>{ if(!g0) return; e.preventDefault();
  const dr=((e.rotation||0)-g0.rot)*Math.PI/180; g0.rot=e.rotation||0; rotView(0,0,dr);
  zoomAt(e.clientX||CX,e.clientY||CY,clamp(g0.dist/(e.scale||1),DMIN,DMAX)); idleSince=performance.now(); });
cv.addEventListener('gestureend',e=>{ e.preventDefault(); g0=null; });

/* =================================================================== MOOD */
/* the field DIMS while something is being traced — the path has to be the loudest
   thing on screen, not one more glow among many */
/* a run should read as one extra thread through the weave, not a mode change */
const MOOD={ idle:   {flow:1,  lk:1,   nd:1,   bloom:.50},
             seeking:{flow:.72,lk:.86, nd:.95, bloom:.50},
             found:  {flow:.80,lk:.90, nd:.97, bloom:.52},
             working:{flow:.92,lk:.96, nd:.99, bloom:.50} };
let cur={...MOOD.idle}, tgt={...MOOD.idle};

/* =================================================================== PROBES */
const probes=[];
/* a run's signature: its own colour off the ember ramp and its own cadence, so two
   traces never look alike even when they cross the same ground */
const RAMP=['#ff5410','#f8600e','#ff6f14','#e84a09','#ff7d1c','#f25a0c'];
function signature(actor){ const A=actorOf(actor);
  return { col:RAMP[(Math.random()*RAMP.length)|0], speed:A.s*(.8+Math.random()*.45) }; }
function walk(start,len,avoid){ const seen=new Set(avoid||[]); seen.add(start); const path=[]; let c=start;
  for(let i=0;i<len;i++){ const nb=ADJ[c].filter(x=>!seen.has(x)&&!P[x].hid);
    if(!nb.length){ const any=ADJ[c].filter(x=>!P[x].hid); if(!any.length) break; c=any[(Math.random()*any.length)|0]; continue; }
    nb.sort((a,b)=>P[b].dg-P[a].dg);
    const n=nb[Math.random()<.5?0:(Math.random()*nb.length)|0];
    path.push([c,n]); seen.add(n); c=n; }
  return path; }
function spawn(path,o={}){ if(!path.length) return null;
  const pr={path,i:0,t:0,speed:o.speed||.00105,glow:o.glow??1,col:o.col||PAL.white,sx:null,sy:null,sz:null}; probes.push(pr); return pr; }
function probePos(pr){ const [a,b]=pr.path[Math.min(pr.i,pr.path.length-1)]; return edgePoint(a,b,pr.t); }
/* the comet never stops. Each edge is charged while the comet is INSIDE the node it
   departs from: the sweep starts as the head dissolves into that node's surface on the
   previous edge (PRE before landing) and completes as the new head condenses out of the
   far surface (EMERGE past the origin's surface). What the eye sees is one light passing
   through the node; the charge is hidden inside that handoff. */
const PRE=.10, EMERGE=.10;
/* where a node's surface cuts an edge, as a fraction of that edge's length */
const surfA=l=>Math.min(.3,NODE_R(P[l.a])/(l.len||60)), surfB=l=>Math.min(.3,NODE_R(P[l.b])/(l.len||60));
function edgeEnds(a,b){ const l=EI.get(a<b?a+'_'+b:b+'_'+a); if(!l) return {te:.05,ts:.95};
  return l.a===a?{te:surfA(l),ts:1-surfB(l)}:{te:surfB(l),ts:1-surfA(l)}; }
/* head presence along an edge: condenses out of the origin surface, dissolves into the destination surface */
function headVis(a,b,t){ const e=edgeEnds(a,b); const g=clamp((t-e.te)/EMERGE,0,1), f=clamp((e.ts-t)/EMERGE,0,1); return g*g*(3-2*g)*f*f*(3-2*f); }
/* charge progress of edge i of a path, from the comet's continuous path position tau=i+t */
function chargeOf(pr,i){ const [a,b]=pr.path[i]; const e=edgeEnds(a,b); const tau=pr.i+pr.t;
  const start=i===0?0:i-PRE, end=i+e.te+EMERGE*.75; return clamp((tau-start)/(end-start),0,1); }
function stepProbes(dt){
  for(let i=probes.length-1;i>=0;i--){ const pr=probes[i];
    pr.t+=pr.speed*dt;
    while(pr.t>=1){ pr.t-=1; const [a,b]=pr.path[pr.i];
      /* only deliberate runs leave a mark — ambient drift would otherwise keep the
         whole field churning colour, which is the thing that had to go */
      if(!pr.amb){ P[b].ht=Math.max(P[b].ht,pr.glow); P[b].hc=pr.col;
        const l=EI.get(a<b?a+'_'+b:b+'_'+a); if(l){ l.ht=Math.max(l.ht,pr.glow); l.hc=pr.col; } }
      /* one self-contained, self-timed ripple per landing — independent lifetimes
         mean two comets arriving at once overlap instead of fighting for one slot */
      if(rings.length<70) rings.push({n:b,t0:performance.now(),dur:820+Math.random()*260,g:pr.glow});
      pr.i++; if(pr.i>=pr.path.length){ pr.done=true; break; } }
    if(pr.done){ probes.splice(i,1); continue; }
    if(pr.amb) continue;
    const [a,b]=pr.path[pr.i]; P[a].ht=Math.max(P[a].ht,pr.glow*.8); P[a].hc=pr.col;
    const l=EI.get(a<b?a+'_'+b:b+'_'+a); if(l){ l.ht=Math.max(l.ht,pr.glow*Math.max(.3,pr.t)); l.hc=pr.col; } } }

/* frame a set of nodes: centroid + a camera angle that differs every time */
function frameNodes(list,dur,tight){
  if(!list.length) return;
  let cx=0,cy=0,cz=0; for(const j of list){ cx+=P[j].x; cy+=P[j].y; cz+=P[j].z; }
  cx/=list.length; cy/=list.length; cz/=list.length;
  let rad=0; for(const j of list) rad=Math.max(rad,Math.hypot(P[j].x-cx,P[j].y-cy,P[j].z-cz));
  /* nudge the orientation rather than teleporting it — a big random yaw/pitch jump
     at the end of a run is what read as a glitch */
  const dir=Math.random()<.5?-1:1;
  glide({ q:qNorm(qMul(qAxis(0,1,0,-dir*.22),cam.q)),
          dist:clamp(rad*(tight?2.2:3.4)+150,110,1600),
          tx:cx,ty:cy,tz:cz }, dur);
}

const Vault={
  set(n){ if(!MOOD[n]) return; tgt={...MOOD[n]};
    const el=document.getElementById('state'); el.querySelector('.txt').textContent=n;
    el.classList.toggle('busy',n==='seeking'||n==='working'); },
  trace(o={}){ const n=o.count||3, len=o.len||9, used=new Set(), made=[];
    const sig=signature(o.actor||'chat');
    for(let i=0;i<n;i++){ const vh=hubs.filter(j=>!P[j].hid), hs=vh.length?vh:hubs, s=hs[(Math.random()*hs.length)|0]; const p=walk(s,len,used);
      p.forEach(([a,b])=>used.add(b));
      const pr=spawn(p,{speed:o.speed||sig.speed,glow:o.glow??1,col:o.col||sig.col}); if(pr) made.push(pr); }
    if(o.ride&&made.length) chase=made[0];      /* go up in there */
    return made; },
  ride(pr){ chase=pr; },
  ignite(list){ const a=list&&list.length?list:hubs.slice(0,6);
    for(const j of a) if(P[j]) P[j].ht=Math.max(P[j].ht,.62);
    return a; },
  /* settle onto one node without touching orientation — the end of a run should
     come to rest, not cut to a new angle */
  settle(j,dur){ if(j==null||!P[j]) return;
    chase=null;                       /* hand the camera over, or the glide is ignored */
    glide({ tx:P[j].x, ty:P[j].y, tz:P[j].z, dist:clamp(cam.dist,220,340) }, dur||2600); },
  frameNodes, cool(){ for(const p of P) p.ht=0; for(const l of LK) l.ht=0; probes.length=0; }, home,
};
window.Vault=Vault;

/* =================================================================== RENDER
   WebGL2, no library. The scene is drawn as an INTENSITY FIELD — every
   fragment writes how hot it is, not what colour it is — and a single grade
   pass maps intensity onto one ramp: void → rust → ember → flame → amber →
   heat → white-gold. Structure is soft-capped below white; only the hot
   channel (comet cores, wakes, heated nodes) reaches it and feeds the bloom.
   Geometry, all instanced, all additive, nothing opaque, no depth buffer:
   node = two dotted spiral shells on one sphere, counter-rotating so their
   crossings weave and re-form; edge = one solid straight spine with a tight
   dotted helix wrapped round it; core = a soft ember billboard for mass.
   Per-node and per-link state lives in two small float textures rebuilt each
   frame from the same P/WP/LK arrays the behaviour code already owns.
   ------------------------------------------------------------------- */
let last=performance.now(), nextWander=0, ambient=0;
const LIVE_E=new Map(), LIVE_N=new Map(), rings=[], embers=[], seenPr=new Set(), EMBER_MS=260;
const gl=cv.getContext('webgl2',{alpha:true,antialias:false,premultipliedAlpha:true,depth:false,stencil:false,powerPreference:'high-performance'});
const HAS_GL=!!gl;
const HALF=HAS_GL&&!!(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float'));
const ISCALE=HALF?1:1/6;      /* RGBA8 fallback: intensity stored /6, restored in the grade */
window.__vstats={fps:0,ms:0,nodes:0,links:0,dots:0,half:HALF};

/* ---- GL plumbing ---- */
function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+'\n'+src); return s; }
function prog(vs,fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  ['aC','aD','aK'].forEach((n,i)=>gl.bindAttribLocation(p,i===0?0:(n==='aD'?1:2),n)); gl.bindAttribLocation(p,0,'aP'); gl.bindAttribLocation(p,1,'aS'); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){ const a=gl.getActiveUniform(p,i); u[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,a.name); }
  return {p,u}; }
const HDR=`#version 300 es\nprecision highp float; precision highp int; precision highp sampler2D;\n`;
/* camera: the exact math of project(), as a clip transform. The principal point sits
   at CY=.40H, so uOff carries that vertical offset; uZa/uZb are the depth mapping. */
const CAM=`uniform vec3 uT; uniform mat3 uV; uniform float uDist,uPx,uPy,uOff,uZa,uZb,uFOV,uDPR,uTime,uRad;
uniform vec2 uRes; uniform sampler2D uNT; uniform sampler2D uLT;
vec4 nd(int i,int r){ return texelFetch(uNT,ivec2(i,r),0); }
vec4 ld(int i,int r){ return texelFetch(uLT,ivec2(i,r),0); }
vec4 toClip(vec3 p,out float w,out float z2){ vec3 v=(p-uT)*uV; float x1=v.x, y1=v.y; z2=v.z; w=uDist+z2;   /* row-major upload: (p·Mᵀ) = M·p */
  return vec4(x1*uPx, uOff*w-y1*uPy, w*uZa-uZb, w); }

mat3 rotA(vec3 a,float g){ float c=cos(g),s=sin(g),t=1.-c;

/* the edge glow, along the comet's own direction of travel (uo = 0 at its origin):
   charging → lit behind a feathered front sweeping toward the destination;
   flying   → lit ahead of a feathered release front that follows the comet. */
float glowMask(float uo,float cf,float rf){ float m=0.;
  if(cf>=0.) m=max(m,1.-smoothstep(cf-.10,cf+.06,uo));
  if(rf>=0.) m=max(m,smoothstep(rf-.06,rf+.10,uo)); return m; }
/* the flare: a brief, local surge riding just around the comet */
float flareOf(float uo,float tc){ if(tc<0.) return 0.; float q=uo-tc; return q>0.?exp(-pow(q/.045,2.)):exp(-pow(q/.13,2.)); }
/* a right-handed frame whose y axis is the given pole */
void frameOf(vec3 a,out vec3 t1,out vec3 t2){ t1=normalize(cross(a,abs(a.y)<.9?vec3(0.,1.,0.):vec3(1.,0.,0.))); t2=cross(a,t1); }
`;
/* every scene fragment writes (I, I*warmth, coverage, 0) */
/* every scene fragment writes (structure, structure*warmth, coverage, hot). Structure is
   compressed in the grade and can never reach white however much of it piles up;
   only the hot channel — comet cores, wakes, heated tips — climbs to white-gold. */
const OUT=`layout(location=0) out vec4 o; uniform float uIS;
void emit(float I,float warm,float cov,float hot){ o=vec4(I*uIS, (I+hot)*warm*uIS, cov, hot*uIS); }`;

/* ---------- node: two dotted spiral shells, counter-rotating on one sphere ---------- */
const VS_NODE=HDR+CAM+`in vec2 aC; uniform float uND,uHov,uK,uM,uTwist;
out vec2 vQ; out float vI; out float vWarm; out float vCov; out float vHot;
void main(){ int KM=int(uK)*int(uM), per=KM*2; int node=gl_InstanceID/per, idx=gl_InstanceID-node*per;
  vec4 n0=nd(node,0), n1=nd(node,1), n2=nd(node,2), n3=nd(node,3);
  float R=n0.w*(.34+.66*n1.w);
  int sh=idx/KM, r=idx-sh*KM, k=r/int(uM), i=r-k*int(uM);
  float sg=sh==0?1.:-1.;                                   /* the second shell mirrors and counter-rotates */
  float u=(float(i)+.5)/uM, lat=(u-.5)*3.14159265;
  float lon=6.2831853*float(k)/uK + sg*(u*uTwist + uTime*n3.w + n2.x);
  vec3 dl=vec3(cos(lat)*cos(lon), sin(lat), cos(lat)*sin(lon));
  vec3 t1,t2; frameOf(n3.xyz,t1,t2); vec3 dir=t1*dl.x+n3.xyz*dl.y+t2*dl.z;
  vec3 p=n0.xyz+dir*R;
  float w,z2,wc,zc; vec4 c=toClip(p,w,z2); toClip(n0.xyz,wc,zc);
  if(w<6.||R<.01||n1.w<.02){ gl_Position=vec4(0.,0.,-3.,1.); return; }
  float ww=.028*R+.07; float px=ww*uFOV/w*uDPR; float pxc=max(px,1.3); float att=clamp(px/1.3,.45,1.);
  c.xy+=aC*pxc*2./uRes*c.w; gl_Position=c; vQ=aC;
  /* the far side of the shell sits dimmer than the near side, so the sphere reads in depth */
  float zrel=clamp((z2-zc)/max(R,1e-3)*.5+.5,0.,1.); float layer=mix(1.,.5,zrel);
  float d=dep(z2);

  float fade=mix(1., mix(.20,1.,emph), uHov);
  /* dots that pile into a few pixels are held back, so a far node is a glowing dotted ball, not a flare */
  float lod=clamp(R*uFOV/w*uDPR/55.,.2,1.);
  float base=uND*d*d*d*layer*att*lod*n1.w*fade;
  vI=base*(1.+emph*.9*uHov);
  vHot=base*(heat*2.4+live*1.3+emph*.8*uHov);
  vWarm=n2.z; vCov=.6*att*lod; }`;
const FS_NODE=HDR+OUT+`in vec2 vQ; in float vI; in float vWarm; in float vCov; in float vHot;
void main(){ float r2=dot(vQ,vQ); if(r2>1.) discard; float a=1.-r2; a=a*a; emit(vI*a,vWarm,vCov*a,vHot*a); }`;

/* ---------- edge spine: the one solid line in the scene ---------- */
const VS_SPINE=HDR+CAM+`in vec2 aC; uniform float uLK,uHov,uSeg;
out float vV; out float vI; out float vWarm; out float vCov; out float vHot;
void main(){ int SEG=int(uSeg); int li=gl_InstanceID/SEG, sg=gl_InstanceID-li*SEG; vec4 l0=ld(li,0), l1=ld(li,1), l2=ld(li,2);
  int ia=int(l0.w+.5), ib=int(l1.x+.5); vec4 na=nd(ia,0), nb=nd(ib,0), ea=nd(ia,1), eb=nd(ib,1);
  float t0=float(sg)/uSeg, t1=float(sg+1)/uSeg; vec3 pa=mix(na.xyz,nb.xyz,t0), pb=mix(na.xyz,nb.xyz,t1);
  float wa,wb,za,zb; vec4 ca=toClip(pa,wa,za), cb=toClip(pb,wb,zb);
  if(wa<6.||wb<6.||na.w<.01||nb.w<.01||ea.w<.02||eb.w<.02){ gl_Position=vec4(0.,0.,-3.,1.); return; }
  bool F=aC.x<.5; vec4 c=F?ca:cb; float w=F?wa:wb, z=F?za:zb, t=F?t0:t1;
  vec2 sa=ca.xy/ca.w*uRes*.5, sb=cb.xy/cb.w*uRes*.5; vec2 dr=sb-sa; float L=length(dr); dr=L>1e-4?dr/L:vec2(1.,0.);
  float px=.16*uFOV/w*uDPR; float pxc=max(px,1.0); float att=clamp(px/1.0,.5,1.);
  c.xy+=vec2(-dr.y,dr.x)*aC.y*pxc*.5/(uRes*.5)*c.w; gl_Position=c; vV=aC.y;
  float d=dep(z); float heat=l1.y, live=l1.z, emph=l1.w, dir=l2.y;
  float uo=dir>0.?t:1.-t; float mask=glowMask(uo,l0.x,l0.y), flare=flareOf(uo,l2.x);
  float fade=mix(1., mix(.14,1.5,emph), uHov);

  float lit=uLK*d*att*live*mask;                                /* occupancy glow, not subject to lod */
  vI=base*(1.+heat*.9)+lit*2.2; vHot=base*heat*1.6+lit*1.6+uLK*d*att*live*flare*5.; vWarm=l2.z; vCov=.45*att+lit*.3; }`;
const FS_SPINE=HDR+OUT+`in float vV; in float vI; in float vWarm; in float vCov; in float vHot;
void main(){ float a=1.-vV*vV; a=a*a; emit(vI*a,vWarm,vCov*a,vHot*a); }`;

/* ---------- helix: many small dots wound tightly round the spine ---------- */
const VS_DOT=HDR+CAM+`in vec2 aC; in vec4 aD; /* link index, t, strand, unused */ uniform float uLK,uHov,uHelix,uTwist,uDotW,uStep;
out float vI; out float vWarm; out vec2 vQ; out float vCov; out float vHot;
void main(){ int li=int(aD.x+.5); vec4 l0=ld(li,0), l1=ld(li,1), l2=ld(li,2);
  int ia=int(l0.w+.5), ib=int(l1.x+.5); vec4 na=nd(ia,0), nb=nd(ib,0), ea=nd(ia,1), eb=nd(ib,1);
  vec3 A=na.xyz, B=nb.xyz; vec3 D=B-A; float L=length(D); D=L>1e-5?D/L:vec3(1.,0.,0.);

  float t=aD.y, s=t*L; float hand=aD.z<.5?1.:-1.;               /* strand 0 right-handed, strand 1 left-handed: same pitch, so they cross into a lattice */
  float spin=aD.z<.5?1.:-1.;                                       /* and they turn round the spine in opposite directions, so the lattice shimmers */
  float th=hand*s*uTwist + spin*uTime*.0011 + aD.z*3.14159265;
  float rh=uHelix*smoothstep(0.,5.,s)*smoothstep(0.,5.,L-s);   /* winds down onto each centre */
  vec3 p=A+D*s+(cos(th)*n+sin(th)*b2)*rh;
  float w,z2; vec4 c=toClip(p,w,z2); if(w<6.||na.w<.01||nb.w<.01||ea.w<.02||eb.w<.02){ gl_Position=vec4(0.,0.,-3.,1.); return; }
  float px=uDotW*uFOV/w*uDPR; float pxc=max(px,.9); float att=clamp(px/.9,.6,1.);
  c.xy+=aC*pxc*2./uRes*c.w; gl_Position=c; vQ=aC;
  float d=dep(z2);
  float heat=l1.y, live=l1.z, emph=l1.w, tc=l2.x, dir=l2.y;
  float uo=dir>0.?t:1.-t; float mask=glowMask(uo,l0.x,l0.y), flare=flareOf(uo,tc);
  /* the comet's wake: the coil just behind it burns, the rest of the wire only warms */
  float fade=mix(1., mix(.14,1.5,emph), uHov);
  float lod=clamp(uStep*uFOV/w*uDPR/2.2,.06,1.);            /* same idea along the coil */
  float base=uLK*pow(d,1.6)*att*lod*(.82+.18*sin(th))*fade*min(ea.w,eb.w);
  float lit=uLK*d*att*live*mask;                                /* occupancy glow, not held back by lod */
  vI=base*(1.+heat*.9)+lit*1.6;
  vHot=base*heat*2.2+lit*1.2+uLK*d*att*live*flare*7.;          /* the flare rides with the comet, briefly, locally */
  vWarm=l2.z; vCov=.5*att; }`;
const FS_DOT=HDR+OUT+`in float vI; in float vWarm; in vec2 vQ; in float vCov; in float vHot;

      chase.sx=chase.sx==null?q.x:chase.sx+(q.x-chase.sx)*(1-Math.pow(.30,dt/1000));
      chase.sy=chase.sy==null?q.y:chase.sy+(q.y-chase.sy)*(1-Math.pow(.30,dt/1000));
      chase.sz=chase.sz==null?q.z:chase.sz+(q.z-chase.sz)*(1-Math.pow(.30,dt/1000));
      const f=1-Math.pow(.55,dt/1000), fd=1-Math.pow(.72,dt/1000);
      cam.tx+=(chase.sx-cam.tx)*f; cam.ty+=(chase.sy-cam.ty)*f; cam.tz+=(chase.sz-cam.tz)*f;
      cam.dist+=(CHASE_DIST-cam.dist)*fd;
      rotView(0,-dt*.000025,0); } }
  else if(move){ const t=(now-move.t0)/move.dur;
    if(t>=1){ Object.assign(cam,move.to); move=null; }
    else { const e=eio(clamp(t,0,1));
      for(const k of ['dist','tx','ty','tz']) cam[k]=lerp(move.from[k],move.to[k],e);
      cam.q=qNorm(qSlerp(move.from.q,move.to.q,e)); } }
  else if(!dragging){ if(Math.hypot(vr[0],vr[1],vr[2])>.00002){ rotView(vr[0],vr[1],vr[2]); const k=Math.pow(.93,dt/16); vr=[vr[0]*k,vr[1]*k,vr[2]*k]; }
    else if(autorot&&now-idleSince>1400){ rotView(0,-dt*spin*SET.spin,0); } }
  const cy=1,sy=0,cp=1,sp=0;   /* legacy yaw/pitch args still threaded through project()/setCam(); both ignore them now */

  /* slow burn-down: embers, not strobes */
  const dec=Math.pow(.80,dt/1000);
  for(const p of P){ p.ht*=dec; p.heat+=(p.ht-p.heat)*(1-Math.pow(.05,dt/1000)); }
  for(const l of LK){ l.ht*=dec; l.heat+=(l.ht-l.heat)*(1-Math.pow(.05,dt/1000)); }

  /* layout changes ease in; hidden notes fade rather than vanish */
  if(LT){ const k=clamp((now-LT.t0)/LT.dur,0,1), e=eio(k);
    for(let i=0;i<P.length;i++){ const t=LT.to[i]; if(!t) continue; const f=LT.from[i]||t;
      P[i].x=lerp(f[0],t[0],e); P[i].y=lerp(f[1],t[1],e); P[i].z=lerp(f[2],t[2],e); }
    buildCurves(); if(k>=1){ LT=null; if(R.dotFor) R.dotFor.l=-1; } }
  { const fv=1-Math.pow(.004,dt/1000); for(const p of P){ const v=p.vis??1, tv=p.hid?0:1; p.vis=v+(tv-v)*fv; } }
  /* wobble is applied ONCE into WP and then used by both nodes and edge endpoints —
     the GPU reads the same WP for the polyhedron centre and for the arc's ends */
  for(let i=0;i<P.length;i++){ const p=P[i], w=WP[i];
    w.x=p.x+Math.sin(now*.00011+p.ph)*1.8; w.y=p.y+Math.cos(now*.00009+p.ph)*1.8; w.z=p.z+Math.sin(now*.00008+p.ph*1.7)*1.8; }
  const S=new Array(P.length);
  for(let i=0;i<P.length;i++) S[i]=project(WP[i],cy,sy,cp,sp);
  SCR=S;
  const nbset=hovered!=null?NBR[hovered]:null;

  if(HAS_GL){
    if(!R.node) initGL();
    uploadState(now,nbset);
    /* sprites: comet heads and landing ripples */
    SPRN=0;
    for(let i=0;i<P.length;i++){ const p=P[i]; if(p.gone||(p.vis??1)<.02) continue; const w=WP[i]; const life=NDAT[P.length*4+i*4+3], emph=NDAT[P.length*4+i*4+2];
      const fade=hovered!=null?lerp(.3,1,emph):1;
      pushSpr(w.x,w.y,w.z,NODE_R(p)*.5*(.34+.66*life),.22*life*(1+p.heat*1.2),-.35,2,fade); }
    for(let q=rings.length-1;q>=0;q--){ const Rg=rings[q]; const pg=(now-Rg.t0)/Rg.dur;
      if(pg>=1){ rings.splice(q,1); continue; }
      const e=1-Math.pow(1-pg,3), al=Math.pow(1-pg,2.2)*Rg.g; if(al<.012) continue;
      const w=WP[Rg.n], r0=NODE_R(P[Rg.n]);
      pushSpr(w.x,w.y,w.z,r0*(.9+e*2.2),al*1.25,.15,1,pg); }
    for(const pr of probes){ const q=probePos(pr); const wm=warmthOf(pr.col);
      const [ha,hb]=pr.path[Math.min(pr.i,pr.path.length-1)]; const hv=headVis(ha,hb,pr.t);
      /* dissolve / condense: the head shrinks and thins to nothing at the sphere's surface */
      if(hv>.003) pushSpr(q.x,q.y,q.z,(2.2+2.2*pr.glow)*(.25+.75*hv),pr.glow*(pr.amb?1.5:1.35)*hv*hv,wm,0,0);
      /* the trail walks back along the edges it actually came down, crossing corners */
      const N=pr.amb?5:8, TAIL=pr.amb?.16:.26; let ci=Math.min(pr.i,pr.path.length-1), ct=pr.t;
      for(let j=1;j<=N;j++){ let back=TAIL*j/N; let ei=ci, et=ct;
        while(back>0){ if(et-back>=0){ et-=back; back=0; } else { back-=et; ei--; if(ei<0) break; et=1; } }
        if(ei<0) break; const f=1-j/(N+1); const [ta,tb]=pr.path[ei]; const tp=edgePoint(ta,tb,et); const tv=headVis(ta,tb,et); if(tv<.003) continue;
        pushSpr(tp.x,tp.y,tp.z,(1.2+1.8*pr.glow)*(.4+.6*f)*(.4+.6*tv),pr.glow*(pr.amb?.55:.8)*f*f*tv,wm,0,0); } }
    gl.bindVertexArray(R.vaoSpr); gl.bindBuffer(gl.ARRAY_BUFFER,R.sprBuf); gl.bufferData(gl.ARRAY_BUFFER,SPR.subarray(0,SPRN*8),gl.DYNAMIC_DRAW);

    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,R.NT); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,R.LT);

    /* spines */
    gl.useProgram(R.spine.p); setCam(R.spine.u,cy,sy,cp,sp,now);
    gl.uniform1f(R.spine.u.uLK,LINK_BASE*cur.lk*.45*SET.edges); gl.uniform1f(R.spine.u.uHov,hovered!=null?1:0); gl.uniform1f(R.spine.u.uSeg,SPINE_SEG);

    /* helix dots */
    gl.useProgram(R.dot.p); setCam(R.dot.u,cy,sy,cp,sp,now);
    gl.uniform1f(R.dot.u.uLK,LINK_BASE*cur.lk*.62*SET.edges); gl.uniform1f(R.dot.u.uHov,hovered!=null?1:0);
    gl.uniform1f(R.dot.u.uHelix,SMALL?1.0:1.1); gl.uniform1f(R.dot.u.uTwist,TAU/PITCH); gl.uniform1f(R.dot.u.uDotW,.19); gl.uniform1f(R.dot.u.uStep,PITCH/DOTS_PER_TURN);
    gl.bindVertexArray(R.vaoDot); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,R.dotN);
    /* node shells */
    gl.useProgram(R.node.p); setCam(R.node.u,cy,sy,cp,sp,now);
    gl.uniform1f(R.node.u.uND,NODE_BASE*cur.nd*2.0); gl.uniform1f(R.node.u.uHov,hovered!=null?1:0);
    gl.uniform1f(R.node.u.uK,ARMS); gl.uniform1f(R.node.u.uM,PERARM); gl.uniform1f(R.node.u.uTwist,TWIST);
    gl.bindVertexArray(R.vaoNode); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,P.length*PERNODE);
    /* comets and ripples */
    if(SPRN){ gl.useProgram(R.spr.p); setCam(R.spr.u,cy,sy,cp,sp,now); gl.bindVertexArray(R.vaoSpr); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,SPRN); }
    gl.disable(gl.BLEND); gl.bindVertexArray(R.vaoQ);

    /* ---- bloom: only what is above threshold, pushed down a pyramid and back up ---- */
    gl.useProgram(R.bright.p); gl.uniform1f(R.bright.u.uThr,1.0); gl.uniform1f(R.bright.u.uIS,ISCALE); quad(R.bright,R.fb,R.pyr[0]);
    for(let i=1;i<R.pyr.length;i++) quad(R.down,R.pyr[i-1],R.pyr[i],1.0);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
    for(let i=R.pyr.length-1;i>0;i--) quad(R.up,R.pyr[i],R.pyr[i-1],1.0);
    gl.disable(gl.BLEND);
    /* ---- grade to the screen ---- */
    gl.useProgram(R.grade.p); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,cv.width,cv.height);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,R.fb.t); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,R.pyr[0].t);
    gl.uniform1i(R.grade.u.uS,0); gl.uniform1i(R.grade.u.uB,1); gl.uniform1f(R.grade.u.uBloom,cur.bloom*1.9*SET.glow); gl.uniform1f(R.grade.u.uIS,ISCALE);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  /* labels only on hover — text stays text */
  lx.setTransform(DPR,0,0,DPR,0,0); lx.clearRect(0,0,W,H);
  if(hovered!=null){ lx.textBaseline='middle'; lx.lineJoin='round';
    const lab=(i,main)=>{ const s=S[i]; if(!s) return; const p=P[i];
      const r=clamp(NODE_R(p)*s[3],1.1,120), fs=main?13:10.5;
      lx.font=(main?'500 ':'400 ')+fs+'px Inter, system-ui, sans-serif'; lx.textAlign='left';
      const x=s[0]+r+7, y=s[1];
      lx.strokeStyle='rgba(7,3,1,.92)'; lx.lineWidth=3.4; lx.strokeText(p.label||'',x,y);

    if(nbset) for(const j of nbset) if(!P[j].hid) lab(j,false);
    lab(hovered,true); }

  { const rn=performance.now(); rawAcc+=rn-rawLast; rawLast=rn; }
  fpsAcc+=dt; fpsN++; if(now-fpsAt>1000){ __vstats.rawms=+(rawAcc/fpsN).toFixed(1); rawAcc=0; __vstats.ms=+(fpsAcc/fpsN).toFixed(2); __vstats.fps=+(1000/(fpsAcc/fpsN)).toFixed(1); fpsAcc=0; fpsN=0; fpsAt=now;
    __vstats.nodes=P.length; __vstats.links=LK.length; __vstats.dots=R.dotN||0; }
  requestAnimationFrame(frame);
}

/* =================================================================== DISPLAY PANEL
   Obsidian's graph settings, cut to what means something on an ambient field:
   filters (orphans, detached clusters, folders), display (size, edges, glow, comet
   traffic, rotation) and forces (center, repel, link force, link distance, spacing).
   Force and size changes re-settle the layout from where it is and ease into it.
   ------------------------------------------------------------------- */
(function panel(){
  const gear=document.getElementById('gear'), pn=document.getElementById('panel'); if(!gear||!pn) return;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SECT=[
    ['Filters',[['toggle','orphans','Orphans'],['toggle','detached','Detached clusters'],['folders']]],
    ['Display',[['range','nodeSize','Node size',.5,1.8,.05,1],['range','edges','Edge brightness',0,2,.05],['range','glow','Glow',0,2,.05],
                ['range','traffic','Comet traffic',0,2,.05],['range','spin','Rotation speed',0,3,.1]]],
    ['Forces',[['range','center','Center force',0,3,.05,1],['range','repel','Repel force',0,3,.05,1],['range','linkForce','Link force',0,3,.05,1],
               ['range','linkDist','Link distance',.3,3,.05,1],['range','spacing','Node spacing',1,3,.05,1]]]];
  /* comets already in flight were routed before the filter changed: one on a hidden edge
     goes; one heading into hidden notes is cut short and dissolves at the last visible node */
  function pruneComets(){ for(let q=probes.length-1;q>=0;q--){ const pr=probes[q]; const ci=Math.min(pr.i,pr.path.length-1);
      const bad=([a,b])=>P[a].hid||P[b].hid; if(bad(pr.path[ci])){ probes.splice(q,1); continue; }
      const k=pr.path.findIndex((e,j)=>j>ci&&bad(e)); if(k>0) pr.path=pr.path.slice(0,k); } }
  let relT=0; const settleSoon=()=>{ clearTimeout(relT); relT=setTimeout(()=>relayout(true),160); };
  function stat(){ const shown=P.filter(p=>!p.hid).length;
    const o=pn.querySelector('[data-c=orphans]'), d=pn.querySelector('[data-c=detached]'), f=pn.querySelector('.pn-foot');
    if(o) o.textContent=P.filter(p=>p.orphan).length; if(d) d.textContent=P.filter(p=>p.detached).length;
    if(f) f.textContent=shown+' of '+P.length+' notes shown'; }
  function build(){ const folders=[...new Set(P.map(folderOf))].sort((a,b)=>a.localeCompare(b));
    let h='<div class="ph"><span>Display</span><button class="pb" data-act="reset">restore defaults</button></div>';
    for(const [name,items] of SECT){ h+='<details open><summary>'+name+'</summary>';
      for(const it of items){
        if(it[0]==='toggle') h+='<label class="row tg"><span class="lb">'+it[2]+'<i data-c="'+it[1]+'"></i></span><input type="checkbox" data-k="'+it[1]+'"'+(SET[it[1]]?' checked':'')+'><b></b></label>';
        else if(it[0]==='folders'){ h+='<div class="sub">Folders</div>';
          for(const f of folders) h+='<label class="row tg fd"><span class="lb">'+esc(f)+'<i>'+P.filter(p=>folderOf(p)===f).length+'</i></span><input type="checkbox" data-f="'+esc(f)+'"'+(SET.folders[f]===false?'':' checked')+'><b></b></label>'; }
        else h+='<label class="row rg"><span class="lb">'+it[2]+'<em data-v="'+it[1]+'">'+(+SET[it[1]]).toFixed(2)+'</em></span><input type="range" data-k="'+it[1]+'" min="'+it[3]+'" max="'+it[4]+'" step="'+it[5]+'" value="'+SET[it[1]]+'"'+(it[6]?' data-re="1"':'')+'></label>'; }
      if(name==='Forces') h+='<button class="pb wide" data-act="shuffle">shuffle layout</button>';
      h+='</details>'; }
    h+='<div class="pn-foot"></div>'; pn.innerHTML=h; stat(); }
  pn.addEventListener('input',e=>{ const el=e.target; if(el.type!=='range') return; const k=el.dataset.k;
    SET[k]=+el.value; const v=pn.querySelector('[data-v='+k+']'); if(v) v.textContent=(+el.value).toFixed(2);
    saveSet(); if(el.dataset.re) settleSoon(); });
  pn.addEventListener('change',e=>{ const el=e.target; if(el.type!=='checkbox') return;
    if(el.dataset.k) SET[el.dataset.k]=el.checked;
    else if(el.dataset.f!=null){ if(el.checked) delete SET.folders[el.dataset.f]; else SET.folders[el.dataset.f]=false; }
    saveSet(); applyFilters(); pruneComets(); stat(); settleSoon(); });
  pn.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='reset'){ Object.assign(SET,SET_DEFAULT,{folders:{}}); saveSet(); applyFilters(); pruneComets(); build(); relayout(true); }
    if(b.dataset.act==='shuffle'){ SET.seed=(SET.seed|0)+1; saveSet(); relayout(false,false); } });
  const open=o=>{ if(o) build(); pn.hidden=!o; gear.setAttribute('aria-expanded',o?'true':'false'); };
  gear.addEventListener('click',()=>open(pn.hidden));
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&!pn.hidden) open(false); });
  window.__panel={open,build,stat};
})();

const DEMO_REPLY="This is the demo build — there's no model behind this box. What you just "+
  "watched is the real behaviour though: a probe walking actual edges of the graph, the wire "+
  "it's on glowing as it passes, and the camera following it to wherever the path ends. "+
  "Served by the bridge, that route is whatever files were actually opened.";
const DEMO_SOURCES=['demo/graph.md','demo/no-model-attached.md'];

/* ===================================================================== LIVE
   When vault-bridge.py is serving this page, every animation below is driven
   by real file activity. Each actor keeps its own trail, so a read that
   follows another read animates along the actual route between those two
   notes in the graph. No invented walks.
   ------------------------------------------------------------------- */
let LIVE=false;
const trails=new Map();                    // task/actor -> last node index
const TASKS=new Set();

function actorTrace(key,from,to,actor,glow){
  const A=actorOf(actor);
  let path = (from!=null) ? route(from,to,6) : null;
  if(path&&path.length){ spawn(path,{speed:A.s,glow:glow??1,col:A.c}); return path.map(e=>e[1]); }
  // unconnected (or first touch): light the destination and a short local halo
  P[to].ht=Math.max(P[to].ht,glow??1);
  const nb=ADJ[to].slice(0,3).map(x=>[to,x]);
  if(nb.length) spawn(nb,{speed:A.s*1.4,glow:(glow??1)*.5,col:A.c});
  return [to];
}

function onEvent(ev){
  const actor=ev.actor||'system', A=actorOf(actor), key=ev.task||actor;
  switch(ev.t){
    case 'hello': LIVE=true; setLive(true); break;

    case 'read': { const j=nodeFor(ev.path); if(j==null) break;
      const touched=actorTrace(key,trails.get(key),j,actor,.9);
      trails.set(key,j);
      if(actor==='chat') Vault.ride(probes[probes.length-1]);
      break; }

    case 'write': { const j=nodeFor(ev.path); if(j==null) break;
      /* a write burns hotter and wider than a read — you should see it happen */
      P[j].ht=1; for(const k of ADJ[j]){ const l=EI.get(j<k?j+'_'+k:k+'_'+j); if(l) l.ht=Math.max(l.ht,.8); }
      trails.set(key,j);
      if(!TASKS.size) Vault.frameNodes([j,...ADJ[j].slice(0,4)],2600,true);
      break; }

    case 'create': { const j=nodeFor(ev.path);
      if(j!=null){ P[j].ht=1; P[j].born=performance.now(); }
      break; }

    case 'delete': { const j=nodeFor(ev.path); if(j!=null) P[j].dying=performance.now(); break; }

    case 'search': { const hits=(ev.hits||[]).map(nodeFor).filter(v=>v!=null);
      Vault.set('seeking');
      if(hits.length){ let prev=trails.get(key);
        hits.slice(0,4).forEach((j,i)=>setTimeout(()=>{ actorTrace(key,prev,j,actor,.85); prev=j; },i*260));
        trails.set(key,hits[0]);
        Vault.frameNodes(hits,3000,hits.length<4); }
      break; }

    case 'task':
      if(ev.phase==='start'){ TASKS.add(key); Vault.set('seeking'); }
      else { TASKS.delete(key); trails.delete(key);
        if(!TASKS.size) Vault.set('idle'); }
      break;

    case 'graph': mergeGraph(ev.nodes,ev.links); break;

    case 'say': { const b=add(ev.role==='user'?'you':'vault',ev.role==='user'?'me':'');
      type(b,ev.text,ev.role==='user'?0:12); break; }
  }
  if(ev.t==='read'||ev.t==='write') Vault.set(TASKS.size?'working':'idle');
}

/* the field grows and shrinks with the vault */
function mergeGraph(nodes,links){
  if(!nodes) return;
  const have=new Set(); for(let i=0;i<keep.length;i++){ const p=DATA.nodes[keep[i]]; if(p&&p.path) have.add(p.path); }
  let added=0;
  for(const n of nodes){ if(!n.path||have.has(n.path)) continue;
    // place it next to something it links to, so it doesn't fly in from nowhere
    const nb=(links||[]).filter(l=>l.source===n.id||l.target===n.id)
      .map(l=>nodeFor(DATA.nodes[idx.get(l.source===n.id?l.target:l.source)]?.path)).filter(v=>v!=null);
    const anchor=nb.length?P[nb[0]]:P[(Math.random()*P.length)|0];
    const j=P.length;
    P.push({t:n.type,label:n.label,path:n.path,dg:nb.length,r:1.5,heat:0,ht:1,ph:Math.random()*TAU,born:performance.now(),
      x:anchor.x+(Math.random()-.5)*46, y:anchor.y+(Math.random()-.5)*46, z:anchor.z+(Math.random()-.5)*46});
    ADJ.push([]);
    for(const k of nb){ const l={a:j,b:k,p:Math.random(),v:.00005+Math.random()*.00006,heat:0,ht:.7};
      LK.push(l); EI.set(j<k?j+'_'+k:k+'_'+j,l); ADJ[j].push(k); ADJ[k].push(j); P[k].dg++; }
    PATHI.set(n.path,j); PATHI.set(n.path.replace(/\.md$/,''),j);
    added++; }
  if(added){ applyFilters(); if(window.__panel) __panel.stat(); console.log('[graph] +'+added+' nodes'); }
}

function setLive(on){ const el=document.getElementById('state');
  el.querySelector('.txt').textContent=on?'live':'idle'; }

(function connect(){
  if(!BRIDGED) return;                       // demo: zero network calls, ever
  if(typeof EventSource==='undefined') return;
  try{ const es=new EventSource('/events');
    es.onmessage=e=>{ try{ onEvent(JSON.parse(e.data)); }catch(_){} };
    es.onerror=()=>{ /* EventSource retries on its own */ };
  }catch(_){}
})();

async function sendToVault(text){
  if(LIVE){ try{ await fetch('/say',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})}); return; }catch(_){} }
  /* every run differs: probe count, path length, speed, framing angle, zoom */
  /* one deliberate thread, slow enough to follow */
  const len=7+((Math.random()*5)|0), sp=.00060+Math.random()*.00035;
  Vault.set('seeking');
  const tr=Vault.trace({count:1+((Math.random()*2)|0),len,speed:sp,ride:true});
  const th=thinking('tracing the graph');
  const lead=tr[0], last=lead&&lead.path.length?lead.path[lead.path.length-1][1]:null;
  await wait(5200);
  Vault.set('found');
  const ends=tr.map(p=>p.path.length?p.path[p.path.length-1][1]:null).filter(v=>v!=null);
  Vault.ignite(ends);
  Vault.settle(last,3000);       /* comes to rest on the note it ended on */
  th.innerHTML=`<span class="think">reading<i></i><i></i><i></i></span>`;
  await wait(1100);
  Vault.set('working');
  th.innerHTML=DEMO_SOURCES.map(s=>`<span class="src">${s}</span>`).join(' ')+'<br>';
  const span=document.createElement('span'); th.appendChild(span);
  await type(span,DEMO_REPLY);
  Vault.set('idle');
}
function send(){ const v=inp.value.trim(); if(!v) return;
  if(!LIVE) type(add('you','me'),v,0);   /* live mode: the bridge echoes it back */
  inp.value=''; inp.style.height='auto'; sendToVault(v); }
go.addEventListener('click',send);
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,132)+'px'; });
const rotEl=document.getElementById('rot');
rotEl.addEventListener('click',()=>{ autorot=!autorot; rotEl.textContent='auto-rotate: '+(autorot?'on':'off'); });
document.getElementById('reset').addEventListener('click',()=>Vault.home(1600));
document.getElementById('demo').addEventListener('click',()=>{ inp.value='where does drop 04 stand?'; send(); });

document.getElementById('modetag').textContent=BRIDGED?'':'· demo';
document.title=BRIDGED?'Vault Console':'Vault Console — demo';
(async()=>{ await wait(600); const b=add('vault');
  await type(b,BRIDGED
    ? 'Vault online. '+DATA.nodes.length+' notes, '+DATA.links.length+' links indexed.'
    : 'Demo vault. '+DATA.nodes.length+' notes, '+DATA.links.length+' links. Ask anything to watch a trace.',18); })();
</script>
