<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault Console — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    /* deep ember — saturated and dark, no pale tints */
    --void:#070301;
    --coal:#120703;
    --rust:#5c1c05;
    --ember:#a3350a;
    --flame:#e05a10;
    --amber:#f08c28;
    --heat:#ffb055;
    --text:#f0dfcc;
    --text-dim:#a68b74;
    --text-faint:#6b563f;
    --edge:rgba(224,90,16,0.16);
    --edge-2:rgba(240,140,40,0.34);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--sans);
    padding-top:env(safe-area-inset-top,0px);}
  input,button,textarea{font-family:inherit;}
  ::selection{background:rgba(224,90,16,.3);}

  #bg{position:fixed;inset:0;z-index:0;background:
    radial-gradient(ellipse 120% 90% at 50% 42%, #1a0a03 0%, var(--void) 68%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(163,53,10,.16), transparent 62%);}
  canvas{position:fixed;inset:0;z-index:1;width:100%;height:100%;}
  /* keeps the graph from fighting the words */
  #scrim{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(to top, rgba(7,3,1,.92) 0%, rgba(7,3,1,.74) 20%, rgba(7,3,1,.30) 42%, rgba(7,3,1,0) 62%);}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(7,3,1,.38) 88%, rgba(7,3,1,.78) 100%);}

  /* ---------------- header ---------------- */
  header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;
    padding:20px 26px calc(20px + env(safe-area-inset-top,0px));pointer-events:none;}
  .mark{font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--text-dim);}
  .mark b{color:var(--amber);font-weight:500;}
  .state{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;font-weight:300;
    letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);margin-left:auto;}
  .state .led{width:5px;height:5px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);transition:background .4s,box-shadow .4s;}
  .state.busy .led{background:var(--heat);box-shadow:0 0 12px var(--amber);animation:blink 1.1s ease-in-out infinite;}
  @keyframes blink{50%{opacity:.35}}

  /* ---------------- console ---------------- */
  #console{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:4;pointer-events:none;
    width:min(780px,92vw);display:flex;flex-direction:column;
    padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));max-height:76vh;}
  #log{pointer-events:none;overflow-y:auto;overflow-x:hidden;padding:0 4px 18px;display:flex;flex-direction:column;gap:20px;
    mask-image:linear-gradient(to bottom,transparent 0,#000 46px,#000 100%);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 46px,#000 100%);
    scrollbar-width:thin;scrollbar-color:rgba(224,90,16,.24) transparent;}
  #log::-webkit-scrollbar{width:4px;} #log::-webkit-scrollbar-thumb{background:rgba(224,90,16,.24);border-radius:4px;}
  .msg{pointer-events:auto;display:flex;flex-direction:column;gap:6px;animation:rise .45s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .who{font-family:var(--mono);font-size:9px;font-weight:300;letter-spacing:.24em;text-transform:uppercase;color:var(--text-faint);}
  .msg.me .who{color:var(--flame);}
  .body{font-size:14.5px;font-weight:300;line-height:1.72;color:var(--text);}
  .msg.me .body{color:#d9c3ab;}
  .body .src{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
    color:var(--amber);border:1px solid var(--edge);border-radius:4px;padding:1px 6px;margin:0 2px;}
  .think{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;font-weight:300;
    letter-spacing:.1em;color:var(--text-faint);}
  .think i{width:4px;height:4px;border-radius:50%;background:var(--amber);display:inline-block;animation:pip 1.2s infinite;}
  .think i:nth-child(2){animation-delay:.16s} .think i:nth-child(3){animation-delay:.32s}
  @keyframes pip{0%,60%,100%{opacity:.2}30%{opacity:1}}

  #bar{pointer-events:auto;display:flex;align-items:flex-end;gap:10px;border:1px solid var(--edge);border-radius:13px;
    background:rgba(18,7,3,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    padding:11px 12px 11px 15px;transition:border-color .3s,box-shadow .3s;}
  #bar:focus-within{border-color:var(--edge-2);box-shadow:0 0 0 3px rgba(224,90,16,.07),0 0 42px rgba(163,53,10,.2);}
  #in{flex:1;background:none;border:none;outline:none;resize:none;color:var(--text);font-size:14.5px;
    font-weight:300;line-height:1.55;max-height:132px;padding:2px 0;}
  #in::placeholder{color:var(--text-faint);}
  #go{flex:none;width:31px;height:31px;border-radius:9px;border:1px solid var(--edge);background:rgba(224,90,16,.12);
    color:var(--amber);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .22s;}
  #go:hover{background:rgba(224,90,16,.26);border-color:var(--edge-2);color:var(--heat);}
  #go svg{width:13px;height:13px;}
  .foot{pointer-events:auto;display:flex;gap:16px;margin-top:9px;padding:0 3px;font-family:var(--mono);font-size:9px;font-weight:300;
    letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);}
  .foot span{cursor:default;} .foot kbd{border:1px solid var(--edge);border-radius:3px;padding:0 3px;color:var(--text-dim);}
  .foot .lnk{cursor:pointer;transition:color .2s;} .foot .lnk:hover{color:var(--amber);}

  @media(max-width:700px){ header{padding:14px 16px;} .mark{font-size:10px;letter-spacing:.18em;} #console{width:94vw;} .body{font-size:14px;} }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="scrim"></div>

<header>
  <div class="mark">Vault <b>·</b> Console <b style="opacity:.5">· demo</b></div>
  <div class="state" id="state"><span class="led"></span><span class="txt">idle</span></div>
</header>

<div id="console">
  <div id="log"></div>
  <div id="bar">
    <textarea id="in" rows="1" placeholder="Ask the vault…" autocomplete="off" spellcheck="false"></textarea>
    <button id="go" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="foot">
    <span><kbd>↵</kbd> send</span><span><kbd>⇧↵</kbd> newline</span>
    <span>drag to orbit · scroll to fly in</span>
    <span><span class="lnk" id="rot">auto-rotate: on</span> · <span class="lnk" id="reset">reset view</span></span>
    <span class="lnk" id="demo">run a demo query</span>
  </div>
</div>

/* =================================================================== FIELD */
const ids=DATA.nodes.map(n=>n.id), idx=new Map(ids.map((id,i)=>[id,i]));

  for(const l of DATA.links){ const a=idx.get(l.source),b=idx.get(l.target); if(a==null||b==null||a===b) continue;

const CAP=SMALL?260:900;   /* phones get a lighter field */

const LK=[], EI=new Map(), ADJ=P.map(()=>[]);
for(const [a,b] of RAW){ const x=km.get(a),y=km.get(b); if(x==null||y==null) continue;

/* every edge bows along a stable perpendicular, so the graph reads as arcs

function buildCurves(){

function bez(l,t,a,b){ const m=1-t, w0=m*m, w1=2*m*t, w2=t*t;

(function relax(){ const n=P.length, K=Math.min(18,n-1);

const NBR=P.map((_,i)=>new Set(ADJ[i]));

const ACTOR={ chat:{c:'#ff8a2a',s:.00105}, gardener:{c:'#c9761a',s:.00060}, rnd:{c:'#ff6b14',s:.00135},

/* =================================================================== CANVAS */

/* =================================================================== CAMERA
   One long eased move at a time. Nothing chases a moving target per-frame,
   which is what made it twitch.
   ------------------------------------------------------------------- */
const FOV=780, NEAR=26, RAD=260, KMAX=26;
/* cam.dist is now a real distance from the focal point, not a fudge factor added
   to the denominator — which is why the old build could never get inside the cloud. */
const HOME={yaw:0,pitch:.14,dist:620,tx:0,ty:0,tz:0};
const cam={...HOME};
let move=null, chase=null, hovered=null, autorot=true, dragging=false, idleSince=performance.now(), vyaw=0, spin=.0000165;
const CHASE_DIST=270;   /* close enough that nodes stream past you */
function glide(to,dur,hold){ move={from:{...cam},to:{...cam,...to},t0:performance.now(),dur,hold:hold||0}; }
function home(dur){ glide({yaw:cam.yaw+(Math.random()<.5?-1:1)*(.5+Math.random()*.5),pitch:.10+Math.random()*.16,
  dist:HOME.dist,tx:0,ty:0,tz:0},dur||2600); }
function project(p,cy,sy,cp,sp){
  const x=p.x-cam.tx,y=p.y-cam.ty,z=p.z-cam.tz;

  const y1=y*cp-z1*sp, z2=y*sp+z1*cp;
  const w=cam.dist+z2;                 // depth in front of the camera
  if(w<NEAR) return null;              // behind us — you have flown past it

const ptrs=new Map(); let lastP=null, pinch0=null;

  else if(ptrs.size===2){ const[a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),dist:cam.dist}; } });

/* nearest projected node within a few px — screen positions are cached each frame */

  for(let i=0;i<SCR.length;i++){ const s=SCR[i]; if(!s) continue;
    const dx=s[0]-mx, dy=s[1]-my, d2=dx*dx+dy*dy;

const DMIN=7, DMAX=26000;       /* effectively no limit: 7 is past the core, 26000 is a speck */
/* camera basis in world space: screen-x runs along R, screen-y along U */
function basis(){ const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);

     Zooming out therefore walks the pivot back toward centre in proportion. */

cv.addEventListener('wheel',e=>{ e.preventDefault(); move=null; chase=null;

/* =================================================================== MOOD */
/* the field DIMS while something is being traced — the path has to be the loudest
   thing on screen, not one more glow among many */
/* a run should read as one extra thread through the weave, not a mode change */
const MOOD={ idle:   {flow:1,  lk:1,   nd:1,   bloom:.50},
             seeking:{flow:.72,lk:.86, nd:.95, bloom:.50},
             found:  {flow:.80,lk:.90, nd:.97, bloom:.52},
             working:{flow:.92,lk:.96, nd:.99, bloom:.50} };
let cur={...MOOD.idle}, tgt={...MOOD.idle};

/* =================================================================== PROBES */
const probes=[];
/* a run's signature: its own colour off the ember ramp and its own cadence, so two
   traces never look alike even when they cross the same ground */
const RAMP=['#ff5410','#f8600e','#ff6f14','#e84a09','#ff7d1c','#f25a0c'];
function signature(actor){ const A=actorOf(actor);

function walk(start,len,avoid){ const seen=new Set(avoid||[]); seen.add(start); const path=[]; let c=start;
  for(let i=0;i<len;i++){ const nb=ADJ[c].filter(x=>!seen.has(x));
    if(!nb.length){ const any=ADJ[c]; if(!any.length) break; c=any[(Math.random()*any.length)|0]; continue; }
    nb.sort((a,b)=>P[b].dg-P[a].dg);
    const n=nb[Math.random()<.5?0:(Math.random()*nb.length)|0];
    path.push([c,n]); seen.add(n); c=n; }
  return path; }
function spawn(path,o={}){ if(!path.length) return null;
  const pr={path,i:0,t:0,speed:o.speed||.00105,glow:o.glow??1,col:o.col||PAL.white,sx:null,sy:null,sz:null}; probes.push(pr); return pr; }
function probePos(pr){ const [a,b]=pr.path[Math.min(pr.i,pr.path.length-1)]; return edgePoint(a,b,pr.t); }
function stepProbes(dt){
  for(let i=probes.length-1;i>=0;i--){ const pr=probes[i]; pr.t+=pr.speed*dt;
    while(pr.t>=1){ pr.t-=1; const [a,b]=pr.path[pr.i];

         whole field churning colour, which is the thing that had to go */
      if(!pr.amb){ P[b].ht=Math.max(P[b].ht,pr.glow); P[b].hc=pr.col;
        const l=EI.get(a<b?a+'_'+b:b+'_'+a); if(l){ l.ht=Math.max(l.ht,pr.glow); l.hc=pr.col; } }

      if(rings.length<70) rings.push({n:b,t0:performance.now(),dur:820+Math.random()*260,g:pr.glow});
      pr.i++; if(pr.i>=pr.path.length){ pr.done=true; break; } }
    if(pr.done){ probes.splice(i,1); continue; }
    if(pr.amb) continue;
    const [a,b]=pr.path[pr.i]; P[a].ht=Math.max(P[a].ht,pr.glow*.8); P[a].hc=pr.col;
    const l=EI.get(a<b?a+'_'+b:b+'_'+a); if(l){ l.ht=Math.max(l.ht,pr.glow*Math.max(.3,pr.t)); l.hc=pr.col; } } }

/* frame a set of nodes: centroid + a camera angle that differs every time */
function frameNodes(list,dur,tight){
  if(!list.length) return;
  let cx=0,cy=0,cz=0; for(const j of list){ cx+=P[j].x; cy+=P[j].y; cz+=P[j].z; }
  cx/=list.length; cy/=list.length; cz/=list.length;
  let rad=0; for(const j of list) rad=Math.max(rad,Math.hypot(P[j].x-cx,P[j].y-cy,P[j].z-cz));
  /* nudge the orientation rather than teleporting it — a big random yaw/pitch jump
     at the end of a run is what read as a glitch */
  const dir=Math.random()<.5?-1:1;
  glide({ yaw:cam.yaw+dir*.22,
          pitch:lerp(cam.pitch,.10,.35),
          dist:clamp(rad*(tight?2.2:3.4)+150,110,1600),
          tx:cx,ty:cy,tz:cz }, dur);

const Vault={
  set(n){ if(!MOOD[n]) return; tgt={...MOOD[n]};
    const el=document.getElementById('state'); el.querySelector('.txt').textContent=n;
    el.classList.toggle('busy',n==='seeking'||n==='working'); },
  trace(o={}){ const n=o.count||3, len=o.len||9, used=new Set(), made=[];

    for(let i=0;i<n;i++){ const s=hubs[(Math.random()*hubs.length)|0]; const p=walk(s,len,used);

/* =================================================================== RENDER */
let last=performance.now(), nextWander=0, ambient=0;
const LIVE_E=new Map(), LIVE_N=new Map(), rings=[];
function frame(now){
  const dt=Math.min(48,now-last); last=now;
  for(const k in tgt) cur[k]+=(tgt[k]-cur[k])*(1-Math.pow(.2,dt/1000));

  /* keep a population of small comets drifting the graph so it's never inert;
     they thin out while a real trace is running so the route stays the loud thing */
  const want=Math.round(clamp(P.length/26,6,SMALL?10:22)*cur.flow);
  if(now>nextWander && ambient<want){ nextWander=now+90+Math.random()*260;
    let s=(Math.random()*P.length)|0, guard=0;
    while(ADJ[s].length<2 && guard++<20) s=(Math.random()*P.length)|0;
    const p=walk(s,3+((Math.random()*6)|0));
    const pr=spawn(p,{speed:.00040+Math.random()*.00045,glow:.30+Math.random()*.22,
                      col:RAMP[(Math.random()*RAMP.length)|0]});
    if(pr) pr.amb=true; }
  stepProbes(dt);
  ambient=0; for(const pr of probes) if(pr.amb) ambient++;
  /* live, non-persistent: the edge a comet occupies and the two nodes it is between
     glow while it passes, and go cold the instant it leaves. Nothing is stored. */
  LIVE_E.clear(); LIVE_N.clear();
  for(const pr of probes){ const [a,b]=pr.path[Math.min(pr.i,pr.path.length-1)];
    const k=a<b?a+'_'+b:b+'_'+a, g=pr.glow;
    LIVE_E.set(k,Math.max(LIVE_E.get(k)||0,g));
    /* leaving a fades out, arriving at b fades in */
    LIVE_N.set(a,Math.max(LIVE_N.get(a)||0,g*(1-pr.t)*.7));
    LIVE_N.set(b,Math.max(LIVE_N.get(b)||0,g*pr.t*.7)); }

  /* camera: one eased move, or a slow drift when nothing is scripted */
  if(chase){
    if(!probes.includes(chase)){ chase=null; }   /* stay where it left you */
    else { /* a heavily damped follow — the probe darts, the camera does not */
      const q=probePos(chase);
      chase.sx=chase.sx==null?q.x:chase.sx+(q.x-chase.sx)*(1-Math.pow(.30,dt/1000));
      chase.sy=chase.sy==null?q.y:chase.sy+(q.y-chase.sy)*(1-Math.pow(.30,dt/1000));
      chase.sz=chase.sz==null?q.z:chase.sz+(q.z-chase.sz)*(1-Math.pow(.30,dt/1000));
      const f=1-Math.pow(.55,dt/1000), fd=1-Math.pow(.72,dt/1000);
      cam.tx+=(chase.sx-cam.tx)*f; cam.ty+=(chase.sy-cam.ty)*f; cam.tz+=(chase.sz-cam.tz)*f;
      cam.dist+=(CHASE_DIST-cam.dist)*fd;
      cam.yaw+=dt*.000025; } }
  else if(move){ const t=(now-move.t0)/move.dur;
    if(t>=1){ Object.assign(cam,move.to); move=null; }
    else { const e=eio(clamp(t,0,1));
      for(const k of ['yaw','pitch','dist','tx','ty','tz']) cam[k]=lerp(move.from[k],move.to[k],e); } }
  else if(!dragging){ if(Math.abs(vyaw)>.00002){ cam.yaw+=vyaw; vyaw*=Math.pow(.93,dt/16); }
    else if(autorot&&now-idleSince>1400){ cam.yaw+=dt*spin; } }
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);

  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  gx.setTransform(GS,0,0,GS,0,0); gx.globalCompositeOperation='source-over';
  gx.fillStyle='rgba(0,0,0,.34)'; gx.fillRect(0,0,W,H); gx.globalCompositeOperation='lighter'; gx.lineCap='round';

  /* slow burn-down: embers, not strobes */
  const dec=Math.pow(.80,dt/1000);
  for(const p of P){ p.ht*=dec; p.heat+=(p.ht-p.heat)*(1-Math.pow(.05,dt/1000)); }
  for(const l of LK){ l.ht*=dec; l.heat+=(l.ht-l.heat)*(1-Math.pow(.05,dt/1000)); }

  /* wobble is applied ONCE into WP and then used by both nodes and edge endpoints —
     previously only the nodes drifted, so every arc missed its sphere's centre */
  for(let i=0;i<P.length;i++){ const p=P[i], w=WP[i];
    w.x=p.x+Math.sin(now*.00011+p.ph)*1.8; w.y=p.y+Math.cos(now*.00009+p.ph)*1.8; w.z=p.z+Math.sin(now*.00008+p.ph*1.7)*1.8; }
  const S=new Array(P.length);
  for(let i=0;i<P.length;i++) S[i]=project(WP[i],cy,sy,cp,sp);

  /* depth is a *cue*, not a curtain — it never drops below DFLOOR */
  const DFLOOR=.52;
  const dep=z=>DFLOOR+(1-DFLOOR)*clamp((RAD-z)/(2*RAD),0,1);

  ctx.lineWidth=1; ctx.lineJoin='round';
  const SEG=SMALL?8:12;   /* more samples: a deeper bow needs them to stay smooth */
  SCR=S;
  const nbset=hovered!=null?NBR[hovered]:null;
  for(const l of LK){ const A=S[l.a],B=S[l.b]; if(!A||!B) continue;
    const d=dep((A[2]+B[2])/2), h=Math.max(l.heat,(P[l.a].heat+P[l.b].heat)*.45);
    const touch=hovered!=null&&(l.a===hovered||l.b===hovered);
    let a=LINK_BASE*cur.lk*(.55+d*.45)+h*.2;
    if(hovered!=null) a*= touch?2.4:.16;
    const hc=touch?PAL.peak:(l.hc||PAL.hot);
    /* sample the arc, trimmed so it meets the node surface instead of its centre */
    const pts=[]; const t0=l.ta, t1=1-l.tb;
    for(let q=0;q<=SEG;q++){ const t=t0+(t1-t0)*(q/SEG);
      const s=project(bez(l,t,l.a,l.b),cy,sy,cp,sp); pts.push(s); }
    const run=(style,w)=>{ ctx.strokeStyle=style; ctx.lineWidth=w; ctx.beginPath();
      let pen=false;
      for(const s of pts){ if(!s){ pen=false; continue; } if(!pen){ ctx.moveTo(s[0],s[1]); pen=true; } else ctx.lineTo(s[0],s[1]); }
      ctx.stroke(); };
    /* filament: a soft wide sheath with a fine bright core inside it. Reads as a
       drawn line rather than a 1px hairline, without adding brightness. */
    if(touch){ run(rgba(PAL.peak,clamp(a*.35,0,.5)),3.2); run(rgba(PAL.peak,clamp(a,0,.9)),1.1); }
    else { run(fog(EDGE_COL,.28+d*.36,a*.42),2.4); run(fog(EDGE_COL,.48+d*.40,a),.85); }
    const lv=LIVE_E.get(l.a<l.b?l.a+'_'+l.b:l.b+'_'+l.a)||0;
    if(lv>.02){ run(rgba(PAL.hot,clamp(lv*.85,0,.9)),1.3+lv*1.1);
      gx.strokeStyle=rgba(PAL.warm,lv*.42*d); gx.lineWidth=3+lv*2.6; gx.beginPath();
      let pn=false; for(const s of pts){ if(!s){pn=false;continue;} if(!pn){gx.moveTo(s[0],s[1]);pn=true;} else gx.lineTo(s[0],s[1]); }
      gx.stroke(); }
    if(h>.04){ run(rgba(hc,clamp(h*.62,0,.7)),1+h*.9);
      gx.strokeStyle=rgba(hc,h*.10*d); gx.lineWidth=1.8+h; gx.beginPath();
      let pen=false; for(const s of pts){ if(!s){pen=false;continue;} if(!pen){gx.moveTo(s[0],s[1]);pen=true;} else gx.lineTo(s[0],s[1]); }
      gx.stroke(); }
  }
  /* nothing else travels the edges — comets are the only moving thing now */

  const ord=S.map((s,i)=>s?i:-1).filter(i=>i>=0).sort((a,b)=>S[b][2]-S[a][2]);
  for(const i of ord){ const p=P[i], s=S[i], d=dep(s[2]);
    let life=1;
    if(p.born){ const t=(now-p.born)/900; if(t>=1) p.born=0; else life=.15+.85*eio(clamp(t,0,1)); }
    if(p.dying){ const t=(now-p.dying)/1100; life*=1-clamp(t,0,1); if(t>=1){ p.gone=true; } }
    if(p.gone) continue;
    const h=p.heat, r=clamp(p.r*s[3]*(1+h*.8),1.1,120);
    const isH=i===hovered, isN=!!(nbset&&nbset.has(i));
    let fade=1; if(hovered!=null&&!isH&&!isN) fade=.22;
    /* one colour for the whole field — type tints were noise at this scale */
    const nc=isH?PAL.peak:(isN?mix(NODE_COL,PAL.peak,.35):((h>.08&&p.hc)?p.hc:NODE_COL));
    const lv=LIVE_N.get(i)||0;
    /* every node carries a little heat of its own */
    gx.fillStyle=rgba(NODE_COL,.16*d*fade); gx.beginPath(); gx.arc(s[0],s[1],r*2.3,0,TAU); gx.fill();
    if(h>.1){ gx.fillStyle=rgba(nc,h*.13*d); gx.beginPath(); gx.arc(s[0],s[1],r*3,0,TAU); gx.fill(); }

    /* opaque: depth is carried by colour and size, never by transparency — so near
       nodes genuinely occlude far ones and the cloud reads as solid */
    /* keep the hue saturated at every depth — blending toward near-black was what
       turned the far half of the cloud muddy */
    const base=lv>.03?rgba(mix(nc,PAL.peak,clamp(lv,0,1)*.75),1):(h>.08?rgba(nc,1):fog(nc,.52+d*.48,1));
    if(r>3.6){ const g=ctx.createRadialGradient(s[0]-r*.34,s[1]-r*.36,r*.05,s[0],s[1],r*1.02);
      g.addColorStop(0,fog(mix(nc,'#fff4e2',.62),.66+d*.34,1)); g.addColorStop(.55,base);
      g.addColorStop(1,fog(mix(nc,'#c0490c',.55),.50+d*.50,1)); ctx.fillStyle=g; }
    else ctx.fillStyle=base;
    ctx.globalAlpha=life*fade;                // birth/death, plus hover dimming
    ctx.beginPath(); ctx.arc(s[0],s[1],r,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
    if(h>.5){ ctx.strokeStyle=rgba(nc,(h-.5)*1.5); ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(s[0],s[1],r*2.4,0,TAU); ctx.stroke(); }
    if(isH){ ctx.strokeStyle=rgba(PAL.peak,.85); ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(s[0],s[1],r*2.1+3,0,TAU); ctx.stroke(); } }

  /* landing ripples: eased out, so many at once still read as calm */
  for(let q=rings.length-1;q>=0;q--){ const R=rings[q]; const pg=(now-R.t0)/R.dur;
    if(pg>=1){ rings.splice(q,1); continue; }
    const s=S[R.n]; if(!s) continue;
    const e=1-Math.pow(1-pg,3), r0=clamp(P[R.n].r*s[3],1.1,120);
    const rad=r0*(.85+e*2.4), al=Math.pow(1-pg,2.2)*R.g*.62;
    if(al<.012) continue;
    ctx.strokeStyle=rgba(PAL.hot,al); ctx.lineWidth=Math.max(.7,r0*.13*(1-pg));
    ctx.beginPath(); ctx.arc(s[0],s[1],rad,0,TAU); ctx.stroke();
    gx.strokeStyle=rgba(PAL.warm,al*.5); gx.lineWidth=Math.max(1.2,r0*.24*(1-pg));
    gx.beginPath(); gx.arc(s[0],s[1],rad,0,TAU); gx.stroke(); }

  for(const pr of probes){ const s=project(probePos(pr),cy,sy,cp,sp); if(!s) continue;
    const r=Math.min(2.4*s[3],46)*pr.glow;
    const ei=Math.min(pr.i,pr.path.length-1), [ea,eb]=pr.path[ei];
    /* walk the tail backwards along the actual edges it came down, crossing into the
       previous edge when it has just turned a corner — so it always sits ON the line */
    const TAIL=.34; let pts=[[ea,eb,pr.t]], rem=TAIL, ci=ei, ct=pr.t;
    while(rem>0){ if(ct-rem>=0){ pts.push([pr.path[ci][0],pr.path[ci][1],ct-rem]); break; }
      pts.push([pr.path[ci][0],pr.path[ci][1],0]); rem-=ct; ci--; if(ci<0) break; ct=1; }
    ctx.lineWidth=Math.max(1,r*.55); ctx.lineJoin='round';
    for(let q=0;q<pts.length-1;q++){
      const p0=pts[q], p1=pts[q+1];
      const s0=project({x:lerp(P[p0[0]].x,P[p0[1]].x,p0[2]),y:lerp(P[p0[0]].y,P[p0[1]].y,p0[2]),z:lerp(P[p0[0]].z,P[p0[1]].z,p0[2])},cy,sy,cp,sp);
      const s1=project({x:lerp(P[p1[0]].x,P[p1[1]].x,p1[2]),y:lerp(P[p1[0]].y,P[p1[1]].y,p1[2]),z:lerp(P[p1[0]].z,P[p1[1]].z,p1[2])},cy,sy,cp,sp);
      if(!s0||!s1) continue;
      const g=ctx.createLinearGradient(s1[0],s1[1],s0[0],s0[1]);
      g.addColorStop(0,rgba(pr.col,0)); g.addColorStop(1,rgba(pr.col,.9*pr.glow));
      ctx.strokeStyle=g; ctx.beginPath(); ctx.moveTo(s1[0],s1[1]); ctx.lineTo(s0[0],s0[1]); ctx.stroke(); }
    gx.fillStyle=rgba(pr.col,.75*pr.glow); gx.beginPath(); gx.arc(s[0],s[1],r*2.8,0,TAU); gx.fill();
    ctx.fillStyle=rgba(mix(pr.col,'#ffd9a0',.30),.98*pr.glow); ctx.beginPath(); ctx.arc(s[0],s[1],r*.85,0,TAU); ctx.fill(); }

  /* tight bloom only — the field itself stays sharp */
  if(hovered!=null){ ctx.textBaseline='middle'; ctx.lineJoin='round';
    const lab=(i,main)=>{ const s=S[i]; if(!s) return; const p=P[i];
      const r=clamp(p.r*s[3],1.1,120), fs=main?13:10.5;
      ctx.font=(main?'500 ':'400 ')+fs+'px Inter, system-ui, sans-serif'; ctx.textAlign='left';
      const x=s[0]+r+7, y=s[1];
      ctx.strokeStyle='rgba(7,3,1,.92)'; ctx.lineWidth=3.4; ctx.strokeText(p.label||'',x,y);
      ctx.fillStyle=main?'#fff1dc':'rgba(255,214,166,.8)'; ctx.fillText(p.label||'',x,y); };
    if(nbset) for(const j of nbset) lab(j,false);
    lab(hovered,true); }

  ctx.save(); ctx.globalCompositeOperation='lighter';
  if(canFilter) ctx.filter='blur(5px)';
  ctx.globalAlpha=.55*cur.bloom; ctx.drawImage(gl,0,0,W,H); ctx.filter='none'; ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =================================================================== CONSOLE (stub)
   No model behind this. Swap sendToVault() for the real call, keep the Vault.* lines.
   ------------------------------------------------------------------- */
const log=document.getElementById('log'), inp=document.getElementById('in'), go=document.getElementById('go');
const wait=m=>new Promise(r=>setTimeout(r,m));
function add(who,cls){ const m=document.createElement('div'); m.className='msg '+(cls||'');
  m.innerHTML=`<div class="who">${who}</div><div class="body"></div>`; log.appendChild(m); log.scrollTop=log.scrollHeight; return m.querySelector('.body'); }
function thinking(l){ const b=add('vault'); b.innerHTML=`<span class="think">${l}<i></i><i></i><i></i></span>`; log.scrollTop=log.scrollHeight; return b; }
async function type(el,t,ms=13){ el.textContent='';
  for(let i=0;i<t.length;i++){ el.textContent+=t[i]; if(i%3===0){ log.scrollTop=log.scrollHeight; await wait(ms); } } }

const REPLY="This is a static demo — there's no model behind this box. What you just "+
  "watched is the real behaviour though: a probe walking actual edges of the graph, the "+
  "wire it's on glowing as it passes, and the camera following it to wherever the path "+
  "ends. Wired to a live vault, that route is whatever files were actually opened.";
const SOURCES=['demo/graph.md','demo/no-model-attached.md'];

async function sendToVault(text){
  /* one deliberate thread, slow enough to follow */
  const len=7+((Math.random()*5)|0), sp=.00060+Math.random()*.00035;
  Vault.set('seeking');
  const tr=Vault.trace({count:1+((Math.random()*2)|0),len,speed:sp,ride:true});
  const th=thinking('tracing the graph');
  const lead=tr[0], last=lead&&lead.path.length?lead.path[lead.path.length-1][1]:null;
  await wait(5200);
  Vault.set('found');
  const ends=tr.map(p=>p.path.length?p.path[p.path.length-1][1]:null).filter(v=>v!=null);
  Vault.ignite(ends);
  Vault.settle(last,3000);       /* comes to rest on the note it ended on */
  th.innerHTML=`<span class="think">reading<i></i><i></i><i></i></span>`;
  await wait(1100);
  Vault.set('working');
  th.innerHTML=SOURCES.map(s=>`<span class="src">${s}</span>`).join(' ')+'<br>';
  const span=document.createElement('span'); th.appendChild(span);
  await type(span,REPLY);
  Vault.set('idle');
}
function send(){ const v=inp.value.trim(); if(!v) return;
  type(add('you','me'),v,0);
  inp.value=''; inp.style.height='auto'; sendToVault(v); }
go.addEventListener('click',send);
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,132)+'px'; });
const rotEl=document.getElementById('rot');
rotEl.addEventListener('click',()=>{ autorot=!autorot; rotEl.textContent='auto-rotate: '+(autorot?'on':'off'); });
document.getElementById('reset').addEventListener('click',()=>Vault.home(1600));
document.getElementById('demo').addEventListener('click',()=>{ inp.value='where does drop 04 stand?'; send(); });

(async()=>{ await wait(600); const b=add('vault');
  await type(b,'Demo vault. '+DATA.nodes.length+' notes, '+DATA.links.length+' links. Ask anything to watch a trace.',18); })();
